note: >-
  Avaya documents the SHAPE of its rate limiting but publishes no numbers, and the response headers
  that would carry the numbers are explicitly marked "Coming Soon" as of the February 2026
  documentation revision. The error-handling page names two exhaustion causes — "spike limit
  exhausted" and "tenant quota exhausted" — without stating either value, and 44 of the 367 harvested
  operations declare a 429 response while exactly one declares Retry-After among its response headers.
  So limit_count is an honest zero: a client cannot learn its budget from the docs, and cannot read it
  off a live response either.
