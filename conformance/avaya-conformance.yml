  claimed_postures:
    - {name: HIPAA, scope: healthcare provider solutions, evidence: 'https://www.avaya.com/llms.txt and https://www.avaya.com/en/solutions/healthcare-provider/ describe HIPAA-compliant communications'}
  note: >-
    Avaya operates a public Trust Center with Security, Privacy, Compliance and Artificial Intelligence
    sections. FedRAMP (Government Cloud) is the one certification named on the landing pages; a SOC 2
    or ISO 27001 report number is not published anonymously. Recorded conservatively — named
    certification for FedRAMP, claimed posture for HIPAA.
