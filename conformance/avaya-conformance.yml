generated: '2026-09-17'
method: searched
source: >-
  derived from the harvested OpenAPI documents in openapi/ and, since 2026-09-17, from the 56 WSDLs
  and one .proto harvested verbatim out of Avaya's own public SDK downloads
  (https://www.avaya.com/en/developer-support/sdks/ -> support.avaya.com/css/public/documents/<id>,
  application/zip, unauthenticated); compliance claims searched at
  https://www.avaya.com/en/trust-center/compliance/ and https://www.avaya.com/en/trust-center/
standards:
  - id: openapi-3.0
    conforms: true
    evidence: 'all 40 harvested documents declare openapi: 3.0.x with paths, components.schemas and securitySchemes'
  - id: oauth2
    conforms: true
    evidence: >-
      components.securitySchemes OAuth2 (type oauth2) with clientCredentials and password flows in
      openapi/avaya-infinity-workflow-sessions-openapi.yml; the platform token endpoint is a Keycloak
      realm at /auth/realms/avaya/protocol/openid-connect/token
  - id: oidc
    conforms: true
    evidence: >-
      Token issuance runs through the OpenID Connect endpoints of a per-tenant Keycloak realm; an
      example spec references
      https://dev-11.ixcc-sandbox.avayacloud.com/auth/realms/YOPXPM/.well-known/openid-configuration.
      The discovery document is per-tenant and therefore not anonymously probeable.
  - id: rfc7807-problem-details
    conforms: true
    evidence: '58 harvested 4xx/5xx responses declare application/problem+json with the type/title/status/detail envelope'
  - id: rfc9457-problem-details
    conforms: true
    evidence: 'same envelope; RFC 9457 obsoletes RFC 7807 — Avaya does not name either RFC by number in its docs'
  - id: rfc9727-api-catalog
    conforms: true
    evidence: >-
      https://developers.avayacloud.com/.well-known/api-catalog returns application/linkset+json (650
      bytes) naming both API products. Saved verbatim to well-known/avaya-api-catalog.json. The two
      child catalogs it links to both 404.
  - id: jwt-bearer
    conforms: true
    evidence: 'BearerAuth http/bearer with bearerFormat JWT across 34 of 40 specs'
  - id: rfc9116-security-txt
    conforms: false
    evidence: 'no /.well-known/security.txt on any Avaya host — probed 2026-09-14, all 404 or SPA shell'
  - id: rfc8594-sunset-header
    conforms: false
    evidence: 'no Sunset or Deprecation response header declared in any harvested operation and none documented'
  - id: idempotency-key
    conforms: false
    evidence: 'zero matches for /idempot/i across all 367 operations and the published docs'
  - id: ietf-ratelimit-headers
    conforms: false
    partial: true
    evidence: >-
      The RateLimit-Limit/Remaining/Reset/Policy family is documented at
      https://developers.avayacloud.com/avaya-experience-platform/docs/http-headers but marked
      "Coming Soon" and not implemented
  - id: json-api
    conforms: false
    evidence: 'plain JSON resource representations; no JSON:API document structure'
  - id: odata
    conforms: false
  - id: scim
    conforms: false
    evidence: >-
      AXP Admin - User manages users, groups, profiles and resource partitions with 42 operations but
      uses Avaya-proprietary schemas — no urn:ietf:params:scim:schemas URN appears anywhere in the
      contract, so an identity platform that already speaks SCIM needs a bespoke connector
  - id: fhir
    conforms: false
  - id: asyncapi
    conforms: false
    evidence: 'Avaya publishes webhook subscription APIs but no AsyncAPI document — see asyncapi/avaya-webhooks.yml'
  - id: wsdl-1.1
    conforms: true
    added: '2026-09-17'
    evidence: >-
      56 WSDL 1.1 documents harvested verbatim from Avaya's own public SDK downloads, declaring 25
      services and 307 distinct portType operations for Avaya Aura Contact Center. All carry
      xmlns http://schemas.xmlsoap.org/wsdl/. See wsdl/avaya-wsdl.yml for provenance.
  - id: soap-1.1
    conforms: true
    added: '2026-09-17'
    evidence: '39 of the 56 WSDLs bind over http://schemas.xmlsoap.org/wsdl/soap/ (SOAP 1.1)'
  - id: soap-1.2
    conforms: true
    added: '2026-09-17'
    evidence: '9 of the 56 WSDLs additionally declare http://schemas.xmlsoap.org/wsdl/soap12/'
  - id: ws-addressing
    conforms: true
    added: '2026-09-17'
    evidence: >-
      W3C WS-Addressing 1.0 (http://www.w3.org/2005/08/addressing) plus the 2004/08 submission
      namespace and the 2006/05 WSDL binding appear in the notification and metadata-exchange WSDLs
  - id: ws-basenotification
    conforms: true
    added: '2026-09-17'
    evidence: >-
      OASIS WSRF WS-BaseNotification — NotificationProducer (4 ops), NotificationConsumer,
      StatsNotificationProducer (3 ops) and StatsNotificationConsumer implement the publish/subscribe
      contract, with WS-BaseFaults-1.2-draft-01 for faults. This is the event surface of the
      on-premises estate, and it is the reason asyncapi/ shows only the cloud webhook catalog.
  - id: ws-resourceproperties
    conforms: true
    added: '2026-09-17'
    evidence: >-
      OASIS WSRF WS-ResourceProperties-1.2-draft-01 is imported by the Open Interfaces WSDLs. The
      standard's own WSDL was deliberately NOT saved into wsdl/ — it belongs to OASIS, not Avaya.
  - id: ws-policy
    conforms: true
    added: '2026-09-17'
    evidence: 'http://schemas.xmlsoap.org/ws/2004/09/policy and the 2002/12 predecessor declared in the Open Interfaces WSDLs'
  - id: ws-metadataexchange
    conforms: true
    added: '2026-09-17'
    evidence: 'http://schemas.xmlsoap.org/ws/2004/09/mex declared on the CCMM Agent/Outbound services'
  - id: protobuf-proto3
    conforms: true
    added: '2026-09-17'
    evidence: >-
      grpc/avaya-ip-office-mtcti3.proto — proto3, 68 messages, 12 enums, shipped in the IP Office 12.3
      MTCTI-3 SDK. Declares NO service/rpc block, so it is a wire-format schema rather than a gRPC
      service contract; recorded that way in grpc/avaya-protobuf.yml.
  - id: grpc
    conforms: false
    added: '2026-09-17'
    evidence: 'the one published .proto contains no service or rpc definitions; no gRPC endpoint is documented anywhere'
domain_standards:
  note: >-
    Contact-center and enterprise-telephony APIs have no widely adopted machine-readable domain
    standard of the SCIM/FHIR/OpenRTB kind, and Avaya declares none in its contract. The adjacent
    telecom standard that would apply is CAMARA / GSMA Open Gateway; nothing in the harvested
    contract declares a CAMARA API family, a Sparkplug topic namespace, an X12/HL7v2 message type or
    an ISO 20022 shape. This is recorded as an honest absence — reward-only, not a penalty.
  candidates_probed:
    - {id: camara, present: false, evidence: 'no CAMARA API name, path or schema in any of the 40 specs'}
    - {id: tmforum-open-api, present: false, evidence: 'no TMF6xx resource shape or TMF path convention observed'}
    - {id: scim2, present: false, evidence: 'AXP Admin - User is proprietary; no SCIM URN'}
