- name: Avaya Experience Platform (AXP) APIs
  description: 'REST APIs for Avaya Experience Platform, Avaya''s CCaaS platform: account, user, group, profile, resource
    partition, match/queue/category and timetable administration; voice administration across Communication Manager, Avaya
    Aura Device Services, Avaya Cloud Office, MS Teams and hybrid cloud gateways; customer journey and engagement history;
    digital custom chat and async messaging; drafts; transcripts; historical and producer analytics; and webhook or WebSocket
    notification subscriptions. Bearer JWT plus a tenant appkey header, served from seven regional hosts.'
