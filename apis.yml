name: Avaya
description: 'Avaya is a global enterprise communications company whose developer surface spans two cloud platforms: Avaya
  Infinity, the cloud-native customer experience platform launched in 2025, and Avaya Experience Platform (AXP), the CCaaS
  generation that preceded it. Between them they publish 40 OpenAPI 3.0 documents and 367 operations across administration
  (users, groups, profiles, queues, timetables, extensions, Communication Manager and hybrid cloud gateways), customer journey
  and engagement history, digital chat and custom messaging, transcripts, historical and real-time analytics, workflow sessions,
  outbound campaigns, and a webhook/WebSocket event surface. Authentication is a bearer JWT issued by a per-tenant Keycloak
  realm, carried alongside a tenant appkey header; every path is rooted at an account id and the Infinity host itself is per-tenant.
  Avaya publishes an llms.txt, an RFC 9727 API catalog, a public Postman workspace and first-party JavaScript SDKs, but no
  MCP server, no idempotency mechanism and no public pricing.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/avaya.png
