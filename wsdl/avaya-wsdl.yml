method: searched
source: >-
  https://www.avaya.com/en/developer-support/sdks/ — Avaya's own public "APIs and SDKs" page. Each SDK
  link resolves to https://support.avaya.com/css/public/documents/<id>, which serves the SDK archive
  directly as application/zip with no login, no SSO and no DevConnect membership. The WSDLs saved here
  were extracted verbatim from four of those archives.
note: >-
  Avaya's machine-readable contract surface is NOT limited to the 84 REST OpenAPIs harvested into
  openapi/. A second, older and much larger SOAP surface ships inside Avaya's own downloadable SDKs and
  had never been captured by this pipeline, because nothing on the cloud developer hub
  (developers.avayacloud.com) references it and no `?wsdl` endpoint is reachable on any public host —
  these servers are customer-premises appliances. The SDK download page is the only public door, and it
  is unauthenticated.
ownership:
  verdict: avaya
  justification: >-
    Every WSDL here carries a nortel.com targetNamespace (http://www.nortel.com/soa/oi/... and
    http://nortel.com/CCMMAgentWebservices/). That is NOT a different company's contract: Avaya acquired
    Nortel's Enterprise Solutions business in December 2009, and these SDKs ship today from avaya.com's
    own developer-support page under Avaya product names — "Avaya Aura CC Release 7.0 & 7.1.x CCMS Open
    Networking Web Services SDK", "... CCMM Agent Web Services SDK", "... CCMM Outbound Web Services
    SDK". The nortel.com namespaces are the pre-acquisition package names Avaya kept for wire
    compatibility with deployed clients; renaming them would have broken every integration in the field.
    Avaya Aura Contact Center IS the former Nortel Contact Center product line.
  checked: '2026-09-17'
