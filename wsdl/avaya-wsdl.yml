currency:
  finding: >-
    This surface is old and Avaya has not refreshed it. The Open Interfaces WSDLs are dated 2009-2010
    inside the archive, the CCMM WSDLs 2015, and the products they describe are Avaya Aura Contact
    Center 7.0/7.1.x. They are still the current published download on avaya.com in September 2026.
    Read them as the contract for a deployed on-premises estate, not as a surface under active
    development — that is Avaya Infinity, which is REST and lives in openapi/.
