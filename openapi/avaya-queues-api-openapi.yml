    BadRequest:
      description: Bad Request - Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorBadRequest'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 Bearer Token authentication using the client credentials flow.


        To get started, contact Avaya Support to request a `client_id` and `client_secret` provisioned with the `ADMIN_API_CONSUMER` scope.


        Once you have your credentials, [generate an access token](https://developers.avayacloud.com/avaya-infinity/reference/access-token) and include it as: `Authorization: Bearer <access_token>`

        '
