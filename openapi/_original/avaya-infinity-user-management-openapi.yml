      description: Controls whether the agent is allowed to edit their own Auto Answer Interactions setting (attributes.webRTC.autoAnswer.interaction)
        via the Edit Profile API. Defaults to false (agent cannot edit). When false and an agent attempts a self-edit that
        includes an Auto Answer change, the server returns HTTP 403 Forbidden. Administrators can always modify Auto Answer
        for any user regardless of this flag.
      default: false
    AllowAgentEditWebHIDHeadsetControl:
      type: boolean
      description: Controls whether the agent is allowed to edit their own WebHID Headset Control setting (attributes.webHID.status)
        via the Edit Profile API. Defaults to false (agent cannot edit). When false and an agent attempts a self-edit that
        includes a WebHID status change, the server returns HTTP 403 Forbidden. Administrators can always modify WebHID settings
        for any user regardless of this flag.
      default: false
