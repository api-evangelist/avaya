# x-archived-from: avaya-infinity-user-management-openapi.yml
# x-archived-on: 2026-09-16
openapi: 3.1.1
info:
  title: User Management
  description: 'APIs for creating, updating and retrieving individual users.

    '
  version: 0.0.1
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/avaya-infinity/
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: https://support.avaya.com/css/P8/documents/101038288
servers:
- url: https://core.{customerId}.ec.avayacloud.com/api/config/v1
  description: Production
  variables:
    customerId:
      description: Your organization identifier
      default: your-org-id
security:
- BearerAuth: []
tags:
- name: User
  description: 'Operations related to individual users.

    '
- name: Bulk User
  description: 'Bulk operations related to Users: Add, Update, Export.

    '
paths:
  /users:
    get:
      tags:
      - User
      summary: Get List of Users
      description: "**Required Role:** Admin Portal or Admin API Consumer\n\n\nRetrieves a list of users with optional filtering\
        \ and related data.\n\nQuery parameters control which related data is included in the response (groups, location,\
        \ CRM config)\nand whether folder information should be returned.\n\n**Status Filtering:**\n- Use the `status` query\
        \ parameter to filter by user status: `ENABLED` (default), `DISABLED`, or `ALL`\n\n**Deleted Users:**\n- Use the `deleted`\
        \ query parameter to control visibility of soft-deleted users:\n  `EXCLUDE` (default), `INCLUDE`, or `ONLY`\n- When\
        \ `deleted=ONLY`, the `status` filter is ignored because deleted users are always disabled\n"
      operationId: getUsers
      parameters:
      - name: status
        in: query
        description: 'Filter users by status.

          - `ENABLED` (default): Only enabled users

          - `DISABLED`: Only disabled users

          - `ALL`: All users regardless of status

          '
        required: false
        schema:
          type: string
          enum:
          - ENABLED
          - DISABLED
          - ALL
          default: ENABLED
      - name: deleted
        in: query
        description: "Control visibility of soft-deleted users.\n- `EXCLUDE` (default): Hide deleted users\n- `INCLUDE`: Include\
          \ deleted users alongside non-deleted users\n- `ONLY`: Return only deleted users (the `status` filter is ignored\
          \ because\n  deleted users are always disabled)\n"
        required: false
        schema:
          type: string
          enum:
          - EXCLUDE
          - INCLUDE
          - ONLY
          default: EXCLUDE
      - name: folders
        in: query
        description: Include folder hierarchy and breadcrumbs in the response
        required: false
        schema:
          type: boolean
          default: false
      - name: folderId
        in: query
        description: 'Filter users by folderId (includes subfolders recursively).

          - Omit parameter: Returns users from all folders

          - Empty string (""): Returns users in root folder only (not in any subfolder)

          - 26-character folder ID: Returns users in the specified folder AND all subfolders

          '
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/FolderId'
          - type: string
            enum:
            - ''
            description: Empty string for root folder
      - name: inFolder
        in: query
        description: Filter users that are in or not in a folder.
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/sortBy'
      - name: profileId
        in: query
        description: Filter by profile ID
        required: false
        schema:
          $ref: '#/components/schemas/ProfileId'
      - name: hasProfile
        in: query
        description: Filter users that have or do not have a profile.
        required: false
        schema:
          type: boolean
      - name: licType
        in: query
        description: Filter by license type
        required: false
        schema:
          $ref: '#/components/schemas/LicenseType'
      - name: locationId
        in: query
        description: Filter by location ID
        required: false
        schema:
          $ref: '#/components/schemas/LocationId'
      - name: hasLocation
        in: query
        description: Filter users that have or do not have a location.
        required: false
        schema:
          type: boolean
      - name: groups
        in: query
        description: Include group memberships with full group details (groupId, name, type)
        required: false
        schema:
          type: boolean
          default: true
      - name: location
        in: query
        description: Include E911 location details for each user
        required: false
        schema:
          type: boolean
          default: true
      - name: crmConfigId
        in: query
        description: Include CRM configuration details for each user
        required: false
        schema:
          type: boolean
          default: true
      - name: updatedSince
        in: query
        description: 'Filter users updated on or after this UTC timestamp.

          Must be in ISO 8601 format (e.g., 2026-01-22T00:00:00Z).

          When used with updatedUntil, updatedUntil must be greater than updatedSince.

          Note: newly created users have lastUpdated set to their creation time.

          '
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedUntil
        in: query
        description: 'Filter users updated on or before this UTC timestamp.

          Must be in ISO 8601 format (e.g., 2026-01-22T23:59:59Z).

          When used with updatedSince, must be greater than updatedSince.

          '
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      responses:
        '200':
          $ref: '#/components/responses/GetUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - User
      summary: Create a user
      description: "**Required Role:** Admin Portal or Admin API Consumer\n\n\nCreates a user.\n\nThe type of user is controlled\
        \ by the license type, which is typically\nan agent of some kind, but other types can be supported via the 'nonAgent'\
        \ type.\n\nAt a minimum, creating a user requires:\n- the user's email address\n- the user's first and last names\n\
        - the user's license type or a profile to apply to the user (the license type will be\n  taken from the profile if\
        \ specified)\n\n**License Types and Their Defaults:**\n- `nonAgent`: Limited permissions, minimal spaces (1 task,\
        \ 1 email, 1 messaging)\n- `voiceOnlyAgent`: Voice-focused permissions, phone space (2 task, 1 phone)\n- `digitalOnlyAgent`:\
        \ Digital channels, no phone (3 task, 2 email, 2 messaging)\n- `omniChannelAgent`: All channels except video (3 task,\
        \ 2 email, 1 phone, 2 messaging)\n- `omniChannelAgentEnhanced`: All channels with enhanced features and session statistics\n\
        - `hybridVoiceAgent`: Balanced voice and digital capabilities\n\n**Validation Rules:**\n- User's email address must\
        \ be unique within the account\n- License type must be valid for the account\n- Profile must exist (if profile ID\
        \ is provided)\n- Folder must exist (if folder ID is provided)\n- Location must exist (if location ID is provided)\
        \ - location IDs are system-generated\n"
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UserConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /users/{userIdOrEmail}:
    get:
      tags:
      - User
      summary: Get Single User Details
      description: '**Required Role:** Admin Portal or Admin API Consumer



        Retrieves detailed information about a specific user including their configuration,

        permissions, queue assignments, and related data.


        The path parameter can be either a userId (26-character internal ID starting with ''002'')

        or an email address.


        Query parameters control which related data is included in the response.

        '
      operationId: getUser
      parameters:
      - $ref: '#/components/parameters/userIdOrEmail'
      - name: queues
        in: query
        description: Include queue assignments with names
        required: false
        schema:
          type: boolean
          default: false
      - name: queueLogins
        in: query
        description: Include current queue login sessions
        required: false
        schema:
          type: boolean
          default: false
      - name: groups
        in: query
        description: Include group memberships
        required: false
        schema:
          type: boolean
          default: false
      - name: location
        in: query
        description: Include E911 location details
        required: false
        schema:
          type: boolean
          default: false
      - name: crmConfigId
        in: query
        description: Include CRM configuration
        required: false
        schema:
          type: boolean
          default: false
      - name: reportsTo
        in: query
        description: Include reports-to user details (supervisor/manager relationship)
        required: false
        schema:
          type: boolean
          default: false
      - name: externalUCProviderConnections
        in: query
        description: Include external UC provider connection details
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
              examples:
                success:
                  $ref: '#/components/examples/GetUserDetailSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - User
      summary: Update a user
      description: "**Required Role:** Admin Portal or Admin API Consumer\n\nUpdate one or more properties of a user. The\
        \ user can be identified by their user ID\nor email address.\n\n**Agent Self-Edit Restrictions**\nWhen an agent edits\
        \ their own profile (self-edit), the server enforces the following:\n\n*Read-only identity fields:*\nThe following\
        \ fields are always read-only for agents and cannot be modified via self-edit.\nAny attempt returns **403 Forbidden**:\n\
        `firstName`, `lastName`, `namePrefix`, `nameSuffix`, `title`, `email`, `mobile`.\nThese fields can only be changed\
        \ by an administrator.\n\n*Auto Answer / WebHID Edit Restrictions:*\n  * If `allowAgentEditAutoAnswer` is `false`\
        \ on the user record and the request includes\n    a change to `attributes.webRTC.autoAnswer.interaction`, the server\
        \ returns **403 Forbidden**.\n  * If `allowAgentEditWebHIDHeadsetControl` is `false` on the user record and the request\n\
        \    includes a change to `attributes.webHID.status`, the server returns **403 Forbidden**.\n  * Administrators editing\
        \ other users are never restricted by these flags.\n  * Agents can still modify unrestricted fields (language, timezone,\
        \ app theme, queues, etc.)\n    even when identity and Auto Answer / WebHID edits are restricted.\n\n**Agent Self-Edit\
        \ Restrictions**\nWhen an agent edits their own profile (self-edit), the server enforces the following:\n\n*Read-only\
        \ identity fields:*\nThe following fields are always read-only for agents and cannot be modified via self-edit.\n\
        Any attempt returns **403 Forbidden**:\n`firstName`, `lastName`, `namePrefix`, `nameSuffix`, `title`, `email`, `mobile`.\n\
        These fields can only be changed by an administrator.\n\n*Auto Answer / WebHID Edit Restrictions:*\n  * If `allowAgentEditAutoAnswer`\
        \ is `false` on the user record and the request includes\n    a change to `attributes.webRTC.autoAnswer.interaction`,\
        \ the server returns **403 Forbidden**.\n  * If `allowAgentEditWebHIDHeadsetControl` is `false` on the user record\
        \ and the request\n    includes a change to `attributes.webHID.status`, the server returns **403 Forbidden**.\n  *\
        \ Administrators editing other users are never restricted by these flags.\n  * Agents can still modify unrestricted\
        \ fields (language, timezone, app theme, queues, etc.)\n    even when identity and Auto Answer / WebHID edits are\
        \ restricted.\n\n** Disabling a User **\nA user can be disabled by performing an update to set the `status` property\
        \ to `disabled`.\nThis can normally only be done if:\n  * the user is not logged in\n  * the user has no active interactions\n\
        \  * the user has no pending interactions in their personal queue\nand a request to do so in any of those conditions\
        \ will fail with a 422 error. This can be\noverridden by setting the `forceDisable` query parameter.\n"
      operationId: updateUser
      parameters:
      - $ref: '#/components/parameters/userIdOrEmail'
      - $ref: '#/components/parameters/forceDisable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UserCanNotBeDisabled'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}:
    delete:
      tags:
      - User
      summary: Delete a user
      description: '**Required Role:** Admin Portal or Admin API Consumer


        Delete a user.


        Only users in the `disabled` state can be deleted. Attempting to delete an `enabled`

        user will fail with a 422 response.

        '
      operationId: deleteUser
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Result for successfully having deleted the user.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UserCanNotBeDeleted'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /users/bulk-template:
    get:
      tags:
      - Bulk User
      summary: Download Bulk Template
      description: '**Required Role:** Admin Portal or Admin API Consumer



        Downloads the Bulk Operation Template as an `.xlsx` file.

        '
      operationId: downloadBulkTemplate
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: 'Email, Account Hierarchy, Last Name, First Name, Display Name, Password, Profile, Roles, Member Of,
                Owned Groups

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /users:bulk-add:
    post:
      tags:
      - Bulk User
      summary: Bulk Add Users
      description: '**Required Role:** Admin Portal or Admin API Consumer



        Bulk adds Users using the file provided. The following file formats are supported:


        * `.xlsx`


        The following fields must be unique otherwise a `HTTP 409 Conflict` will be returned:

        * `jobName`


        Will trigger an asynchronous job, the status of which should be monitored via `/jobs/{jobId}`.

        '
      operationId: bulkAddUsers
      parameters:
      - $ref: '#/components/parameters/jobName'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /users:bulk-update:
    post:
      tags:
      - Bulk User
      summary: Bulk Update Users
      description: '**Required Role:** Admin Portal or Admin API Consumer



        Bulk updates Users using the file provided. The following file formats are supported:


        * `.xlsx`


        Will trigger an asynchronous job, the status of which should be monitored via `/jobs/{jobId}`.

        '
      operationId: bulkUpdateUsers
      parameters:
      - $ref: '#/components/parameters/jobName'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /users:bulk-export:
    post:
      tags:
      - Bulk User
      summary: Bulk Export Users
      description: '**Required Role:** Admin Portal or Admin API Consumer



        Bulk exports the list of users for an account based on the criteria provided.


        If the optional `folderId` query parameter is provided, users within that folder **and all of its subfolders

        (recursively)** will be exported.


        Will trigger an asynchronous job, the status of which should be monitored via `/jobs/{jobId}`.


        Once the job has completed, the file can be downloaded using the API `/jobs/{jobId}/exported-users`.

        '
      operationId: bulkExportUsers
      parameters:
      - $ref: '#/components/parameters/jobName'
      - name: folderId
        in: query
        description: '*(Optional)* Export users from a specific folder **and all its subfolders**.

          Provide the unique 26-character internal id of the folder.

          If omitted, all users in the account will be included.

          '
        required: false
        schema:
          $ref: '#/components/schemas/FolderId'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkExportOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 Bearer Token with scoped permissions.

        Required scopes documented per endpoint.

        '
  responses:
    CreateUserResponse:
      description: Success response for creating a user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedUser'
    UserConflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            email:
              $ref: '#/components/examples/ErrorUserEmailExists'
    UnprocessableEntity:
      description: Validation Failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorUnprocessableEntity'
    UserCanNotBeDisabled:
      description: The user can not be disabled due to being logged in or having active interactions.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UserCanNotBeDeleted:
      description: The user must be disabled before it can be deleted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GetUsersResponse:
      description: List of users
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPage'
    InternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://developers.avayacloud.com/errors/internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred while processing your request
            requestId: req_xyz789
            timestamp: '2025-12-08T10:30:05Z'
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://developers.avayacloud.com/errors/constraint-violation
            title: Constraint Violation
            status: 400
            detail: Request contains invalid or missing fields
            violations:
            - field: accountId
              message: must match "^[a-zA-Z]{6}$"
              code: 20006
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://developers.avayacloud.com/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: Bearer token expired at 2025-12-08T10:15:00Z. Request a new token.
            requestId: req_xyz789
            timestamp: '2025-12-08T10:30:05Z'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://developers.avayacloud.com/errors/forbidden
            title: Forbidden
            status: 403
            detail: 'Missing required scope: ''workflows:execute''. Your token has: ''workflows:read'''
            requestId: req_xyz789
            timestamp: '2025-12-08T10:30:05Z'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://developers.avayacloud.com/errors/resource-not-found
            title: Resource Not Found
            status: 404
            detail: workflowId 'wf_123abc' does not exist
            requestId: req_xyz789
            timestamp: '2025-12-08T10:30:05Z'
  parameters:
    jobName:
      name: jobName
      in: query
      description: Optional name that can be provided to identify the job.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: Bulk Job
    userId:
      name: userId
      in: path
      description: The unique internal ID (UUID) of a user.
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
    userIdOrEmail:
      name: userIdOrEmail
      in: path
      description: 'Either the user ID (26-character internal ID starting with ''002''), email address,

        or the special value "me" to retrieve the current authenticated user.

        '
      required: true
      schema:
        oneOf:
        - $ref: '#/components/schemas/UserId'
        - $ref: '#/components/schemas/Email'
        - type: string
          enum:
          - me
          description: Current authenticated user
    email:
      name: email
      in: path
      description: An email address identifying a user.
      required: true
      schema:
        $ref: '#/components/schemas/Email'
    sort:
      name: sort
      in: query
      description: Sort order (ascending or descending)
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
        default: ASC
    sortBy:
      name: sortBy
      in: query
      description: 'Field to sort users by. Note that `lastUpdated` is initialized to `createdOn`

        when the user is created, so users that have never been modified will have

        matching values for both fields.

        '
      required: false
      schema:
        type: string
        enum:
        - CREATED_ON
        - LAST_UPDATED
        - FIRST_NAME
        - LAST_NAME
        example: CREATED_ON
    forceDisable:
      name: forceDisable
      in: query
      description: 'Force a user to be disabled even while still active.


        In an update uesr request, this parameter has no effect if the request payload does not

        include setting the `status` to `disabled`.

        '
      required: false
      schema:
        type: boolean
        default: false
    pageSize:
      name: pageSize
      in: query
      description: The max number of records to retrieve per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 50
    pageNumber:
      name: pageNumber
      in: query
      description: The page number of the records to retrieve.
