tags:
- name: Datasets
  description: A Dataset is a collection of contact center measurements related to a particular dimension.
info:
  title: Analytics Historical
  description: 'The Analytics Historical API exposes the following functionality:

    - Retrieving the content of a specific Dataset.


    ## Available Datasets


    | Dataset | Description | Entitlement |

    |---------|-------------|-------------|

    | `agent` | Agent performance metrics | Standard |

    | `queue` | Queue performance metrics | Standard |

    | `agentLoginSessions` | Agent login session data | Standard |

    | `workflow` | Workflow execution data | Standard |

    | `mpccdr` | MPC CDR data | Standard |

    | `transcript` | Interaction transcripts | Standard |

    | `clientSessions` | Client session data | Standard |

    | `agentAux` | Agent auxiliary/status data | Standard |

    | `interactionSegments` | Interaction segments with agent/queue details | **Analytics Insights** |

    | `workflowTrace` | Detailed workflow execution trace | **Analytics Insights** |

    | `cxAgentLoginLogout` | CX Agent login/logout events | Standard |

    | `agentByQueue` | Agent performance metrics by queue | Standard |

    | `agentLoginLogoutByQueue` | Agent login/logout events by queue | Standard |


    **Note:** Datasets marked with **Analytics Insights** require the Analytics Insights entitlement.

    Requests for these datasets without the entitlement will return HTTP 403 Forbidden.

    '
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/avaya-infinity
    email: apiteam@avaya.com
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: http://support.avaya.com/css/P8/documents/101038288
  version: 1.1.0
servers:
- url: https://core.{customerId}.ec.avayacloud.com/api/analytics
  description: Avaya Infinity API
  variables:
    customerId:
      default: your-customer-id
      description: Your Avaya Infinity customer ID.
paths:
  /v2/datasets/{datasetName}:
    get:
      tags:
      - Dataset
      summary: Get Dataset
      security:
      - BearerAuth: []
      description: 'Returns paginated rows of historical contact center data for the specified dataset.


        ## Getting Started


        ### Base URL


        All requests are made to:


        ```

        https://core.{customerId}.ec.avayacloud.com/api/analytics

        ```


        Replace `{customerId}` with your Avaya Infinity customer ID (the subdomain segment of your tenant URL).


        ### Authentication


        This API uses Bearer token authentication. Obtain a token via the OAuth 2.0 client credentials flow using your Client
        ID and Client Secret from the Avaya Infinity developer portal. Include the token in the `Authorization` header:


        ```

        Authorization: Bearer <your_token>

        ```


        For full authentication guidance, see the [Avaya Infinity authentication docs](https://developers.avayacloud.com/avaya-infinity/docs/how-to-authenticate).


        ### Interval Format


        The `interval` parameter is **required**. Its format depends on the `datasetType` value:


        **Interval dataset** (`datasetType=interval`, default)


        Use `YYYYMMDDHHmm` datetime values. Standard `mm` values are `00`, `15`, `30`, and `45`. Non-standard minute values
        (e.g., `0007`) are silently accepted but may return empty results. Specify a range using `starting` and/or `ending`:


        ```

        interval=starting:202502010415,ending:202502010445

        ```


        **Daily dataset** (`datasetType=daily`)


        Use `YYYYMMDD` datetime values. Non-zero `HHmm` suffixes are silently accepted but may return empty results:


        ```

        interval=starting:20250201,ending:20250225

        ```


        ### Important Notes


        - The `interval` parameter is required. Omitting it will return a `400 Bad Request`.

        - Pagination is forward-only. The `prevPageToken` field is reserved for future use and currently always returns an
        empty string.

        - Not all column names are valid filter keys. For example, `CHANNEL:phone` is a valid filter, but `AGENT_NAME:John*`
        returns `400 Invalid filter column`. See the `filter` parameter for details.

        - A `202 Accepted` response indicates the request was valid but data has not yet been processed for the requested
        interval. Column headers will be returned but `records` will be empty. Retry after a short delay.

        - Pagination `links.next` URLs may contain unicode-escaped ampersands (`\u0026`). Consumers should handle unicode-escaped
        characters when parsing these URLs.

        '
      operationId: getHistoricalDatasetData
      parameters:
      - $ref: '#/components/parameters/datasetName'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/prevPageToken'
      - $ref: '#/components/parameters/nextPageToken'
      - $ref: '#/components/parameters/interval'
      - $ref: '#/components/parameters/datasetType'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
              examples:
                queue:
                  $ref: '#/components/examples/QueueDatasetPage'
                agent:
                  $ref: '#/components/examples/AgentDatasetPage'
                interactionSegments:
                  $ref: '#/components/examples/InteractionSegmentsDatasetPage'
                workflowTrace:
                  $ref: '#/components/examples/WorkflowTraceDatasetPage'
                agentAux:
                  $ref: '#/components/examples/AgentAuxDatasetPage'
                cxAgentLoginLogout:
                  $ref: '#/components/examples/CXAgentLoginLogoutDatasetPage'
                agentByQueue:
                  $ref: '#/components/examples/AgentByQueueDatasetPage'
                agentLoginLogoutByQueue:
                  $ref: '#/components/examples/AgentLoginLogoutByQueueDatasetPage'
        '202':
          description: 'Accepted. The request was valid but data is not yet available for the requested interval. Column headers
            are returned but records will be empty. Retry after a short delay.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/ErrorForbidden'
                insightsRequired:
                  $ref: '#/components/examples/ErrorInsightsEntitlementRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token (JWT). Obtain via the OAuth 2.0 client credentials flow using your Client ID and Client Secret
        from the Avaya Infinity developer portal.

        '
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 'Unauthorized. Authentication credentials were missing or invalid. Note: Unauthenticated requests may receive
        a 302 redirect to the authentication provider rather than this JSON response.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorUnauthorized'
    InternalServer:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorInternalServerError'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorForbidden'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorNotFound'
  schemas:
    DatasetInterval:
      type: object
      properties:
        dataset:
          type: string
          example: agent
        latest_interval:
          type: string
          example: '11:00'
    Problem:
      type: object
      description: '<b>Problem Detail</b> as a way to carry machine-readable details of errors in a HTTP response

        to avoid the need to define new error response formats for HTTP APIs

        <a href="https://tools.ietf.org/html/rfc7807">RFC 7807</a>.


        **Note:** In current responses, only `title`, `status`, and `detail` are guaranteed to be

        present. The `type`, `instance`, and `violations` fields are defined for schema completeness

        but are not returned by the current implementation.

        '
      properties:
        type:
          type: string
          format: uri
          description: 'An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide

            human-readable documentation for the problem type (e.g., using HTML).

            '
          default: about:blank
          example: https://developers.avayacloud.com/avaya-infinity/docs/error-handling#constraint-violation
        title:
          type: string
          description: 'A short, summary of the problem type. Written in english and readable for engineers

            (usually not suited for non technical stakeholders and not localized).

            '
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          exclusiveMaximum: 600
          example: 503
        detail:
          type: string
          description: 'A human readable explanation specific to this occurrence of the problem.

            '
          example: Connection to database timed out
        instance:
          type: string
          format: uri
          description: 'An absolute URI that identifies the specific occurrence of the problem. It may or may not

            yield further information if dereferenced.

            '
        violations:
          type: array
          description: 'A list of violations that occurred as a result of invalid data provided as part of a request.

            '
          items:
            type: object
            properties:
              field:
                type: string
                description: 'The name of the field in the request that caused the violation. This can be the name

                  of a path parameter, query parameter, or a field within the request body.

                  '
                example: accountId
              message:
                type: string
                description: 'accountId of the account

                  '
                example: must match "^[a-zA-Z]{6}$"
          example:
          - field: emailAddress
            message: must not be null
            code: 20002
          - field: accountId
            message: must match "^[a-zA-Z]{6}$"
            code: 20006
    DatasetNames:
      description: List of dataset names
      type: array
      items:
        type: string
    ColumnHeader:
      type: object
      description: Name and data type of the column header
      properties:
        name:
          type: string
          description: Name of the header field
          example: agentFirstName
        type:
          type: string
          description: Data type of the header field
          example: string
    DatasetPage:
      type: object
      description: Root response object for dataset http requests.
      properties:
        columnHeaders:
          type: array
          items:
            $ref: '#/components/schemas/ColumnHeader'
        records:
          type: array
          items:
            type: array
            items:
              type: string
        pagination:
          $ref: '#/components/schemas/CursorPagination'
        links:
          $ref: '#/components/schemas/Links'
    CursorPagination:
      type: object
      properties:
        pageSize:
          type: integer
          description: The max number of records that can be retrieved on this page.
        prevPageToken:
          type: string
          description: 'Reserved for future use. Pagination is forward-only. This field currently always returns an empty
            string. Do not rely on this value for backward pagination.

            '
        nextPageToken:
          type: string
          description: The token to retrieve the next page of records.
    Links:
      type: object
      properties:
        prev:
          type: string
          description: 'URL of the previous page. If the value is "" you are currently on the first page. Note: Pagination
            is forward-only. This field is reserved for future use and currently always returns an empty string.

            '
        next:
          type: string
          description: 'URL of the next page. If the value is "" you are currently on the last page. Note: Ampersands in this
            URL may be unicode-escaped (\u0026). Consumers should handle unicode-escaped characters when parsing pagination
            links.

            '
  parameters:
    datasetName:
      name: datasetName
      in: path
      description: 'The unique name of the dataset. Available datasets:

        - `agent` - Agent performance metrics

        - `queue` - Queue performance metrics

        - `agentLoginSessions` - Agent login session data

        - `workflow` - Workflow execution data

        - `mpccdr` - MPC CDR data

        - `transcript` - Interaction transcripts

        - `clientSessions` - Client session data

        - `agentAux` - Agent auxiliary/status data

        - `interactionSegments` - Interaction segments (requires Analytics Insights)

        - `workflowTrace` - Workflow trace data (requires Analytics Insights)

        - `cxAgentLoginLogout` - CX Agent login/logout events

        - `agentByQueue` - Agent performance metrics by queue

        - `agentLoginLogoutByQueue` - Agent login/logout events by queue

        '
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      examples:
        agent:
          value: agent
          summary: Agent performance metrics
        queue:
          value: queue
          summary: Queue performance metrics
        agentLoginSessions:
          value: agentLoginSessions
          summary: Agent login session data
        workflow:
          value: workflow
          summary: Workflow execution data
        mpccdr:
          value: mpccdr
          summary: MPC CDR data
        transcript:
          value: transcript
          summary: Interaction transcripts
        clientSessions:
          value: clientSessions
          summary: Client session data
        agentAux:
          value: agentAux
          summary: Agent auxiliary data
        interactionSegments:
          value: interactionSegments
          summary: Interaction segments (Analytics Insights required)
        workflowTrace:
          value: workflowTrace
          summary: Workflow trace data (Analytics Insights required)
        cxAgentLoginLogout:
          value: cxAgentLoginLogout
          summary: CX Agent login/logout events
        agentByQueue:
          value: agentByQueue
          summary: Agent performance metrics by queue
        agentLoginLogoutByQueue:
          value: agentLoginLogoutByQueue
          summary: Agent login/logout events by queue
    pageSize:
      name: pageSize
      in: query
      description: The maximum number of results per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 200
        example: 20
    nextPageToken:
      name: nextPageToken
      in: query
      description: The page token of the next set of records to retrieve, represented as unique 36 characters(uuid).
      required: false
      schema:
        type: string
        minLength: 36
        maxLength: 100
        example: 123e4567-e89b-12d3-a456-556642440000
    prevPageToken:
      name: prevPageToken
      in: query
      description: 'Reserved for future use. Backward pagination is not currently supported. Submitting this parameter has
        no effect. The response will always return an empty string for prevPageToken.

        '
      required: false
      schema:
        type: string
        minLength: 36
        maxLength: 100
        example: 123e4567-e89b-12d3-a456-556642440000
    datasetType:
      name: datasetType
      in: query
      description: "The type of dataset to be retrieved. The allowed values are:\n  - daily\n  - interval\nThe default value\
        \ is 'interval'.\nThe datasetType param is used to determine the format of the interval param.\n"
      required: false
      schema:
        type: string
        example: daily
    interval:
      name: interval
      in: query
      description: "Specify the interval range to be used.\nMust contain either a single datetime value or both 'starting'\
        \ and 'ending' datetimes. The datetime format is dependent on the datasetType param.\n\nFor **daily dataset** (datasetType\
        \ = 'daily')\n  - datetime implies specific day(s).\n  - all datetime expressions should use YYYYMMDD format.\n  -\
        \ 'HHmm' values should be either omitted or replaced with 0000. Non-standard values may return empty results.\n  -\
        \ Example values:\n    - starting:20250201\n    - ending:20250225\n    - starting:20250201,ending:20250225\n\n\nFor\
        \ **interval dataset** (datasetType =  'interval')\n  - all datetime expressions should use YYYYMMDDHHmm format.\n\
        \    'mm' part can be used to indicate the 15 min interval such as '00', '15',  '30' or '45'. Non-standard values\
        \ may return empty results.\n    - interval should be less than atleast 30 mins from the current interval.\n  - Example\
        \ values:\n    - starting:202502010415\n    - ending:202502251530\n    - starting:202502010415,ending:202502251545\n"
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 41
      examples:
        startingInterval:
          value: starting:202502010415
          summary: Interval dataset. Data starting from 202502010415 to current(based on pipeline processing status)
        startEndInterval:
          value: starting:202502010415,ending:202502010415
          summary: Interval dataset. Records in 202502010415 interval i.e. 1 interval
        endingInterval:
          value: ending:202502251500
          summary: Interval dataset. Data filtering from beginning to 202502251530
        bothInterval:
          value: starting:202502010415,ending:202502010445
          summary: Interval dataset. Records from 3 intervals, 15, 30, 45
        startingDay:
          value: starting:20250201
          summary: Daily dataset. Data filtering from specified starting date till ending of data rows
        endingDay:
          value: ending:20250225
          summary: Daily dataset. Data filtering from beginning of data rows till specified ending date
    filter:
      name: filter
      in: query
      description: "Specifies details of a row filter. The allowed format:\n  - Begins with the column name to be filtered,\
        \ followed by a colon, then:\n  - Either an exact string to match, or\n  - A string expression including the * wildcard\
        \ character\n\n**Important:** Not all column names are valid filter keys. Using an unsupported column name\nreturns\
        \ `400 Invalid filter column`. The following columns are known to be filterable:\n  - `CHANNEL` — e.g., `CHANNEL:phone`\n\
        \  - `AGENT_ID` — e.g., `AGENT_ID:002d011106bf83ae15133ec0a7`\n  - `QUEUE_ID` — e.g., `QUEUE_ID:003d0110243d0fd4d9c7f27dea`\n\
        \  - `ACCOUNT_ID` — e.g., `ACCOUNT_ID:001d010917f6594b9a104630f7`\n\nColumns not listed above (e.g., `AGENT_NAME`)\
        \ are not accepted as filter keys and will\nreturn a `400` error. Contact Avaya support to confirm the full list of\
        \ filterable columns\nfor a specific dataset.\n"
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 256
      examples:
        equals:
          value: AGENT_ID:123
          summary: Exact string to match
        like:
          value: CHANNEL:phone
          summary: Expression including the * wildcard character
