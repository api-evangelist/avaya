    ReasonCode:
      description: 'Reason codes are a set of codes that agents can select from agent desktop clients to further describe
        their current activity or state. Reason Codes consist of a unique codeName, codeNumber and codeType combination. This
        API is used to create, update, retrieve and delete NOT_READY, LOGOUT reason codes and CALL_WORK_CODE codes.

        '
      type: object
      required:
      - codeName
      - codeNumber
      - codeType
      properties:
        reasonCodeId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
          description: The unique 36 character internal id for the Reason Code
        codeName:
          type: string
          example: Lunch
          minLength: 1
          maxLength: 20
          pattern: ^[a-zA-Z\p{L}0-9]+([ ]*[a-zA-Z\p{L}0-9-\_\*\=\+\$\:\;\&\~\,\?\%\!\|\{\}\`\.\']+)*$
          description: The name of the Reason Code. If code type is NOT_READY or LOGOUT, code name length must be up to 16
            unicode characters and if code type is CALL_WORK_CODE, code name length must be up to 20 unicode characters.
        codeNumber:
          type: string
          example: '89'
          minLength: 1
          maxLength: 16
          pattern: ^[0-9][0-9]*$
          description: The number of the Reason Code. If code type is NOT_READY, code number must be between 1 to 99. If code
            type is LOGOUT, code number must be between 1 to 9 and if code type is CALL_WORK_CODE, code number must be of
            16 digits.
        codeType:
          type: string
          description: The type of the Reason Code
          enum:
          - NOT_READY
          - LOGOUT
          - CALL_WORK_CODE
          example: NOT_READY
        description:
          type: string
          example: Agent is on Lunch
          minLength: 0
          maxLength: 1024
          description: The description for the Reason Code
        isInterruptible:
          type: boolean
          description: Indicates if the Reason Code is interruptible. This is applicable to NOT READY Reason Codes.
          example: false
        systemDefinedAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCodeSystemAttributes'
          description: Indicates if the Reason Code has additional system defined behavior. This is applicable to NOT READY
            Reason Codes. Only one Not Ready Reason Code shall be allowed to be marked as 'Work on Digital'. If a Not Ready
            Reason Code is marked as 'Work on Digital', it cannot be assigned any other system-defined attribute. At least
            one Not Ready Reason Code needs to be marked as 'Work on Digital'.
          maxItems: 5
          example:
          - WORK_ON_DIGITAL
        organizationNodeId:
          type: string
          example: EXMPLE
          minLength: 6
          maxLength: 6
          pattern: ^[a-zA-Z]{6}$
          description: Unique Id for Account or Node where Reason Code gets created
    UpdateReasonCode:
