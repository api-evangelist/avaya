      - $ref: '#/components/parameters/communicationManagerId'
      - name: codeType
        in: query
        description: The mandatory type of the codes to query.
        required: true
        schema:
          type: string
          enum:
          - NOT_READY
          - LOGOUT
          - CALL_WORK_CODE
          example: NOT_READY
      - name: codeName
        in: query
        description: The optional name of the code to query.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 255
          example: Lunch
      - name: codeNumber
        in: query
        description: The optional number of the code to query.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 16
          example: '75'
      - $ref: '#/components/parameters/pageNumber'
      - name: pageSize
        in: query
        description: 'The maximum number of results per page. Default value is 10, max value is 100.

          '
        required: false
        schema:
          type: integer
          format: int32
          example: 10
          default: 10
          minimum: 1
          maximum: 100
      - name: orderBy
        in: query
        required: false
        description: 'Specifies how response data should be sorted. Only codeName and codeNumber are valid options.

          Field Names are case-senstive (should be written as it is in description).

          To specify descending order, a suffix " desc" should be added. For example, "codeName asc" for ascending or "codeName
          desc" for descending".

          The default sorting order is codeName ascending.

          '
        schema:
          type: string
          default: codeName
          maxLength: 260
        examples:
          orderByCodeNameInDescendingOrder:
            value: codeName desc
            summary: sort data based on codeName in descending order
          orderByCodeNameInAscendingOrder:
            value: codeName
            summary: sort data based on codeName in ascending order
          orderByCodeNumberInDescendingOrder:
            value: codeNumber desc
            summary: sort data based on codeNumber in descending order
          orderByCodeNumberInAscendingOrder:
            value: codeNumber
            summary: sort data based on codeNumber in ascending order
          orderByCodeTypeInDescendingOrder:
            value: codeType desc
            summary: sort data based on codeType in descending order
          orderByCodeTypeInAscendingOrder:
            value: codeType
            summary: sort data based on codeType in ascending order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonCodePage'
              examples:
                default:
                  $ref: '#/components/examples/ReasonCodePageResponse'
