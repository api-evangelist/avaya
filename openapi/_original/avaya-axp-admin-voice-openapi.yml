info:
  title: Admin - Voice
  description: "The Voice provider APIs are used to manage information about voice specific elements and different voice related\
    \ entities e.g. Phone numbers.\n\nVoice Services will support multiple ways to provision voice providers\n  1. Programmatic\
    \ Interface (Rest APIs)\n  2. User Interface\n"
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/onecloud-ccaas
    email: apiteam@avaya.com
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: http://support.avaya.com/css/P8/documents/101038288
  version: 1.0.2
security:
- {}
- BearerAuth: []
  AppKey: []
servers:
- url: '{protocol}://{server}{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    basePath:
      default: /api/admin/voice/v1
tags:
- name: Available Phone Numbers
  description: 'The available phone numbers that can be added to the contact center.

    '
- name: Avaya Aura Device Services
  description: 'Administration of Avaya Aura Device Service Elements. These API are expected to be called by an account administrator.
    AADS is the abbreviated form for Avaya Aura Device Service and is commonly used in the summary of the Apis. OIDC stands
    for OpenID Connect Discovery.

    '
- name: Avaya Cloud Office management
  description: 'APIs to manage Avaya Cloud Office element in voice service

    '
- name: Avaya Cloud Office SIP Trunks
  description: 'APIs to manage Avaya Cloud Office SIP Trunk element in voice service

    '
- name: Communication Manager
  description: 'Administration of Communication Manager configuration. These API are expected to be called by an account administrator.
    CM is the abbreviated form for Communication Manager and is commonly used in the summary of the Apis.

    '
- name: Comm Manager Job Details
  description: 'This API is used to get details of list of jobs or a single job for a specific Communication Manager. These
    API are expected to be called by an account administrator.

    '
- name: Country
  description: 'The countries in which available phone numbers are available.

    '
- name: Extension
  description: 'Management of non e164 Extension that are assigned to Account. These API are expected to be called by an account
    administrator.

    '
- name: Hybrid Extension
  description: 'Management of hybrid extensions assigned to users. These API are expected to be called by an account administrator.

    '
- name: Hybrid Skill
  description: 'Administration of Hybrid Skills. These APIs are expected to be called by an account administrator.

    '
- name: Gateway Connection Manager
  description: 'Get Details of Gateway Connection Manager. These API are expected to be called by an account administrator.

    '
- name: Hybrid Cloud Gateway
  description: 'Administration of Avaya Hybrid Cloud Gateway. These API are expected to be called by an account administrator.
    HCG is the abbreviated form for Hybrid Cloud Gateway and is commonly used in the summary of the APIs.

    '
- name: Hybrid Cloud Manager
  description: Administration of Hybrid Cloud Manager.This API is expected to be called by an account administrator.
- name: Location Profile
  description: 'This API is for managing location profiles. These API are expected to be called by an account administrator.

    '
- name: Agent Location
  description: 'Agent location Routing APIs for System Administrator. It will enable agents connecting from different countries
    to be able to go through specific trunks or connection.

    '
- name: Microsoft Teams management
  description: 'APIs to manage Microsoft Teams element in voice service.

    '
- name: Microsoft Teams SIP Trunks
  description: 'APIs to manage Microsoft Teams SIP Trunk element in voice service.

    '
- name: Outbound Number Routing Rules
  description: 'APIs to manage Outbound Call Number Routing Rules in voice service by an account administrator.

    '
- name: Phone Number
  description: 'Management of phone numbers that are the entry point for contact center voice engagements. Phone number can
    be assigned and released.

    '
- name: Reason Codes
  description: Reason codes are a set of codes that agents can select from agent desktop clients to further describe their
    current activity or state. Reason Codes consist of a unique codeName, codeNumber and codeType combination. This API is
    used to create, update, retrieve and delete NOT_READY, LOGOUT reason codes and CALL_WORK_CODES codes.
- name: SIP Trunks
  description: 'This API is used to get list of all SIP trunk elements and update caller id for an account administrator.

    '
- name: Sync Aura Entities
  description: 'Set of API to initiate synchronization of data from Aura to AXP admin. These API are expected to be called
    by an account administrator.

    '
- name: System Manager
  description: 'Administration of System Manager. These API are expected to be called by an account administrator.

    '
- name: Voice Numbers And Extensions
  description: 'APIs to export the Voice Numbers and Agent Extensions and its associated fields in a CSV file for account
    administrator.

    '
- name: Voice Plan
  description: 'Represents Voice Plan of configured Communication Managers for Account Administrator. These API are expected
    to be called by an account administrator.

    '
paths:
  /accounts/{accountId}/avaya-aura-device-services:
    post:
      tags:
      - Avaya Aura Device Services
      summary: Creates an AADS Element
      description: '**This API requires the Account Administrator role.**


        Creates an Avaya Aura Device Service Element for specified account

        '
      operationId: createAvayaAuraDeviceService
      parameters:
      - $ref: '#/components/parameters/accountId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvayaAuraDeviceService'
            examples:
              default:
                $ref: '#/components/examples/AvayaAuraDeviceServiceReq'
        required: true
      responses:
        '202':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvayaAuraDeviceServiceResponse'
              examples:
                default:
                  $ref: '#/components/examples/AvayaAuraDeviceServiceRes'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Avaya Aura Device Services
      summary: Gets a list of all AADS
      description: '**This API requires the Account Administrator role.**


        Returns the list of all available Avaya Aura Device Service Elements by account Id

        '
      operationId: getAllAvayaAuraDeviceService
      parameters:
      - $ref: '#/components/parameters/accountId'
      - name: filter
        in: query
        required: false
        description: "Specifies details of a row filter.\n\n The possible fields that can be filtered on are:\n  * name\n\n\
          The allowed format:\n  - Begins with the column name to be filtered, followed by a colon, then:\n    - Either an\
          \ exact string to match, or\n    - A string expression including the * wildcard character\n      - :{PREFIX}* will\
          \ be used to find out word start with.\n      - :*{POSTFIX} will be used to find out word end with\n      - : will\
          \ be used to match exact word\n  - Begin with column name to be filtered, followed by a = operator. (this will be\
          \ used to match exact string)\n"
        schema:
          type: string
          maxLength: 255
        examples:
          exact:
            description: Example of filtering based on an exact string.
            value: name=AADS123
          prefix:
            description: Example of filtering based on a prefix string.
            value: name:AADS1*
          postfix:
            description: Example of filtering based on a postfix string.
            value: name:*AADS
      - name: orderBy
        in: query
        required: false
        description: 'Field name on which ordering needs to be performed. The default order is ascending.


          The possible fields that can be ordered on are:

          * name


          Field Names are case-senstive (should be written as it is in description).


          To specify descending order, a suffix " desc" should be added. For example, "name" for ascending or "name desc"
          for descending".

          '
        schema:
          type: string
          default: name
          maxLength: 255
        examples:
          ascending:
            value: name
          descending:
            value: name desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvayaAuraDeviceServices'
              examples:
                default:
                  $ref: '#/components/examples/AvayaAuraDeviceServicesRes'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/avaya-aura-device-services/{avayaAuraDeviceServiceId}:
    put:
      tags:
      - Avaya Aura Device Services
      summary: Updates an AADS Element
      description: '**This API requires the Account Administrator role.**


