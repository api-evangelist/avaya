          type: string
          description: 'A short, summary of the problem type. Written in english and readable for engineers (usually not suited
            for non technical stakeholders and not localized).

            '
          example: Service Unavailable
          nullable: true
        status:
          type: integer
          format: int32
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
          nullable: true
        detail:
          type: string
          description: 'A human readable explanation specific to this occurrence of the problem.

            '
          example: Connection to database timed out
          nullable: true
        instance:
          type: string
          format: uri
          description: 'An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further
            information if dereferenced.

            '
          nullable: true
        violations:
          type: array
          description: 'A list of violations that occurred as a result of invalid data provided as part of a request.

            '
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
                description: 'The name of the field in the request that caused the violation. This can be the name of a path
                  parameter, query parameter, or a field within the request body.

                  '
                example: accountId
              message:
                type: string
                description: 'A human readable explanation specific to this occurrence of the violation.

                  '
                example: must match "^[a-zA-Z]{6}$"
              code:
                type: integer
                format: int32
                description: 'The violation code generated by the server for this occurrence of the violation. Use this code
                  when implementing any error handling logic instead of the message, as the message can change.

                  '
                example: 20006
          example:
          - field: emailAddress
            message: must not be null
            code: 20002
          - field: accountId
            message: must match "^[a-zA-Z]{6}$"
            code: 20006
    PhoneNumberPage:
      description: Paginated Phone Numbers
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        links:
          allOf:
          - $ref: '#/components/schemas/Links'
          example:
            prev: /api/admin/voice/v1/accounts/ABCDEF/phone-numbers?pageNumber=1&pageSize=10
            next: /api/admin/voice/v1/accounts/ABCDEF/phone-numbers?pageNumber=3&pageSize=10
    PhoneNumber:
      type: object
      description: PhoneNumber of an Account.
      properties:
        phoneNumberId:
          type: string
          example: c8c2909d-75e9-484a-94c0-b7e8d29771fe
          description: The unique 36 character internal id that represents the phone number.
          readOnly: true
        phoneNumber:
          type: string
          pattern: ^\+[1-9]\d{3,13}$
          description: The phone number in the E.164 format
          example: '+16479308804'
          minLength: 5
          maxLength: 15
        displayName:
          type: string
          maxLength: 255
          description: Domestic format version of the phone number or any suitable name that will identify the number easily.
          example: private Number
        countryCode:
          type: string
          description: ISO Country code for number.
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          example: US
        type:
          type: string
          description: Phone number type. Possible values are LOCAL, TOLLFREE and UNKNOWN (when status is INPROGRESS).
          example: LOCAL
          readOnly: true
        accountId:
          type: string
          description: accountId for which Number is assigned.
          example: ABCDEF
          readOnly: true
        isCallingPartyNumber:
          type: boolean
          description: Indicates whether the number is caller Id.
          example: true
        status:
          type: string
          description: Indicates that number is active or inactive
          example: INACTIVE
          enum:
          - ACTIVE
          - INACTIVE
          - INPROGRESS
          - DISABLED
          - FAILED
          readOnly: true
        statusMessage:
          type: string
          description: status message for INACTIVE Number.
          example: Verification needed. Please send the necessary documents to siptrunksupport@avaya.com to activate it.
          readOnly: true
        preferredMediaLocation:
          type: string
          description: Preferred media location set by tenant instead of default coming from CPaaS.
          example: US-LA
          minLength: 1
          maxLength: 7
