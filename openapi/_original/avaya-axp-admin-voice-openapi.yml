    VoicePlanPage:
      title: VoicePlanPage
      type: object
      description: Voice Plan filtered response
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/VoicePlan'
        links:
          allOf:
          - $ref: '#/components/schemas/Links'
          example:
            prev: /api/admin/voice/v1/accounts/{accountId}/communication-managers/{communicationManagerId}/voice-plans?pageNumber=1&pageSize=10
            next: /api/admin/voice/v1/accounts/{accountId}/communication-managers/{communicationManagerId}/voice-plans?pageNumber=3&pageSize=10
    VoicePlan:
      type: object
      description: Represents ranges of entities for configured Communication Manager.
      properties:
        voicePlanId:
          type: string
          format: uuid
          readOnly: true
          description: unique identifier for Voice Plan
          example: dfeb5425-b96a-4fb7-a0bd-aa4b8248b814
        name:
          type: string
          description: Name of the voice plan
          example: VoicePlan1
          pattern: ^(?!\s*$).+
          minLength: 3
          maxLength: 255
        type:
          type: string
          description: The type of the Voice Plan. If SYSTEM type is set then allowed to set values for vdnDialPlanRange,
            reasonCodeNotReadyRange, reasonCodeLogOutRange. If USER type is set then allowed to set values for agentDialPlanRange,
            extensionDialPlanRange.
          enum:
          - SYSTEM
          - USER
          example: SYSTEM
        userProfileId:
          type: string
          description: Profile for the voice plan
          example: ASEDFG
          minLength: 0
          maxLength: 6
          pattern: ^$|^[a-zA-Z0-9\-\_\.\ ]+$
        description:
          type: string
          description: Description of the voice plan
          example: Voice plan for Comunication Manager
          maxLength: 255
          pattern: (^$|^[a-zA-Z0-9\p{L}\(\)\-\_\.\ \n]+$)
        agentDialPlanRange:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
          example:
          - 20000:20100
          description: Agent dial plan ranges. Allowed to be set only if voice plan type is USER.
        extensionDialPlanRange:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
          example:
          - 30000:30100
          - 8000000:9000000
          description: Extension dial plan ranges. Allowed to be set only if voice plan type is USER.
        reasonCodeNotReadyRange:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 5
          example:
          - '1:9'
          description: Aux reason code ranges. Allowed to be set only if voice plan type is SYSTEM.
        reasonCodeLogOutRange:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 3
          example:
          - '1:9'
          description: Logout reason code ranges. Allowed to be set only if voice plan type is SYSTEM.
        status:
          type: string
          description: Status code of the voice plan. A voice plan with status code PROFILE_NOT_ASSIGNED indicates that it
            is in error state and Profile associated with it is been deleted.
          enum:
          - PROFILE_NOT_ASSIGNED
          - SUCCESS
      required:
      - name
      - type
    HybridCloudGateways:
      title: HybridCloudGateways
      type: object
      description: List of Hybrid Cloud Gateways
      properties:
        resources:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/HybridCloudGatewayResponse'
    HybridCloudGateway:
      title: HybridCloudGateway
      type: object
      description: Avaya Hybrid Cloud Gateway acts as a gateway to Avaya Aura clients and applications utilizing WebRTC signaling
        and media.
      properties:
        id:
          type: string
          description: The unique id of Avaya Hybrid Cloud Gateway
          readOnly: true
          format: uuid
          example: 41c6ef0d-5470-406e-ace2-6dc442b99318
        name:
          type: string
          example: AHCG123
          minLength: 3
          maxLength: 255
          pattern: ^[a-zA-Z0-9\p{L}\-\_\.\ ]+$
        description:
          type: string
          example: Description of the Avaya Hybrid Cloud Gateway
          maxLength: 1024
          pattern: (^$|^[a-zA-Z0-9\p{L}\(\)\-\_\.\ \n]+$)
        systemId:
          type: string
          description: System-Id of Avaya Hybrid Cloud Gateway
          format: uuid
          example: fa703a3a-3dfb-4606-ae79-fd0fe0be3e64
        publicKey:
          type: string
          example: MIIBOgIBAAJBAKj34GkxFhD90vcNLYLInFEX6Ppy1tPf9Cnzj4p4WGeKLs1Pt8QuKUpRKfFLfRYC9AIKjbJTWit+CqvjWYzvQwECAwEAAQJAIJLixBy2qpFoS4DSmoEm
          description: Public key of the Avaya Hybrid Cloud Gateway.
          minLength: 1
          maxLength: 4096
        publicKeyAlgorithm:
          type: string
          description: Algorithm for the public key. This is a mandatory field for configuring a Hyrbid Cloud Gateway. Currently
            it is internally set to ES256, if not specified.
          enum:
          - ES256
          default: ES256
          example: ES256
        locationCode:
          type: string
          example: IN-MH
          description: 'ISO 3166-2 location code for country and region. For various country and region codes, check : https://www.iso.org/obp/ui/#search'
          minLength: 1
          maxLength: 7
        sessionManagerFqdnList:
          type: array
          items:
            type: string
            maxLength: 255
            pattern: ^[a-zA-Z0-9\p{L}\-\_\/\:\.\ ]+$
          minItems: 1
          maxItems: 50
          description: List of Fully-Qualified Domain-Name (FQDN) of all the deployed Session Managers for the tenant.
          example:
          - sm1906.avaya.com
          - sm-stage224.avaya.com
          - sm_prod2201.avaya.com
        isMediaLatchingEnable:
          type: boolean
          description: ''
          example: true
          default: true
        isTermsAndConditionsAccepted:
          type: boolean
          description: Avaya cloud solutions are designed to scale while maintaining deep security and high availability. This
            cloud solution supports secure media, which is recommended by Avaya. If secure media is disabled on your existing
            system, media traffic will flow on the internet and through Avaya servers unencrypted. The security benefits of
            encrypted traffic will not be available. For more information, please see https://www.avaya.com/en/trust-center-cloud-security/
          example: true
          default: false
      required:
      - name
      - systemId
      - publicKey
      - locationCode
      - sessionManagerFqdnList
      - isTermsAndConditionsAccepted
