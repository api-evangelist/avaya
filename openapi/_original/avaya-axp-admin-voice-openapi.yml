        description: "The possible fields you can filter on are phoneNumber, displayName, countryCode, type and status. The\
          \ allowed format:\n- Begins with the field name to be filtered, followed by a colon and:\n  - Either an exact string\
          \ to match, or\n  - A string expression including the * wildcard character\n\nExamples include 'phoneNumber:+35311234567',\
          \ 'countryCode:IN'\n"
        schema:
