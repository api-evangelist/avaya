          examples:
            default:
              $ref: '#/components/examples/ErrorExtensionExists'
  schemas:
    OpenIDConnectDiscovery:
      title: OpenIDConnectDiscovery
      type: object
      description: OpenID Connect Discovery Url  which is associated with Avaya Aura Device Service
      properties:
        openIDConnectDiscovery:
          type: string
          readOnly: true
          description: OpenID Connect Discovery Url
          example: https://dev-11.ixcc-sandbox.avayacloud.com/auth/realms/YOPXPM/.well-known/openid-configuration
    AvayaAuraDeviceService:
      title: AvayaAuraDeviceService
      type: object
      description: Avaya Aura Device Service Element
      required:
      - hostname
      - name
      - port
      properties:
        id:
          type: string
          readOnly: true
          description: The unique id of the element.
          example: 04703a3a-3dfb-4606-ae79-fd0fe0be3e64
        name:
          type: string
          description: Name of the element. This should be unique per type.
          example: AADS
          minLength: 3
          maxLength: 255
          pattern: ^[a-zA-Z0-9\p{L}\-\_\.\ ]+$
        description:
          type: string
          description: Description of Avaya Aura Device Service Element
          example: cust
          minLength: 3
          maxLength: 255
          pattern: (^$|^[a-zA-Z0-9\p{L}\(\)\-\_\.\ \n]+$)
        hostname:
          type: string
          description: Hostname of Element
          example: aads-dev-11.avaya.com
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9\p{L}\@\-\_\/\:\.\ ]+$
        port:
          type: integer
          format: int32
          description: Port used to connect to Avaya Aura Device Service Element
          minimum: 0
          maximum: 65536
          example: 443
        openIDConnectDiscovery:
          type: string
          readOnly: true
          description: OpenID Connect Discovery URL
          example: https://dev-11.ixcc-sandbox.avayacloud.com/auth/realms/YOPXPM/.well-known/openid-configuration
        status:
          type: string
          readOnly: true
          description: Status of the object under operation
          enum:
          - IN_PROGRESS
          - FAILED
          - SUCCESS
          example: SUCCESS
    AvayaAuraDeviceServices:
      title: AvayaAuraDeviceServices
      type: object
      description: List of Avaya Aura Device Service Elements
      properties:
        resources:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AvayaAuraDeviceService'
    AvayaAuraDeviceServiceResponse:
      type: object
      description: Represents the response for an asynchronous operation that simply returns a HATEOAS url, that provides
        a reference to the object under operation
      properties:
        url:
          type: string
          example: /api/admin/voice/v1/accounts/ABCDEF/avaya-aura-device-services/63c6ff9d-3370-090e-bkb2-7gh442b99985
          maxLength: 2048
    CommunicationManagerPage:
      title: CommunicationManagerPage
      type: object
      description: Communication Manager filtered response
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CommunicationManagerResponse'
        links:
          allOf:
          - $ref: '#/components/schemas/Links'
          example:
            prev: /api/admin/voice/v1/accounts/{accountId}/communication-managers?pageNumber=1&pageSize=10
            next: /api/admin/voice/v1/accounts/{accountId}/communication-managers?pageNumber=3&pageSize=10
    CommunicationManager:
      title: CommunicationManager
      type: object
      description: Represents the model used to create or update a Communication Manager element.
      properties:
        id:
          type: string
          readOnly: true
          format: uuid
          example: 690a6253-bc77-4af4-bf94-eaab68ca2ff0
          description: The unique id of the cm.
        name:
          type: string
          example: CM4696
          minLength: 3
          maxLength: 255
          pattern: ^[a-zA-Z0-9\p{L}\-\_\.\ ]+$
        description:
          type: string
          example: This is testing Communication Manager.
          maxLength: 255
          pattern: (^$|^[a-zA-Z0-9\p{L}\(\)\-\_\.\ \n]+$)
        hostname:
          type: string
          description: This is the Fully Qualified Domain Name (FQDN)
          example: dc1-cm96.avayacloud.stage
          maxLength: 255
          pattern: (^(([a-zA-Z]|[a-zA-Z][a-zA-Z0-9\-]*[a-zA-Z0-9])\.){1,}([A-Za-z]|[A-Za-z][A-Za-z0-9\-]*[A-Za-z0-9]){1,}$)|((^\s*((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))\s*$)|(^\s*((([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:))|(([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3})|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$))
        port:
          type: string
          example: '5022'
          default: '5022'
          minLength: 0
          maxLength: 5
          minimum: 0
          maximum: 65535
        alternateHostname:
          type: string
          description: This is the Fully Qualified Domain Name (FQDN) of alternate CM
          example: dc1-cm98.avayacloud.stage
