  /accounts/{accountId}/outbound-routing-rules:
    post:
      tags:
      - Outbound Number Routing Rules
      summary: Add Routing Rules
      description: "**This API requires the Account Administrator role.**\n\nThe following field must be unique otherwise\
        \ a `HTTP 409 Conflict` will be returned:\n  * `priority`\n\nCreates Outbound Call Number Routing Rules for mixed\
        \ type of MPC trunks.\n"
      operationId: createOutboundRoutingRule
      parameters:
      - $ref: '#/components/parameters/accountId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundRoutingRule'
            examples:
              OutboundRoutingRules:
                $ref: '#/components/examples/OutboundRoutingRules'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundRoutingRule'
              examples:
                OutboundRoutingRuleResponse:
                  $ref: '#/components/examples/OutboundRoutingRuleResponse'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ErrorOutboundDuplicatePriorityExists'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Outbound Number Routing Rules
      summary: Update Bulk Routing Rules
      description: "**This API requires the Account Administrator role.**\n\nThe following field must be unique otherwise\
        \ a `HTTP 409 Conflict` will be returned:\n  * `priority`\n\nUpdates Outbound Call Number Routing Rules for mixed\
        \ type of MPC trunks.\n"
      operationId: bulkUpdateOutboundRoutingRule
      parameters:
      - $ref: '#/components/parameters/accountId'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/BulkUpdateOutboundRoutingRule'
            example:
            - id: c8c2909d-75e9-484a-94c0-b7e8d29771fe
              type: NUMBER_PREFIX
              priority: 4
              prefix: '+1'
              minLength: 1
              maxLength: 50
              sipTrunkId: c8c2909d-75e9-484a-94c0-b7e8d29771fe
              callerId: c8c2909d-75e9-484a-94c0-b7e8d29771fe
              isoCountry: IN-MH
              locationIds:
              - c8c2909d-75e9-484a-94c0-b7e8d29771fe
            - id: c8c2909d-75e9-484a-94c0-b7e8d29771ff
              type: NUMBER_PREFIX
              priority: 2
              prefix: '+1'
              minLength: 1
              maxLength: 50
              sipTrunkId: c8c2909d-75e9-484a-94c0-b7e8d29771ff
              callerId: c8c2909d-75e9-484a-94c0-b7e8d29771ff
