          type: integer
          format: int32
          example: 5
          default: 10
          minimum: 5
          maximum: 50
      - name: filter
        in: query
        required: false
        description: "Specifies details of a row filter.\n\n The possible fields that can be filtered on are:\n  * name\n\
          \  * number\n  * extension\n\n\nThe allowed format:\n  - Begins with the column name to be filtered, followed by\
          \ a colon, then:\n    - Either an exact string to match, or\n    - A string expression including the * wildcard\
          \ character\n      - :{PREFIX}* will be used to find out word start with.\n      - :*{POSTFIX} will be used to find\
          \ out word end with\n      - : will be used to match exact word\n  - Begin with column name to be filtered, followed\
          \ by a = operator. (this will be used to match exact string)\n"
        schema:
          type: string
          maxLength: 255
        examples:
          exact:
            description: Example of filtering based on an exact string.
            value: name=French
          prefix:
            description: Example of filtering based on a prefix string.
            value: name:French*
          postfix:
            description: Example of filtering based on a postfix string.
            value: name:*French
      - name: orderBy
        in: query
        required: false
        description: 'Field name on which ordering needs to be performed. The default order is ascending.


          The possible fields that can be ordered on are:

          * name

          * number

          * extension


          Field Names are case-senstive (should be written as it is in description).


          To specify descending order, a suffix " desc" should be added. For example, "name" for ascending or "name desc"
          for descending".

          '
        schema:
          type: string
          default: name
          maxLength: 255
        examples:
          ascending:
            value: name
          descending:
            value: name desc
