openapi: 3.2.0
info:
  title: Analytics - Historical Data v1 Reports API
  description: 'The Analytics Historical API exposes the following functionality:

    - Listing the Dimension names for an Account.

    - Retrieving the content of a specified Dimension.

    - Listing the Report names for an Account.

    - Retrieving the content of a specific Report.'
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/onecloud-ccaas
    email: apiteam@avaya.com
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: http://support.avaya.com/css/P8/documents/101038288
  version: 1.0.1
servers:
- url: '{protocol}://{server}{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    basePath:
      default: /api/analytics/historical/v1
- url: '{protocol}://{server}:{port}'
  description: Internal API
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    server:
      default: analytics-historical-api
    port:
      enum:
      - '80'
      - '443'
      default: '80'
security:
- {}
- BearerAuth: []
  AppKey: []
tags:
- name: Reports
  description: A Report is a collection of contact center measurements related to a particular dimension.
paths:
  /accounts/{accountId}/reports:getNames:
    get:
      tags:
      - Reports
      summary: List Report Names
      description: Gets the list of report names for an Account.
      operationId: listHistoricalReportNames
      parameters:
      - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportNames'
              examples:
                default:
                  $ref: '#/components/examples/ReportNames'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/reports/{reportName}:
    get:
      tags:
      - Reports
      summary: Get Report
      description: Gets the fixed list of report data for a Report name. The list of fixed measures is not updated when new measures are introduced.
      operationId: getHistoricalReport
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/reportName'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/prevPageToken'
      - $ref: '#/components/parameters/nextPageToken'
      - $ref: '#/components/parameters/interval'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
              examples:
                default:
                  $ref: '#/components/examples/ReportPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
components:
  parameters:
    interval:
      name: interval
      in: query
      description: "Specify the interval range to be used.\nMust contain either a single datetime value or both 'starting' and 'ending' datetimes. The datetime format is dependent on the type of report selected which can derived from the 'reportName'.\n\nFor **daily reports** (reportName always ends with 'Daily' for example 'AgentDaily')\n  - datetime implies specific day(s).\n  - all datetime expressions should use YYYYMMDD format.\n  - 'HHmm' values should be either omitted or replaced with 0000 – The API will return an error when other 'HHmm' values are specified.\n  - Example values:\n    - 20201201\n    - starting:20201201\n    - ending:20201225\n    - starting:20201201,ending:20201225\n\nFor **interval reports** (reportName always ends with 'Interval' for example 'AgentInterval')\n  - all datetime expressions should use YYYYMMDDHHmm format.\n    'mm' part can be used to indicate the 15 min interval such as '00', '15',  '30' or '45' - The API will return an error when other 'mm' values are specified.\n  - interval=YYYYMMDDHHmm\n    - YYYYMMDDHH00 corresponds to >= 00 mins and < 15 mins interval\n    - YYYYMMDDHH15 corresponds to >= 15 mins and < 30 mins interval\n    - YYYYMMDDHH30 corresponds to >= 30 mins and < 45 mins interval\n    - YYYYMMDDHH45 corresponds to >= 45 mins and < 00 mins interval\n  - interval=starting:YYYYMMDDHHmm\n    - corresponds to >= YYYYMMDDHHmm\n  - interval=ending:YYYYMMDDHHmm\n    - corresponds to < YYYYMMDDHHmm\n  - interval=starting:YYYYMMDDHHmm,ending:YYYYMMDDHHmm\n    - starting:YYYYMMDDHH00,ending:YYYYMMDDHH30 corresponds to >= 00 mins and < 30 mins\n    - starting:YYYYMMDDHH30,ending:YYYYMMDDHH30 doesn't return data\n  - Example values:\n    - 202012010400\n    - starting:202012010415\n    - ending:202012251530\n    - starting:202012010415,ending:202012251545\n\nFor **EngagementDetail** report\n  - Every engagement is mapped to a 15 min interval according to its start time. For example, if engagement start time is 2024-08-15 06:23:10.422+00 it will be reflected in the interval 202408150615\n  - all datetime expressions should use YYYYMMDDHHmm format.\n    'mm' part can be used to indicate the 15 min interval such as '00', '15',  '30' or '45' - The API will return an error when other 'mm' values are specified.\n  - interval=YYYYMMDDHHmm\n    - YYYYMMDDHH00 corresponds to >= 00 mins and < 15 mins interval\n    - YYYYMMDDHH15 corresponds to >= 15 mins and < 30 mins interval\n    - YYYYMMDDHH30 corresponds to >= 30 mins and < 45 mins interval\n    - YYYYMMDDHH45 corresponds to >= 45 mins and < 00 mins interval\n  - interval=starting:YYYYMMDDHHmm\n    - corresponds to >= YYYYMMDDHHmm\n  - interval=ending:YYYYMMDDHHmm\n    - corresponds to < YYYYMMDDHHmm\n  - interval=starting:YYYYMMDDHHmm,ending:YYYYMMDDHHmm\n    - ending interval is included in the report\n      - starting:YYYYMMDDHH00,ending:YYYYMMDDHH30 corresponds to >= 00 mins and < 45 mins\n      - starting:YYYYMMDDHH30,ending:YYYYMMDDHH30 corresponds to >= 30 mins and < 45 mins\n  - Example values:\n    - 202012010400\n    - starting:202012010415\n    - ending:202012251530\n    - starting:202012010415,ending:202012251545\n\nFor **AgentLoginLogout** report\n  - All datetime expressions for login/logout report should use the format YYYYMMDD or YYYYMMDDHHmm\n  - interval=starting:YYYYMMDDHHmm\n    - corresponds to >= YYYYMMDDHHmm\n  - interval=starting:YYYYMMDD\n    - corresponds to >= YYYYMMDD0000\n  - interval=ending:YYYYMMDDHHmm\n    - corresponds to < YYYYMMDDHHmm\n  - interval=ending:YYYYMMDD\n    - corresponds to < YYYYMMDD0000\n  - interval=starting:YYYYMMDDHHmm,ending:YYYYMMDDHHmm\n    - starting:YYYYMMDDHH00,ending:YYYYMMDDHH30 corresponds to >= 00 mins and < 30 mins\n    - starting:YYYYMMDDHH12,ending:YYYYMMDDHH25 corresponds to >= 12 mins and < 25 mins\n    - starting:YYYYMMDDHH30,ending:YYYYMMDDHH30 doesn't return data\n  - interval=starting:YYYYMMDD,ending:YYYYMMDD\n    - corresponds to >= YYYYMMDD0000 (starting) and < YYYYMMDD0000 (ending)\n  - Example values:\n    - starting:20201201\n    - starting:202012010417\n    - ending:20201225\n    - ending:202012251533\n    - starting:20201201,ending:20201225\n    - starting:202012010417,ending:202012251533\n"
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 41
      examples:
        singleQuarter:
          value: '202012250400'
          summary: Interval reports. Data filtering by certain date
        singleDay:
          value: '20201225'
          summary: Daily reports. Data filtering by certain date
        startingQuarter:
          value: starting:202012250400
          summary: Interval reports. Data filtering from specified starting date till ending of data rows
        startingDay:
          value: starting:20201201
          summary: Daily reports. Data filtering from specified starting date till ending of data rows
        endingQuarter:
          value: ending:202012251500
          summary: Interval reports. Data filtering from beginning of data rows till specified ending date
        endingDay:
          value: ending:20201225
          summary: Daily reports. Data filtering from beginning of data rows till specified ending date
        bothQuarter:
          value: starting:202012250400,ending:202012251500
          summary: Interval reports. Data filtering from specified starting date till specified ending date
        bothDay:
          value: starting:20201201,ending:20201225
          summary: Daily reports. Data filtering from specified starting date till specified ending date
    accountId:
      name: accountId
      in: path
      description: The unique 6 character internal id that represents the customer account.
      required: true
      schema:
        type: string
        minLength: 6
        maxLength: 6
        pattern: ^[a-zA-Z]{6}$
        example: ABCDEF
    pageSize:
      name: pageSize
      in: query
      description: The maximum number of results per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 50
        example: 20
    prevPageToken:
      name: prevPageToken
      in: query
      description: The page token of the previous set of records to retrieve, represented as unique 36 characters(uuid).
      required: false
      schema:
        type: string
        minLength: 36
        maxLength: 36
        example: 123e4567-e89b-12d3-a456-556642440000
    filter:
      name: filter
      in: query
      description: "Specifies details of a row filter. The allowed format:\n  - Begins with the column name to be filtered, followed by a colon, then:\n  - Either an exact string to match, or\n  - A string expression including the * wildcard character\n"
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 256
      examples:
        equals:
          value: agentLastName:agentKaren
          summary: Exact string to match
        like:
          value: agentLastName:agentK*
          summary: Expression including the * wildcard character
    nextPageToken:
      name: nextPageToken
      in: query
      description: The page token of the next set of records to retrieve, represented as unique 36 characters(uuid).
      required: false
      schema:
        type: string
        minLength: 36
        maxLength: 36
        example: 123e4567-e89b-12d3-a456-556642440000
    reportName:
      name: reportName
      in: path
      description: The unique name of the report
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      examples:
        AgentDaily:
          value: AgentDaily
        AgentInterval:
          value: AgentInterval
        AgentByChannelDaily:
          value: AgentByChannelDaily
        AgentByChannelInterval:
          value: AgentByChannelInterval
        AgentByQueueDaily:
          value: AgentByQueueDaily
        AgentByQueueInterval:
          value: AgentByQueueInterval
  examples:
    ErrorForbidden:
      description: Forbidden
