openapi: 3.2.0
info:
  title: Customer Journey API
  description: Customer Journey is used to retrieve information about Engagements and Conversations that have occurred in a Customer's Journey and to configure what Identifiers should be collected as part of a Customer's Journey.
  version: 1.1.1
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/onecloud-ccaas
    email: apiteam@avaya.com
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: http://support.avaya.com/css/P8/documents/101038288
servers:
- url: '{protocol}://{server}{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    basePath:
      default: /api/journey/v1
- url: '{protocol}://{server}:{port}'
  description: Internal API
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    server:
      default: journey-service
    port:
      enum:
      - '80'
      - '443'
      default: '80'
security:
- {}
- BearerAuth: []
  AppKey: []
tags:
- name: Journey
  description: Represents the history of Conversations and Engagements that a Customer has had with the business.
paths:
  /accounts/{accountId}/journeys:search:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - $ref: '#/components/parameters/pageSize'
    - $ref: '#/components/parameters/pageNumber'
    post:
      tags:
      - Journey
      summary: Search Journeys
      deprecated: false
      description: '**This API requires the Agent role.**


        Searches for Customer Journeys optionally using different specific filters.


        It makes it possible to narrow the search down to a particular conversation and only return the parts of the Customer''s Journey that satisfies the given filter criteria.


        The filter can include fields such as:

        * identifiers

        * channelIds

        * agentId

        * conversation

        * startDate & endDate


        If found, the Customer''s Journey will include a list of all the Engagements a Customer has had with the Contact Center, ordered by the `startDate` in descending order.'
      operationId: getJourneys
      requestBody:
        description: Search for Journeys
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyQuery'
            examples:
              advanced-search-all-fields:
                $ref: '#/components/examples/journey-query-advanced'
              simple-search-minimum-fields:
                $ref: '#/components/examples/journey-query-with-identifiers'
              everything-within-a-date-time-range:
                $ref: '#/components/examples/journey-query-within-date-time'
              everything-after-a-date-time-range:
                $ref: '#/components/examples/journey-query-after-date-time'
              everything-before-a-date-time-range:
                $ref: '#/components/examples/journey-query-before-date-time'
              filtering-by-a-particular-conversation:
                $ref: '#/components/examples/journey-query-with-conversation'
              filtering-by-an-agent:
                $ref: '#/components/examples/journey-query-with-agent'
              filtering-by-channels:
                $ref: '#/components/examples/journey-query-with-channels'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyQueryResponse'
              examples:
                Example-1:
                  $ref: '#/components/examples/journey-search-response'
        '400':
          description: 'Bad Request.


            * accountId must be exactly 6 characters


            * pageNumber must be greater than 0


            * pageSize must be between 1 and 50


            * Invalid input, ''Identifiers'' must not be empty

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/journeys:
    parameters:
    - $ref: '#/components/parameters/accountId'
    post:
      tags:
      - Journey
      summary: Create Journey
      description: 'Creates a new Customer Journey Identity grouping, the supplied "identifiers" will be linked together to form a single Customer Journey Identity. If any of the identifiers already exist, then any links they have will also be included.

        Note: This can be used to link previously unassociated identifiers together improving the accuracy of any searches involving them. Creating Journey this way **will not affect AXP''s Digital Workflow** , its only internal to Customer Journey.'
      operationId: createJourney
      requestBody:
        description: Create a new Customer Journey
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Journey'
            examples:
              Example-1:
                $ref: '#/components/examples/journey-create-1'
      responses:
        '202':
          description: Accepted
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* Request has invalid input\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/journeys:unlinkIdentifier:
    parameters:
    - $ref: '#/components/parameters/accountId'
    post:
      tags:
      - Journey
      summary: Unlink Identifier
      description: 'Unlinks an identifier from a Customer Journey, the supplied **unlinkIdentifier** will be unlinked from the rest of the provided identifiers. The updated state of identifiers will be returned in the response.

        This can be used to unlink previously associated identifiers to improve the accuracy of any searches involving them.

        Note: This does not delete the identifier, instead it simply "unlinks" it from any other associated identifiers. It can still be used as part of a search.

        And this way unlinking identifier from Customer Journey **will not affect AXP''s Digital Workflow** , its only internal to Customer Journey.'
      operationId: unlinkIdentifier
      requestBody:
        description: Unlink an identifier from a Customer Journey.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlinkJourney'
            examples:
              unlink-account-id:
                $ref: '#/components/examples/unlink-account-id-request'
              unlink-email-address:
                $ref: '#/components/examples/unlink-email-address-request'
              unlink-phone-number:
                $ref: '#/components/examples/unlink-phone-number-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
              examples:
                unlink-account-id:
                  $ref: '#/components/examples/unlink-account-id-response'
                unlink-email-address:
                  $ref: '#/components/examples/unlink-email-address-response'
                unlink-phone-number:
                  $ref: '#/components/examples/unlink-phone-number-response'
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* Request has invalid input\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/journeys:listAgents:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - name: pageSize
      description: The maximum number of results per page
      required: false
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10
        default: 1
        example: 10
    - name: orderBy
      description: 'Ordering is performed on the "leftAt" field, the default order is descending.


        To specify ascending order, "asc" should be used.

        '
      required: false
      in: query
      schema:
        type: string
        minLength: 3
        maxLength: 4
        default: desc
      example: asc
    post:
      tags:
      - Journey
      summary: List Agents
      description: 'Lists the Agents to have participated on a Customer''s Journey for the required Channel within a timeframe. By default this is limited to the last 30 days unless a "startDate" for the search is provided.


        The Agents are listed in descending order based on the "leftAt" timefield, this can be changed to ascending with the optional "orderBy" parameter.


        This does not include any Agents that are currently active on the Customer''s Journey that have yet to leave.'
      operationId: listAgents
      requestBody:
        description: Search criteria.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAgentsQuery'
            examples:
              Example-1:
                $ref: '#/components/examples/list-agents-query-1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: A list containing Agents from a Customer's Journey that match the search criteria.
                items:
                  $ref: '#/components/schemas/ListAgentResponse'
              examples:
                Example-1:
                  $ref: '#/components/examples/list-agents-response'
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* pageSize must be between 1 and 10\n\n* orderBy must have value 'asc' or 'desc'\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
