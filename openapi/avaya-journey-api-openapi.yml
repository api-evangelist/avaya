        updatedBy:
          $ref: '#/components/schemas/AgentDetails'
        note:
          type: string
          description: Text of the current Agent Note.
        readOnly:
          type: boolean
          description: Indicates if the note is read only.
        createdAt:
          type: string
          format: date-time
          description: The creation datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:20:39+00:00
          example: '2018-11-13T20:20:39+00:00'
        updatedAt:
          type: string
          format: date-time
