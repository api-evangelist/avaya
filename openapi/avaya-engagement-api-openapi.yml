openapi: 3.2.0
info:
  title: Customer Journey Engagement API
  description: Customer Journey is used to retrieve information about Engagements and Conversations that have occurred in a Customer's Journey and to configure what Identifiers should be collected as part of a Customer's Journey.
  version: 1.1.1
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/onecloud-ccaas
    email: apiteam@avaya.com
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: http://support.avaya.com/css/P8/documents/101038288
servers:
- url: '{protocol}://{server}{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    basePath:
      default: /api/journey/v1
- url: '{protocol}://{server}:{port}'
  description: Internal API
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    server:
      default: journey-service
    port:
      enum:
      - '80'
      - '443'
      default: '80'
security:
- {}
- BearerAuth: []
  AppKey: []
tags:
- name: Engagement
  description: Represents a resource of the Contact Center being allocated. Engagements can be assigned to one or many Conversations, although this is not mandatory.
paths:
  /accounts/{accountId}/engagements:
    parameters:
    - $ref: '#/components/parameters/accountId'
    get:
      tags:
      - Engagement
      summary: List Engagements
      description: '**This API requires the Agent role.**


        Gets a list of Engagements by querying by their Engagement ids. The Engagements are returned in the same order as the ids are supplied.


        Only Engagements that can be found will be included in the resulting response. If none of the Engagements can be found, then a 404 Not Found response will be returned instead.'
      operationId: getEngagements
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - in: query
        name: engagementIds
        required: true
        description: A comma-separated list of Engagement id's.
        schema:
          type: array
          items:
            type: string
            minLength: 36
            maxLength: 36
            pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
          minItems: 1
          maxItems: 50
          uniqueItems: true
        examples:
          oneId:
            summary: Example of a single id.
            value:
            - b9da2450-415c-46ff-af58-0c3f39aee204
          multipleIds:
            summary: Example of multiple ids
            value:
            - b9da2450-415c-46ff-af58-0c3f39aee204
            - 9a8575cb-344f-4435-88b0-233455323a52
            - db158d0e-3926-45b5-a353-35d1e8b82705
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEngagementsResponse'
              examples:
                Example-1:
                  $ref: '#/components/examples/multi-engagement-response'
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* pageNumber must be greater than 0\n\n* pageSize must be between 1 and 50\n\n* engagementIds size must be between 1 and 50\n\n* engagementIds must be 36 character UUIDs\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      deprecated: false
    post:
      tags:
      - Engagement
      summary: Create Engagement
      description: 'Creates a new Engagement or Customer Journey''s touchpoint in a Customer''s Journey .

        Note: Engagements created this way **WILL NOT** be routed to an Agent or not affect **AXP''s Digital workflow** and exist solely within a Customer Journey for historical purposes.'
      operationId: createEngagement
      requestBody:
        description: Create a new Engagement in a Customer's Journey
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Engagement'
            examples:
              Example-1:
                $ref: '#/components/examples/engagement-create-1'
              Example-2:
                $ref: '#/components/examples/engagement-create-2'
      responses:
        '202':
          description: Accepted
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* id must not be empty\n\n* startDate must not be empty\n\n* identifiers size must be between 1 and 20\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/engagements/{engagementId}:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - $ref: '#/components/parameters/engagementId'
    get:
      tags:
      - Engagement
      summary: Get Engagement
      description: '**This API requires the Agent role.**


        Gets a single Engagement in a Customer''s Journey by its Engagement id.'
      operationId: getEngagement
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementResponse'
              examples:
                Example-1:
                  $ref: '#/components/examples/engagement-response'
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* engagementId must be a 36 character UUID\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/engagements/{engagementId}:update:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - $ref: '#/components/parameters/engagementId'
    post:
      tags:
      - Engagement
      summary: Update Engagement
      description: 'Updates an existing Engagement or Customer Journey''s touchpoint in a Customer''s Journey.

        Note: Engagement updated this way **WILL NOT** be routed to an Agent or not affect **AXP''s digital workflow** and exist solely within a Customer Journey.'
      operationId: updateEngagement
      requestBody:
        description: Update an existing Engagement in a Customer's Journey
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementUpdate'
            examples:
              Example-1:
                $ref: '#/components/examples/engagement-update-1'
      responses:
        '202':
          description: Accepted
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* engagementId must be a 36 character UUID\n\n* No valid identifiers configured for account\n\n* Invalid customerIds type in the request [*]\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
  /accounts/{accountId}/engagements/{engagementId}:appendIdentifiers:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - $ref: '#/components/parameters/engagementId'
    post:
      tags:
      - Engagement
      summary: Append Identifiers
      description: 'Appends identifiers to an Engagement or Customer Journey''s touchpoint.

        Note: This way appending Identifier to an Engagement **WILL NOT** be routed to an Agent or not affect **AXP''s digital workflow** and exist solely within a Customer Journey.'
      operationId: appendIdentifiers
      requestBody:
        description: Append identifiers to an Engagement
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identifiers'
            examples:
              Example-1:
                $ref: '#/components/examples/appendIdentifiers'
      responses:
        '202':
          description: Accepted
        '400':
          description: "Bad Request. \n\n* accountId must be exactly 6 characters\n\n* engagementId must be a 36 character UUID\n"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  $ref: '#/components/examples/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
components:
  schemas:
    AgentNoteResponse:
      title: AgentNoteResponse
      description: Response for Get Agent Note.
      type: object
      properties:
        id:
          type: string
          description: The unique 36 character internal id that represents the Agent Note Id.
        engagementId:
          type: string
          description: The unique 36 character internal id that represents the Engagement Id.
        createdBy:
          $ref: '#/components/schemas/AgentDetails'
        updatedBy:
          $ref: '#/components/schemas/AgentDetails'
        note:
          type: string
          description: Text of the current Agent Note.
        readOnly:
          type: boolean
          description: Indicates if the note is read only.
        createdAt:
          type: string
          format: date-time
          description: The creation datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:20:39+00:00
          example: '2018-11-13T20:20:39+00:00'
        updatedAt:
          type: string
          format: date-time
          description: The creation datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:20:39+00:00
          example: '2018-11-13T20:20:39+00:00'
    ParticipantResponse:
      type: object
      description: Any External, Agent or Treatment participant as returned by a query for a customer journey
      properties:
        type:
          type: string
          description: The type of Participant, for example EXTERNAL, AGENT or TREATMENT.
          enum:
          - EXTERNAL
          - AGENT
          - TREATMENT
        id:
          type: string
          description: The unique id that represents the participant.
        agentDisplayName:
          type: string
          description: This value defines the internal participants name as it will be displayed to Avaya Experience Platform user.
          readOnly: true
          example: John Smith
        dialogId:
          type: string
          description: The unique 36 character internal id that represents the Dialog.
        channelId:
          type: string
          description: The unique id representing the Contact Center Channel. Only valid Contact Center Channel Ids are accepted. See Contact Center Channel list in Developers guide for further details.
          example: Voice
        channelType:
          type: string
          description: The Contact Center Channel Type. Only valid Contact Center Channel Types are accepted. See Contact Center Channel list in Developers guide for further details.
          example: VOICE
        joinedAt:
          type: string
          description: The datetime of when the Participant was added to the Engagement in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
          format: date-time
        leftAt:
          type: string
          description: The datetime of when the Participant was removed from the Engagement in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
          format: date-time
        callingNumber:
          type: string
          description: The calling number of the Participant.
        dialledNumber:
          type: string
          description: The original dialled number for the Engagement.
        extension:
          type: string
          description: The agents extension.
        automationType:
          type: string
          enum:
          - SELF_SERVICE
          - TREATMENT
          - CHATBOT
          description: The automation type, such as SELF_SERVICE, TREATMENT, or CHATBOT.
        sourceType:
          type: string
          description: This value defines the external system that was the source of the engagement that is being generated into Avaya Experience Platform
          readOnly: true
          example: Facebook
        sourceAddress:
          type: string
          description: 'the source address is intended to represent the address from which the Avaya Experience Platform engagement was created. It might represent a mailbox, a twitter account, a Facebook account, a chat integration will be the same as the (To) address '
          readOnly: true
          example: '@someSocialMediaAccount'
    Engagement:
      title: Engagement
      description: A Customer Engagement with the Contact Center
      allOf:
      - $ref: '#/components/schemas/Identifiers'
      - type: object
        additionalProperties: true
        required:
        - id
        - identifiers
        - startDate
        properties:
          id:
            type: string
            description: The unique 36 character internal id that represents the engagement.
            minLength: 36
            maxLength: 36
            pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
            example: dfd117d7-73e3-4436-8bd7-3ce8f1a008ed
          status:
            type: string
            readOnly: true
            description: The current internal status of the engagement such as CREATED, ACTIVE or COMPLETED.
            enum:
            - CREATED
            - ACTIVE
            - COMPLETED
          startDate:
            type: string
            format: date-time
            description: The start datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:20:39+00:00
            example: '2018-11-13T20:20:39+00:00'
          updateDate:
            type: string
            format: date-time
            readOnly: true
            description: The last updated datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:25:39+00:00
            example: '2018-11-13T20:25:39+00:00'
          endDate:
            type: string
            format: date-time
            readOnly: true
            description: The end datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
            example: '2018-11-13T20:27:12+00:00'
          conversations:
            type: array
            minItems: 0
            maxItems: 10
            items:
              type: string
              minLength: 3
              maxLength: 256
            description: The conversation (or purpose) of the Engagement.
          data:
            type: object
            description: 'Optional, generic key-value pair data stored with the Engagement. The maximum length of a key is 64 characters and the maximum length of a value is 1024 characters.


              This is useful for storing custom information against an Engagement, Customer Journey itself does not take any action beyond basic validation on this data.


              If the key already exists the value will be replaced by the new value provided.

              '
            minProperties: 0
            maxProperties: 20
            additionalProperties:
              type: string
              minLength: 3
              maxLength: 1024
            example:
              ticketId: ticket-4652f066-39f2-43e1-a5ae-d8f8d210fe66
              applicationStatus: In Review
    Channel:
      title: Channel
      description: Identifies the specific type of channel such as VOICE, WEBCHAT, EMAIL, SMS, or SOCIAL.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the channel.
          example: Voice
        type:
          type: string
          description: The type of channel, such as VOICE, or VIDEO.
          example: VOICE
    Identifiers:
      type: object
      description: Unique Customer ids used during an Engagement.
      properties:
        identifiers:
          type: object
          minProperties: 1
          maxProperties: 10
          description: Unique identifiers for identifying the customer during an Engagement such as phoneNumbers or emailAddresses.
          additionalProperties:
            type: array
            description: 'Additional identifiers related to the Customer. The maximum length of an identifer key is 50 characters and must be a valid "name" of a pre-configured identifier in Customer Journey.

              '
            minItems: 0
            maxItems: 5
            items:
              type: string
              minLength: 1
              maxLength: 256
          properties:
            phoneNumbers:
              type: array
              description: List of phone numbers.
              minItems: 0
              maxItems: 5
              items:
                type: string
                minLength: 3
                maxLength: 256
            emailAddresses:
              type: array
              description: List of email addresses.
              minItems: 0
              maxItems: 5
              items:
                type: string
                minLength: 3
                maxLength: 256
            accountIds:
              type: array
              description: List of customer account id's.
              minItems: 0
              maxItems: 5
              items:
                type: string
                minLength: 3
                maxLength: 256
    EngagementResponse:
      title: EngagementResponse
      description: A Customer Engagement with the Contact Center
      allOf:
      - $ref: '#/components/schemas/Identifiers'
      - type: object
        additionalProperties: true
        properties:
          id:
            type: string
            description: The unique 36 character internal id that represents the engagement.
          status:
            type: string
            readOnly: true
            description: The current internal status of the engagement such as CREATED, ACTIVE or COMPLETED.
            enum:
            - CREATED
            - ACTIVE
            - COMPLETED
          direction:
            type: string
            readOnly: true
            description: 'The internal direction which signifies if the engagement was initiated by an external user (INBOUND) or from within the contact center, e.g. an agent driven ad-hoc email (OUTBOUND).

              '
            enum:
            - INBOUND
            - OUTBOUND
            example: INBOUND
          channels:
            type: array
            items:
              $ref: '#/components/schemas/Channel'
            description: List of channels associated with the Engagement.
          agentNotes:
            type: array
            items:
              $ref: '#/components/schemas/AgentNoteResponse'
            description: List of agent notes associated with the Engagement.
          startDate:
            type: string
            format: date-time
            description: The start datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:20:39+00:00
            example: '2018-11-13T20:20:39+00:00'
          updateDate:
            type: string
            format: date-time
            description: The last updated datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:25:39+00:00
            example: '2018-11-13T20:25:39+00:00'
          endDate:
            type: string
            format: date-time
            description: The end datetime of the Engagement in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
            example: '2018-11-13T20:27:12+00:00'
          conversations:
            type: array
            minItems: 0
            maxItems: 50
            items:
              type: string
            description: The conversation (or purpose) of the Engagement.
          participants:
            type: array
            minItems: 0
            maxItems: 50
            items:
              $ref: '#/components/schemas/ParticipantResponse'
            description: List of participants on the Engagement
          accountId:
            type: string
            description: The unique 6 character internal id that represents the customer account
            readOnly: true
          data:
            type: object
            description: 'Optional, generic key-value pair data stored with the Engagement.

              This is useful for storing custom information that a client

              can then interpret.

              '
            minProperties: 0
            maxProperties: 50
            additionalProperties:
              type: string
          attributes:
            type: array
            items:
              type: string
            description: List of last set of attributes per category on the Engagement
          queues:
            type: array
            items:
              $ref: '#/components/schemas/Queue'
            description: List of queues on the Engagement
          sourceType:
            type: string
            description: This value defines the external system that was the source of the engagement that is being generated into Avaya Experience Platform
            readOnly: true
            example: Facebook
          sourceAddress:
            type: string
            description: 'the source address is intended to represent the address from which the Avaya Experience Platform engagement was created. It might represent a mailbox, a twitter account, a Facebook account, a chat integration will be the same as the (To) address '
            readOnly: true
            example: '@someSocialMediaAccount'
          transfers:
            type: array
            items:
              $ref: '#/components/schemas/Transfer'
            description: List of Transfer on the Engagement
    EngagementUpdate:
      title: EngagementUpdate
      description: A Customer Engagement with the Contact Center
      allOf:
      - $ref: '#/components/schemas/Identifiers'
      - type: object
        additionalProperties: true
        description: A Customer Engagement with the Contact Center
        required:
        - timestamp
        properties:
          timestamp:
            type: string
            format: date-time
            description: The datetime of the Engagement being updated in ISO 8601 format, for example 2018-11-13T20:20:39+00:00
            example: '2018-11-13T20:20:39+00:00'
          conversations:
            type: array
            minItems: 0
            maxItems: 10
            items:
              type: string
              minLength: 3
              maxLength: 256
            description: The conversation (or purpose) of the Engagement.
          data:
            type: object
            description: 'Optional, generic key-value pair data stored with the Engagement. The maximum length of a key is 64 characters and the maximum length of a value is 1024 characters.


              This is useful for storing custom information against an Engagement, Customer Journey itself does not take any action beyond basic validation on this data.


              If the key already exists the value will be replaced by the new value provided.

              '
            minProperties: 0
            maxProperties: 20
            additionalProperties:
              type: string
              minLength: 3
              maxLength: 1024
            example:
              ticketId: ticket-4652f066-39f2-43e1-a5ae-d8f8d210fe66
              applicationStatus: In Review
    AgentDetails:
      title: AgentDetails
      description: Agent Details.
      type: object
      properties:
        id:
          type: string
          description: The unique 36 character internal id that represents the Agent Id.
          minLength: 3
          maxLength: 100
        name:
          type: string
          description: The Agent/Supervisor Name.
          minLength: 3
          maxLength: 100
    Pagination:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The current page number.
        pageSize:
          type: integer
          description: The max number of records that can be retrieved on this page.
        total:
          type: integer
          description: The total number of records.
    ListEngagementsResponse:
      type: object
      description: A paginated list of Engagements with the Contact Center
      properties:
        engagements:
          type: array
          description: The engagements returned as the result
          items:
            $ref: '#/components/schemas/EngagementResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Queue:
      type: object
      title: Queue
      description: The queue details part of an engagement.
      required:
      - queueId
      - channelId
      - priority
      properties:
        queueId:
          description: The unique case sensitive id of the queue. Only valid Contact Center Queue Id's are accepted. See Queue Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        queueName:
          type: string
          description: The Queue name for the queue.
          example: Default
        channelId:
          description: The id representing the Contact Center Channel. Only valid Contact Center Channel Id's are accepted. See Channel page in Avaya Experience Platform Fundamentals section of Developer Guides for a list of supported Channel Id's.
          type: string
          minLength: 3
          maxLength: 256
        priority:
          description: The priority of this queue request. The smaller the number meaning the higher the priority.
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        rank:
          description: This is the rank of this queue in the context of a match request, when the match request contains multiple queues.
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        proficiencyRangeMin:
          description: Agents who have a proficiency equal or greater than this for the required queue will be preferred. The smaller the number meaning the highest ranked or best agent. The larger the number meaning the lower the agent ranking.
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        proficiencyRangeMax:
          description: Agents who have a proficiency equal or less than this for the required queue will be preferred. The smaller the number meaning the highest ranked or best agent. The larger the number meaning the lower the agent ranking.
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        queuedAt:
          type: string
          format: date-time
          readOnly: true
          description: The datetime of when the engagement offered into a queue in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
          example: '2018-11-13T20:27:12+00:00'
        agentId:
          type: string
          description: The unique 36 character internal id that represents the agent that accepted the queued engagement.
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
          example: bb4f5cf8-5bfc-4bf3-ac43-153c43671f0e
        acceptedAt:
          type: string
          format: date-time
          readOnly: true
          description: The datetime of when the agent accepted the queued engagement in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
          example: '2018-11-13T20:27:12+00:00'
    Transfer:
      type: object
      title: Transfer
      description: The Transfer details part of an engagement.
      required:
      - channelProviderId
      - transferType
      properties:
        initiatingAgentId:
          description: The unique case sensitive id of the initiating Agent Id. Only valid Contact Center Agent Id's are accepted. See Agent Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        queueId:
          description: The unique case sensitive id of the queue. Only valid Contact Center Queue Id's are accepted. See Queue Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        queueName:
          type: string
          description: The Queue name for the queue.
          example: Default
        channelProviderId:
          description: The unique case sensitive id of the channel provider. Only valid Contact Center provider Id's are accepted. See Admin channel List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        channelId:
          type: string
          description: The unique id representing the Contact Center Channel. Only valid Contact Center Channel Ids are accepted. See Contact Center Channel list in Developers guide for further details.
          example: Voice
        connectionId:
          description: The unique case sensitive id of the connection. Only valid Contact Center connection Id's are accepted. See Queue Admin connection List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        dialogId:
          description: The unique case sensitive id of the dialog. Only valid Contact Center dialog Id's are accepted. See Dialog Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        providerDialogId:
          description: The unique case sensitive id of the dialog. Only valid Contact Center dialog provider Id's are accepted. See Dialog Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        correlationId:
          description: The unique case sensitive id of the Correlation. Only valid Contact Center Queue Id's are accepted. See Queue Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        fallbackQueueId:
          description: The unique case sensitive id of the queue. Only valid Contact Center Fall back Queue Id's are accepted. See Queue Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: The datetime of when the engagement transfer offered into a queue in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
          example: '2018-11-13T20:27:12+00:00'
        destinationAgentId:
          description: The unique case sensitive id of the Agent. Only valid Contact Center Agent Id's are accepted. See Agent Admin List API.
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
        destinationAgentName:
          type: string
          description: The engagement transfer agent name for the Agents.
          example: Jone Smith
        destinationExternalNumber:
          type: string
          description: When the engagement is transferred to external numbers.
          example: +1 123 123 1234
        destinationAgentJoinedAt:
          type: string
          format: date-time
          readOnly: true
          description: The datetime of when the engagement offered into a Agent in ISO 8601 format, for example 2018-11-13T20:27:12+00:00
          example: '2018-11-13T20:27:12+00:00'
        description:
          type: string
          description: The dialog description incase of any.
          example: New Car inquiry
        transferType:
          type: string
          description: The type of Transfers, for example TRANSFER_TO_AGENT, TRANSFER_TO_QUEUE or CONSULT_TRANSFER_TO_QUEUE.
          enum:
          - TRANSFER_TO_AGENT
          - TRANSFER_TO_QUEUE
          - TRANSFER_TO_EXTERNAL
          - CONSULT_TRANSFER_TO_QUEUE
    Problem:
      type: object
      description: '<b>Problem Detail</b> as a way to carry machine-readable details of errors in a HTTP response to avoid the need to define new error response formats for HTTP APIs <a href="https://tools.ietf.org/html/rfc7807">RFC 7807</a>

        '
      properties:
        type:
          type: string
          format: uri
          description: 'An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type (e.g., using HTML).

            '
          default: about:blank
          example: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#constraint-violation
        title:
          type:
          - string
          - 'null'
          description: 'A short, summary of the problem type. Written in english and readable for engineers (usually not suited for non technical stakeholders and not localized).

            '
          example: Service Unavailable
        status:
          type:
          - integer
          - 'null'
          format: int32
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          example: 503
          exclusiveMaximum: 600
        detail:
          type:
          - string
          - 'null'
          description: 'A human readable explanation specific to this occurrence of the problem.

            '
          example: Connection to database timed out
        instance:
          type:
          - string
          - 'null'
          format: uri
          description: 'An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.

            '
        violations:
          type:
          - array
          - 'null'
          description: 'A list of violations that occurred as a result of invalid data provided as part of a request.

            '
          items:
            type: object
            properties:
              field:
                type: string
                description: 'The name of the field in the request that caused the violation. This can be the name of a path parameter, query parameter, or a field within the request body.

                  '
                example: accountId
              message:
                type: string
                description: 'A human readable explanation specific to this occurrence of the violation.

                  '
                example: must match "^[a-zA-Z]{6}$"
              code:
                type: integer
                format: int32
                description: 'The violation code generated by the server for this occurrence of the violation. Use this code when implementing any error handling logic instead of the message, as the message can change.

                  '
                example: 20006
          example:
          - field: emailAddress
            message: must not be null
            code: 20002
          - field: accountId
            message: must match "^[a-zA-Z]{6}$"
            code: 20006
