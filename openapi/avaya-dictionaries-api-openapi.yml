openapi: 3.2.0
info:
  title: Analytics Producer Management Dictionaries API
  description: 'This is the Analytics Producer Management API. This REST interface provides APIs to:

    - read the list of Measure Producers

    - read details regarding each registered Measure Producer such as dimension and measure sets

    - read translations from the dictionary of a registered Measure Producer for one or more locales'
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/onecloud-ccaas
    email: apiteam@avaya.com
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: http://support.avaya.com/css/P8/documents/101038288
  version: 1.0.1
servers:
- url: '{protocol}://{server}/{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    basePath:
      default: api/analytics/producer-management
- url: '{protocol}://{server}:{port}'
  description: Internal API
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    server:
      default: analytics-data-subscriber
    port:
      enum:
      - '80'
      - '443'
      default: '80'
security:
- {}
- BearerAuth: []
tags:
- name: Dictionaries
  description: Dictionaries contain translations for measures for a specific locale and measure producer.
paths:
  /v1/accounts/{accountId}/measure-producers/{measureProducerId}/dictionaries/{locale}:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - $ref: '#/components/parameters/measureProducerId'
    - $ref: '#/components/parameters/locale'
    get:
      tags:
      - Dictionaries
      summary: Get Dictionaries
      description: Return the dictionary associated with a measure producer for the given locale.
      operationId: getAnalyticsDictionary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictionary'
              example:
                locale: ko
                description: Avaya Experience Platform™ metrics
                measures:
                - name: agentId
                  displayName: 상담원 ID
                  description: 해당 상담원 ID
                - name: agentState
                  displayName: 상담원 상태
                  description: 현재 상담원 상태
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
components:
  examples:
    ErrorConstraintViolation:
      description: Constraint Violation
      value:
        type: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#constraint-violation
        title: Constraint Violation
        status: 400
        detail: A problem that indicates a syntactically correct, yet semantically illegal request. The Server can not process this request until the client resolves the semantic errors described in the violations section.
        violations:
        - field: accountId
          message: must not be null
    ErrorNotFound:
      description: Not Found
      value:
        type: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#resource-not-found
        title: Resource Not Found
        status: 404
        detail: Resource not found.
    ErrorForbidden:
      description: Forbidden
      value:
        type: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#forbidden
        title: Forbidden
        status: 403
        detail: According to the access control policy the current user and/or accountId does not have permission to access this resource.
    ErrorInternalServerError:
      description: Server Error
      value:
        type: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#server-error
        title: Server Error
        status: 500
        detail: An internal server error was encountered.
    ErrorUnauthorized:
      description: Unauthorized
      value:
        type: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#unauthorized
        title: Unauthorized
        status: 401
        detail: This operation requires authentication. See https://developers.avayacloud.com/onecloud-ccaas/docs/how-to-authenticate-with-ccaas-apis
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorForbidden'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorUnauthorized'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorNotFound'
    InternalServer:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorInternalServerError'
    BadRequest:
      description: BadRequest
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ErrorConstraintViolation'
  parameters:
    locale:
      in: path
      name: locale
      description: Locale associated with a dictionary for a Measure Producer.
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 6
        pattern: ^[A-Za-z]{2,4}$|[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}))
        example: en-US
    accountId:
      in: path
      name: accountId
      description: The unique 6 character internal id that represents the customer account.
      required: true
      schema:
        type: string
        minLength: 6
        maxLength: 6
        pattern: ^[a-zA-Z]{6}$
        example: ABCDEF
    measureProducerId:
      in: path
      name: measureProducerId
      description: MeasureProducer unique Id.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 36
        example: Queue_itd_1.0.0
  schemas:
    Translation:
      type: object
      description: The Translation for dimensions and measures from english to a specific locale. The translation is composed of a measure and its corresponding measureProducer translated from english to another language.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the measure
          example: agentId
        displayName:
          type: string
          description: The name of the measure to be displayed on the user interface.
          example: Agent Id
        description:
          type: string
          description: A short description of the measure.
          example: The unique identifier for the agent
    Dictionary:
      type: object
      description: A dictionary is composed of a locale field and a translations array. It represents a collection of translations for dimensions and measures in the locale.
      required:
      - locale
      - description
      - measures
      properties:
        locale:
          type: string
          description: Language and region that the dictionary pertains to.
          example: en-US
        description:
          type: string
          minLength: 1
          maxLength: 256
          description: A short description of the dictionary
          example: Avaya Experience Platform™ metrics
        measures:
          type: array
          minItems: 1
          description: An array containing all the translations for the dictionary.
          items:
            $ref: '#/components/schemas/Translation'
    Problem:
      type: object
      description: '<b>Problem Detail</b> as a way to carry machine-readable details of errors in a HTTP response to avoid the need to define new error response formats for HTTP APIs <a href="https://tools.ietf.org/html/rfc7807">RFC 7807</a>

        '
      properties:
        type:
          type: string
          format: uri
          description: 'An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type (e.g., using HTML).

            '
          default: about:blank
          example: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#constraint-violation
        title:
          type:
          - string
          - 'null'
          description: 'A short, summary of the problem type. Written in english and readable for engineers (usually not suited for non technical stakeholders and not localized).

            '
          example: Service Unavailable
        status:
          type:
          - integer
          - 'null'
          format: int32
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          example: 503
          exclusiveMaximum: 600
        detail:
          type:
          - string
          - 'null'
          description: 'A human readable explanation specific to this occurrence of the problem.

            '
          example: Connection to database timed out
        instance:
          type:
          - string
          - 'null'
          format: uri
          description: 'An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.

            '
        violations:
          type:
          - array
          - 'null'
          description: 'A list of violations that occurred as a result of invalid data provided as part of a request.

            '
          items:
            type: object
            properties:
              field:
                type: string
                description: 'The name of the field in the request that caused the violation. This can be the name of a path parameter, query parameter, or a field within the request body.

                  '
                example: accountId
              message:
                type: string
                description: 'A human readable explanation specific to this occurrence of the violation.

                  '
                example: must match "^[a-zA-Z]{6}$"
              code:
                type: integer
                format: int32
                description: 'The violation code generated by the server for this occurrence of the violation. Use this code when implementing any error handling logic instead of the message, as the message can change.

                  '
                example: 20006
          example:
          - field: emailAddress
            message: must not be null
            code: 20002
          - field: accountId
            message: must match "^[a-zA-Z]{6}$"
            code: 20006
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: This API uses Bearer Token Authorization Flow
      bearerFormat: JWT
x-explorer-enabled: false
x-samples-languages:
- curl
- node
- java
- javascript
- python
- go
