    Address:
      description: A real address for an user.
      type: object
      required:
      - addressName
      - streetName
      - streetNumber
      - countryCode
      - zip
      properties:
        addressId:
          type: string
          example: c8c2909d-75e9-484a-94c0-b7e8d29771fe
          minLength: 36
          maxLength: 36
          readOnly: true
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        addressName:
          type: string
          minLength: 2
          maxLength: 32
          pattern: ^[a-zA-Z\p{L}0-9]+([ ]*[a-zA-Z\p{L}0-9-\_\*\=\+\$\:\;\&\~\,\?\%\!\|\{\}\`\.\']+)*$
          example: Home address
        addressType:
          type:
          - string
          - 'null'
          enum:
          - OFFICE
          - APARTMENT
          - BASEMENT
          - BUILDING
          - DEPARTMENT
          - FLOOR
          - FRONT
          - KEY
          - LOBBY
          - LOT
          - LOWER
          - PENTHOUSE
          - PIER
          - REAR
          - ROOM
          - SIDE
          - SLIP
          - SPACE
          - STOP
          - SUITE
          - TRAILER
          - UNIT
          - UPPER
          example: UNIT
          description: It is to narrow down the exact dispatched location for the agent/user
        addressTypeNumber:
          type: string
          minLength: 0
          maxLength: 64
          example: '101'
          description: It is optional unless the AddressType is specified and it can be used for things like "Floor 1" or "Unit 101".
        streetNumber:
          type: string
          minLength: 1
          maxLength: 16
          example: A11
        streetName:
          type: string
          minLength: 2
          maxLength: 128
          example: Allstate Pkwy
        city:
          type: string
          minLength: 0
          maxLength: 128
          example: Markham
        state:
          type: string
          minLength: 1
          maxLength: 3
          example: 'ON'
        countryCode:
          type: string
          minLength: 2
          maxLength: 3
          pattern: ^[A-Za-z]{2,3}$
          example: ZW
        zip:
          type: string
          minLength: 4
          maxLength: 16
          example: L3R9T8
          pattern: ^[A-Za-z0-9\p{L}_ -]*$
        isDefault:
          type: boolean
          description: Indicated default address of user
          example: false
          default: false
    Provider:
      type: object
