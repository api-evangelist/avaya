    Criteria:
      type: object
      description: Filter criteria with attribute and discriminator
      title: Criteria
      properties:
        discriminator:
          type: string
          enum:
          - AND
          - OR
          description: Possible values are AND, OR
        key:
          type: string
          minLength: 2
          maxLength: 50
          example: firstName
          description: Possible values are loginId,lastName,firstName,emailId,organizationNodeId
        operator:
          type: string
          enum:
