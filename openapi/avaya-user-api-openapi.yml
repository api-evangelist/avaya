      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
        example: 2
    userId:
      name: userId
      in: path
      description: The unique 36 character internal id (uuid) that represents the user.
      required: true
      schema:
        type: string
        example: c8c2909d-75e9-484a-94c0-b7e8d29771fe
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    sortBy:
      name: sortBy
      in: query
      description: 'Field to sort users by. Note that `lastUpdated` is initialized to `createdOn`

        when the user is created, so users that have never been modified will have

        matching values for both fields.

        '
      required: false
      schema:
        type: string
        enum:
        - CREATED_ON
        - LAST_UPDATED
        - FIRST_NAME
        - LAST_NAME
        example: CREATED_ON
    forceDisable:
      name: forceDisable
      in: query
      description: 'Force a user to be disabled even while still active.


        In an update uesr request, this parameter has no effect if the request payload does not

        include setting the `status` to `disabled`.

        '
      required: false
      schema:
        type: boolean
        default: false
