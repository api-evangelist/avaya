openapi: 3.2.0
info:
  title: Avaya User API
  version: '1.0'
  description: 'Operations tagged User across 2 of this provider''s published API definitions: avaya-axp-admin-user-openapi-original.json, avaya-infinity-user-management-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{protocol}://{server}:{port}{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    port:
      enum:
      - '443'
      default: '443'
    basePath:
      default: /api/admin/user/v1
- url: https://core.{customerId}.ec.avayacloud.com/api/config/v1
  description: Production
  variables:
    customerId:
      description: Your organization identifier
      default: your-org-id
tags:
- name: User
  description: Represents a user in the system. A user can be an Agent, Supervisor or an Administrator.
paths:
  /accounts/{accountId}/users:
    get:
      tags:
      - User
      summary: List Users
      description: '**This API requires the Account Administrator role.**


        Lists all of the users for an account.'
      operationId: listUsers
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/pageNumber'
      - name: pageSize
        in: query
        description: 'The max number of records to retrieve per page. Default value is 10.

          '
        required: false
        schema:
          type: integer
          format: int32
          example: 5
          default: 10
          minimum: 5
          maximum: 50
      - name: filter
        in: query
        required: false
        description: "Specifies details of a row filter.\n\n The possible fields that can be filtered on are:\n  * loginId\n  * lastName\n  * firstName\n  * emailId\n  * organizationNodeId\n  * profileId\n\nThe allowed format:\n  - Begins with the column name to be filtered, followed by a colon, then:\n    - Either an exact string to match, or\n    - A string expression including the * wildcard character\n      - :{PREFIX}* will be used to find out word start with.\n      - :*{POSTFIX} will be used to find out word end with\n      - : will be used to match exact word\n  - Begin with column name to be filtered, followed by a = operator. (this will be used to match exact string)\n"
        schema:
          type: string
          maxLength: 255
        examples:
          exact:
            description: Example of filtering based on an exact string.
            value: lastName=Stevens
          prefix:
            description: Example of filtering based on a prefix string.
            value: lastName:Stevens*
          postfix:
            description: Example of filtering based on a postfix string.
            value: lastName:*Stevens
      - name: orderBy
        in: query
        required: false
        description: 'Field name on which ordering needs to be performed. The default order is ascending.


          The possible fields that can be ordered on are:

          * loginId

          * lastName

          * firstName

          * emailId

          * organizationNodeId


          Field Names are case-sensitive (should be written as it is in description).


          To specify descending order, a suffix " desc" should be added. For example, "firstName" for ascending or "firstName desc" for descending".

          '
        schema:
          type: string
          maxLength: 255
        examples:
          ascending:
            value: firstName
          descending:
            value: fistName desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                User-Page:
                  $ref: '#/components/examples/UserPage'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    post:
      tags:
      - User
      summary: Create User
      description: '**This API requires the Account Administrator role.**


        Creates a user.


        The following fields must be unique otherwise a `HTTP 409 Conflcit` will be returned:

        * `loginId`

        * `emailId`


        When creating a user with a `profileId`, the field values in the user request will override any that are

        also defined in the profile. For example, if the profile contains configuration for `features` and the user

        request also contains `features`, the `features` defined in the user request will override those from the profile.


        Changes to the fields:

        * `roles`

        * `features`


        Will trigger asynchronous updates, the status of which should be monitored via `/users:listStatuses`.'
      operationId: createUser
      parameters:
      - $ref: '#/components/parameters/accountId'
      requestBody:
        description: Create user with provided details including profileId and features
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            examples:
              Basic-User:
                $ref: '#/components/examples/BasicUserInput'
              Basic-User-with-roles-and-groups:
                $ref: '#/components/examples/BasicUserWithRolesAndGroupsInput'
              User-with-profile-features:
                $ref: '#/components/examples/UserWithFeaturesfromProfile'
              User-with-profile-and-features:
                $ref: '#/components/examples/UserWithProfileFeatures'
              User-with-all-fields:
                $ref: '#/components/examples/UserWithAllFields'
              User-with-profile-and-features-without-provider:
                $ref: '#/components/examples/UserWithProfileFeatureswithoutchannelProvider'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/UserResponse'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users/{userId}:
    put:
      tags:
      - User
      summary: Update User
      description: '**This API requires the Account Administrator role.**


        Updates a user.


        The following fields must be unique otherwise a `HTTP 409 Conflcit` will be returned:

        * `userId`

        * `emailId`


        This operation will clear the value stored for any fields not present in the request.

        For example, to remove a feature such as `voice` from a user you should omit the

        `voice` field in the request. The same behavior applies to every field in the request.


        When updating a user with a `profileId`, the field values in the user request will override any that are

        also defined in the profile. For example, if the profile contains configuration for `features` and the user

        request also contains `features`, the `features` defined in the user request will override those from the profile.


        Changes to the fields:

        * `roles`

        * `features`


        Will trigger asynchronous updates, the status of which should be monitored via `/users:listStatuses`.'
      operationId: updateUser
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      requestBody:
        description: User
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            examples:
              User-with-all-fields:
                $ref: '#/components/examples/UserUpdateWithAllFields'
              User-update-address-and-add-new-address:
                $ref: '#/components/examples/UserUpdateNewAddress'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/UserResponse'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    get:
      tags:
      - User
      summary: Get User
      description: '**This API requires the Account Administrator role.**


        Gets a user.'
      operationId: getUser
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/UserResponse'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    delete:
      tags:
      - User
      summary: Delete User
      description: '**This API requires the Account Administrator role.**


        Deletes a user.'
      operationId: deleteUser
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users:search:
    post:
      tags:
      - User
      summary: Search Users
      description: '**This API requires the Account Administrator role.**


        Searches the user list based on criteria provided.


        This data includes basic details of each user and available features including current status for features operation progress.'
      operationId: searchUsers
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/pageNumber'
      - name: pageSize
        in: query
        description: 'The max number of records to retrieve per page. Default value is 10.

          '
        required: false
        schema:
          type: integer
          format: int32
          example: 5
          default: 10
          minimum: 5
          maximum: 500
      requestBody:
        description: The possible fields you can filter and order are userId,loginId,lastName,firstName,emailId,organizationNodeId,profileId
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFilterCriteria'
            examples:
              FirstName-start-with-search:
                $ref: '#/components/examples/FirstNameStartWithInput'
              FirstName-start-with-AND-lastName-ends-with-search:
                $ref: '#/components/examples/FirstNameStartWithANDLastNameEndsWithInput'
              FirstName-contains-search:
                $ref: '#/components/examples/FirstNameContainsInput'
              EmailId-equals-search:
                $ref: '#/components/examples/EmailIdEqualsInput'
              LastName-not-equal-search:
                $ref: '#/components/examples/LastNameNotEqualsInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                User-Page:
                  $ref: '#/components/examples/UserSearchPage'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users:listStatuses:
    post:
      tags:
      - User
      summary: List User Statuses
      description: '**This API requires the Account Administrator role.**


        Lists the current statuses for the given users.'
      operationId: listUserStatuses
      parameters:
      - $ref: '#/components/parameters/accountId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdList'
            examples:
              Request-User-Statuses:
                $ref: '#/components/examples/UserStatusesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserStatusResponse'
              examples:
                User-Statuses:
                  $ref: '#/components/examples/UserStatuses'
                Failed-User-Statuses:
                  $ref: '#/components/examples/FailedUserStatuses'
                InProgress-User-Statuses:
                  $ref: '#/components/examples/InProgressUserStatuses'
                PendingUpdate-User-Statuses:
                  $ref: '#/components/examples/PendingUpdateUserStatuses'
                PendingDelete-User-Statuses:
                  $ref: '#/components/examples/PendingDeleteUserStatuses'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users/{userId}/resource-partitions:
    get:
      tags:
      - User
      summary: List Resource Partitions
      description: '**This API requires the Account Administrator role.**


        Lists all of the resource partitions for a user.'
      operationId: listResourcePartitionsByUserId
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/pageNumber'
      - name: pageSize
        in: query
        description: 'The max number of records to retrieve per page. Default value is 10.


          Any value like 10, 20, 30 .. is allowed.


          Values that exceed the maximum will result in a 400 Bad Request being returned.

          '
        required: false
        schema:
          type: integer
          format: int32
          example: 10
          default: 10
          minimum: 5
          maximum: 50
      - name: filter
        in: query
        required: false
        description: "Specifies details of a row filter.\n\nThe possible fields that can be filtered on are:\n  * name\n\nThe allowed format:\n  - Begins with the column name to be filtered, followed by a colon, (This will be used as a Contains operator.) then:\n    - Either an exact string to match, or\n    - A string expression including the * wildcard character.\n      - :{PREFIX}* will be used to find out word start with.\n      - :*{POSTFIX} will be used to find out word end with\n      - : will be used to match exact word\n  - Begin with column name to be filtered, followed by a = operator. (this will be used to match exact string)\n"
        schema:
          type: string
          maxLength: 255
        examples:
          exact:
            description: Example of filtering based on an exact string.
            value: name=Sales Resource Partition
          prefix:
            description: Example of filtering based on a prefix string.
            value: name:Sales*
          postfix:
            description: Example of filtering based on a postfix string.
            value: name:*Sales
      - name: orderBy
        in: query
        required: false
        description: "Field name on which ordering needs to be performed. The default order is ascending.\n\nThe possible fields that can be ordered on are:\n  * name\n\nField Names are case-sensitive (should be written as it is in description).\n\nTo specify descending order, a suffix \" desc\" should be added. For example, \"name\" for ascending or \"name desc\" for descending\".\n"
        schema:
          type: string
          maxLength: 255
        examples:
          ascending:
            value: name
          descending:
            value: name desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourcePartitionsPage'
              examples:
                ResourcePartitionsPage:
                  $ref: '#/components/examples/UserResourcePartitionsPage'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users/{userId}/resource-partitions/updateDefaultResource:
    post:
      tags:
      - User
      summary: Set Default Resource of Resource Partition for User
      description: '**This API requires the Account Administrator role.**


        Sets the default resource Id of resource partition for a user. Specify resourcePartitionId and defaultResoureId in the request body.'
      operationId: setDefaultResourceForUser
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ResourcePartitionDefaultResource'
            examples:
              User-Resource-Partition-Default-Resource:
                $ref: '#/components/examples/ResourcePartitionDefaultResource'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourcePartitionDefaultResource'
              examples:
                User-Resource-Partition-Default-Resource:
                  $ref: '#/components/examples/ResourcePartitionDefaultResource'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users/{userId}/addresses:
    post:
      tags:
      - User
      summary: Create Address
      description: '**This API requires the Account Administrator role.**


        Creates an address for a user.'
      operationId: createUserAddress
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      requestBody:
        description: User address payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
            examples:
              Address:
                $ref: '#/components/examples/AddressWrite'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                Address:
                  $ref: '#/components/examples/AddressRead'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users/{userId}/addresses/{addressId}:
    put:
      tags:
      - User
      summary: Update Address
      description: '**This API requires the Account Administrator role.**


        Updates an address of a user.


        This operation will clear the value stored for any fields not present in the request.'
      operationId: updateUserAddress
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/addressId'
      requestBody:
        description: User address payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
            examples:
              Address:
                $ref: '#/components/examples/AddressWrite'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                Address:
                  $ref: '#/components/examples/AddressRead'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /accounts/{accountId}/users/{userId}/addresses/{addressId}:updateDefault:
    post:
      tags:
      - User
      summary: Update Default Address
      description: '**This API requires the Account Administrator role.**


        Updates a user''s default address to the address ID provided.


        Address IDs for both `addresses` and `accountAddresses` are accepted. Note,

        only 1 type of address can be the default at any one time.'
      operationId: updateUserDefaultAddress
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/addressId'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                Address:
                  $ref: '#/components/examples/AddressDefault'
        '400':
          $ref: '#/components/responses/ErrorConstraintViolation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}:{port}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        port:
          enum:
          - '443'
          default: '443'
        basePath:
          default: /api/admin/user/v1
  /users:
    get:
      tags:
      - User
      summary: Get List of Users
      description: '**Required Role:** Admin Portal or Admin API Consumer


        Retrieves a list of users with optional filtering and related data.


        Query parameters control which related data is included in the response (groups, location, CRM config)

        and whether folder information should be returned.


        **Status Filtering:**

        - Use the `status` query parameter to filter by user status: `ENABLED` (default), `DISABLED`, or `ALL`


        **Deleted Users:**

        - Use the `deleted` query parameter to control visibility of soft-deleted users:

        `EXCLUDE` (default), `INCLUDE`, or `ONLY`

        - When `deleted=ONLY`, the `status` filter is ignored because deleted users are always disabled'
      operationId: getUsers
      parameters:
      - name: status
        in: query
        description: 'Filter users by status.

          - `ENABLED` (default): Only enabled users

          - `DISABLED`: Only disabled users

          - `ALL`: All users regardless of status

          '
        required: false
        schema:
          type: string
          enum:
          - ENABLED
          - DISABLED
          - ALL
          default: ENABLED
      - name: deleted
        in: query
        description: "Control visibility of soft-deleted users.\n- `EXCLUDE` (default): Hide deleted users\n- `INCLUDE`: Include deleted users alongside non-deleted users\n- `ONLY`: Return only deleted users (the `status` filter is ignored because\n  deleted users are always disabled)\n"
        required: false
        schema:
          type: string
          enum:
          - EXCLUDE
          - INCLUDE
          - ONLY
          default: EXCLUDE
      - name: folders
        in: query
        description: Include folder hierarchy and breadcrumbs in the response
        required: false
        schema:
          type: boolean
          default: false
      - name: folderId
        in: query
        description: 'Filter users by folderId (includes subfolders recursively).

          - Omit parameter: Returns users from all folders

          - Empty string (""): Returns users in root folder only (not in any subfolder)

          - 26-character folder ID: Returns users in the specified folder AND all subfolders

          '
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/FolderId'
          - type: string
            enum:
            - ''
            description: Empty string for root folder
      - name: inFolder
        in: query
        description: Filter users that are in or not in a folder.
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/sortBy'
      - name: profileId
        in: query
        description: Filter by profile ID
        required: false
        schema:
          $ref: '#/components/schemas/ProfileId'
      - name: hasProfile
        in: query
        description: Filter users that have or do not have a profile.
        required: false
        schema:
          type: boolean
      - name: licType
        in: query
        description: Filter by license type
        required: false
        schema:
          $ref: '#/components/schemas/LicenseType'
      - name: locationId
        in: query
        description: Filter by location ID
        required: false
        schema:
          $ref: '#/components/schemas/LocationId'
      - name: hasLocation
        in: query
        description: Filter users that have or do not have a location.
        required: false
        schema:
          type: boolean
      - name: groups
        in: query
        description: Include group memberships with full group details (groupId, name, type)
        required: false
        schema:
          type: boolean
          default: true
      - name: location
        in: query
        description: Include E911 location details for each user
        required: false
        schema:
          type: boolean
          default: true
      - name: crmConfigId
        in: query
        description: Include CRM configuration details for each user
        required: false
        schema:
          type: boolean
          default: true
      - name: updatedSince
        in: query
        description: 'Filter users updated on or after this UTC timestamp.

          Must be in ISO 8601 format (e.g., 2026-01-22T00:00:00Z).

          When used with updatedUntil, updatedUntil must be greater than updatedSince.

          Note: newly created users have lastUpdated set to their creation time.

          '
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedUntil
        in: query
        description: 'Filter users updated on or before this UTC timestamp.

          Must be in ISO 8601 format (e.g., 2026-01-22T23:59:59Z).

          When used with updatedSince, must be greater than updatedSince.

          '
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber_2'
      responses:
        '200':
          $ref: '#/components/responses/GetUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
    post:
      tags:
      - User
      summary: Create a user
      description: '**Required Role:** Admin Portal or Admin API Consumer


        Creates a user.


        The type of user is controlled by the license type, which is typically

        an agent of some kind, but other types can be supported via the ''nonAgent'' type.


        At a minimum, creating a user requires:

        - the user''s email address

        - the user''s first and last names

        - the user''s license type or a profile to apply to the user (the license type will be

        taken from the profile if specified)


        **License Types and Their Defaults:**

        - `nonAgent`: Limited permissions, minimal spaces (1 task, 1 email, 1 messaging)

        - `voiceOnlyAgent`: Voice-focused permissions, phone space (2 task, 1 phone)

        - `digitalOnlyAgent`: Digital channels, no phone (3 task, 2 email, 2 messaging)

        - `omniChannelAgent`: All channels except video (3 task, 2 email, 1 phone, 2 messaging)

        - `omniChannelAgentEnhanced`: All channels with enhanced features and session statistics

        - `hybridVoiceAgent`: Balanced voice and digital capabilities


        **Validation Rules:**

        - User''s email address must be unique within the account

        - License type must be valid for the account

        - Profile must exist (if profile ID is provided)

        - Folder must exist (if folder ID is provided)

        - Location must exist (if location ID is provided) - location IDs are system-generated'
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '409':
          $ref: '#/components/responses/UserConflict_2'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
    servers:
    - url: https://core.{customerId}.ec.avayacloud.com/api/config/v1
      description: Production
      variables:
        customerId:
          description: Your organization identifier
          default: your-org-id
  /users/{userIdOrEmail}:
    get:
      tags:
      - User
      summary: Get Single User Details
      description: '**Required Role:** Admin Portal or Admin API Consumer


        Retrieves detailed information about a specific user including their configuration,

        permissions, queue assignments, and related data.


        The path parameter can be either a userId (26-character internal ID starting with ''002'')

        or an email address.


        Query parameters control which related data is included in the response.'
      operationId: getUser
      parameters:
      - $ref: '#/components/parameters/userIdOrEmail'
      - name: queues
        in: query
        description: Include queue assignments with names
        required: false
        schema:
          type: boolean
          default: false
      - name: queueLogins
        in: query
        description: Include current queue login sessions
        required: false
        schema:
          type: boolean
          default: false
      - name: groups
        in: query
        description: Include group memberships
        required: false
        schema:
          type: boolean
          default: false
      - name: location
        in: query
        description: Include E911 location details
        required: false
        schema:
          type: boolean
          default: false
      - name: crmConfigId
        in: query
        description: Include CRM configuration
        required: false
        schema:
          type: boolean
          default: false
      - name: reportsTo
        in: query
        description: Include reports-to user details (supervisor/manager relationship)
        required: false
        schema:
          type: boolean
          default: false
      - name: externalUCProviderConnections
        in: query
        description: Include external UC provider connection details
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
              examples:
                success:
                  $ref: '#/components/examples/GetUserDetailSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
    patch:
      tags:
      - User
      summary: Update a user
      description: '**Required Role:** Admin Portal or Admin API Consumer


        Update one or more properties of a user. The user can be identified by their user ID

        or email address.


        **Agent Self-Edit Restrictions**

        When an agent edits their own profile (self-edit), the server enforces the following:


        *Read-only identity fields:*

        The following fields are always read-only for agents and cannot be modified via self-edit.

        Any attempt returns **403 Forbidden**:

        `firstName`, `lastName`, `namePrefix`, `nameSuffix`, `title`, `email`, `mobile`.

        These fields can only be changed by an administrator.


        *Auto Answer / WebHID Edit Restrictions:*

        * If `allowAgentEditAutoAnswer` is `false` on the user record and the request includes

        a change to `attributes.webRTC.autoAnswer.interaction`, the server returns **403 Forbidden**.

        * If `allowAgentEditWebHIDHeadsetControl` is `false` on the user record and the request

        includes a change to `attributes.webHID.status`, the server returns **403 Forbidden**.

        * Administrators editing other users are never restricted by these flags.

        * Agents can still modify unrestricted fields (language, timezone, app theme, queues, etc.)

        even when identity and Auto Answer / WebHID edits are restricted.


        **Agent Self-Edit Restrictions**

        When an agent edits their own profile (self-edit), the server enforces the following:


        *Read-only identity fields:*

        The following fields are always read-only for agents and cannot be modified via self-edit.

        Any attempt returns **403 Forbidden**:

        `firstName`, `lastName`, `namePrefix`, `nameSuffix`, `title`, `email`, `mobile`.

        These fields can only be changed by an administrator.


        *Auto Answer / WebHID Edit Restrictions:*

        * If `allowAgentEditAutoAnswer` is `false` on the user record and the request includes

        a change to `attributes.webRTC.autoAnswer.interaction`, the server returns **403 Forbidden**.

        * If `allowAgentEditWebHIDHeadsetControl` is `false` on the user record and the request

        includes a change to `attributes.webHID.status`, the server returns **403 Forbidden**.

        * Administrators editing other users are never restricted by these flags.

        * Agents can still modify unrestricted fields (language, timezone, app theme, queues, etc.)

        even when identity and Auto Answer / WebHID edits are restricted.


        ** Disabling a User **

        A user can be disabled by performing an update to set the `status` property to `disabled`.

        This can normally only be done if:

        * the user is not logged in

        * the user has no active interactions

        * the user has no pending interactions in their personal queue

        and a request to do so in any of those conditions will fail with a 422 error. This can be

        overridden by setting the `forceDisable` query parameter.'
      operationId: updateUser
      parameters:
      - $ref: '#/components/parameters/userIdOrEmail'
      - $ref: '#/components/parameters/forceDisable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '422':
          $ref: '#/components/responses/UserCanNotBeDisabled'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
    servers:
    - url: https://core.{customerId}.ec.avayacloud.com/api/config/v1
      description: Production
      variables:
        customerId:
          description: Your organization identifier
          default: your-org-id
