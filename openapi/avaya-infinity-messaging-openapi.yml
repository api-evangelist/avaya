          from: '+19234567890'
          to:
          - '+19876543210'
          destination: '+19876543210'
        body:
          text: Hi. I need some help on my insurance
        contextParameters:
          customer-interest: insurance
        providerMetaData:
          messageId: 611c9a6a4a250100d4bd2c54
