  schemas:
    Coordinates:
      type: object
      description: The coordinates of a location
      required:
      - lat
      - long
      properties:
        lat:
          type: number
          description: The latitude of a location
          format: double
          minimum: -90
          maximum: 90
          example: -18.516634
        long:
          type: number
          description: The longitude of a location
          format: double
          minimum: -180
          maximum: 180
          example: 73.928104
    Attachment:
      type: object
      description: Meta information about the media
      required:
      - attachmentId
      - name
      - size
      - contentType
      - url
      properties:
        attachmentId:
          type: string
          description: The unique 36 character internal id for the attachment
        name:
          type: string
          description: The name of the attachment
        size:
          type: integer
          format: int64
          description: The size of the attachment in bytes
        contentType:
          type: string
          description: The content type of the attachment
        contentId:
          type: string
          maxLength: 256
          description: The content id of the attachment
        url:
          type: string
          description: The URL link to retrieve the attachment
        captionText:
          type: string
          description: The text describing the caption of the attachment
        thumbnailUrl:
          type: string
          description: The URL link to retrieve the thumbnail of the attachment
        additionalProperties:
          type: object
          description: Additional properties of the attachment
          additionalProperties:
            type: string
    SubscriptionEventType:
      description: "The type of digital event to subscribe for. The event types available are:\n * `MESSAGES` - A message sent either by customer or a contact center resource (agent, supervisor, system or bot)\n * `CUSTOMER_MESSAGES` - A message sent by customer\n * `CC_MESSAGES` - A message sent by a contact center resource (agent, supervisor, system or bot)\n * `PARTICIPANT_ADDED` - A participant added to an engagement\n * `PARTICIPANT_DISCONNECTED` - A participant disconnected an engagement\n * `ENGAGEMENT_CREATED` - A new engagement was created\n * `ENGAGEMENT_ERROR` - An error occurred in an engagement\n * `TYPING` - An indication that a Contact Center participant is typing. This event is only supported for Custom Messaging\n * `ALL` - An event belonging to any of the above types occurred. When you subscribe to `ALL`, you are effectively subscribing to all current event types, as well as any that might be introduced in the future. Therefore, it's crucial to ensure that your callback handler doesn't fail or return an error when receiving any new event type that you are not prepared to handle\n"
      type: string
      enum:
      - MESSAGES
      - CUSTOMER_MESSAGES
      - CC_MESSAGES
      - PARTICIPANT_ADDED
      - PARTICIPANT_DISCONNECTED
      - ENGAGEMENT_CREATED
      - ENGAGEMENT_ERROR
      - TYPING
      - ALL
    Action:
      type: object
      description: An action button that the user can click to trigger an action
      required:
      - type
      properties:
        type:
          type: string
          description: The type of action. Supported types of action types are link, reply, postback, and locationRequest.
          minLength: 1
          maxLength: 50
          example: postback
        text:
          type: string
          description: The text on an action button
          maxLength: 50
          example: Book Appointment
        payload:
          type: string
          description: The payload of 'postback' or 'reply' action button
          maxLength: 512
          example: BOOK_APPOINTMENT
        uri:
          type: string
          description: The URI that will be used by the clients when 'link' action button is clicked
          format: uri
          example: https://example.com/items/info
        iconUrl:
          type: string
          description: The URL of the image of the icon on a 'reply' action button
          format: uri
          example: https://example.com/images/icon.png
    EventType:
      description: The type of digital event
      type: string
      enum:
      - MESSAGES
      - PARTICIPANT_ADDED
      - PARTICIPANT_DISCONNECTED
      - ENGAGEMENT_CREATED
      - ENGAGEMENT_ERROR
      - TYPING
    Location:
      type: object
      description: The information about a location
      properties:
        address:
          type: string
          description: The address of the location
          maxLength: 512
          example: Nth Floor, UVW Park, XYZ Street, Some Country, PIN CODE - 123456
        name:
          type: string
          description: The name of the location
          maxLength: 50
          example: ABC Enterprises
    BodyElement:
      type: object
      description: Element of the message body
      required:
      - elementType
      properties:
        elementType:
          type: string
          description: The type of the body element such as text, image, attachment, carousel, location, or form
        elementText:
          $ref: '#/components/schemas/ElementText'
        payload:
          type: string
          description: Data required to help render the message on end clients
        richMediaPayload:
          $ref: '#/components/schemas/RichMediaPayload'
    ParticipantEvent:
      description: Notification for participant added or removed from the dialog of the engagement
      allOf:
      - $ref: '#/components/schemas/EventData'
      - $ref: '#/components/schemas/ParticipantEventData'
    MessageStatus:
      description: The delivery status of the message
      type: string
      enum:
      - NONE
      - SENT
      - DELIVERED
      - READ
      - FAILED
      - DELETED
    TypingEventData:
      description: Typing event
      type: object
      required:
      - accountId
      - dialogId
      - engagementId
      - channelId
      - channelProviderId
      - senderParticipantId
      - senderParticipantType
      - senderParticipantDisplayName
      properties:
        dialogId:
          type: string
          description: The unique 36 character internal id that represents the dialog.
        engagementId:
          type: string
          description: The unique 36 character internal id that represents the engagement.
        accountId:
          type: string
          description: The unique 6 character internal id that represents the customer account
        providerDialogId:
          type: string
          description: The provider side identifier for a Contact Center dialog.
        channelProviderId:
          type: string
          description: The unique id that represents the channel provider
        senderParticipantId:
          type: string
          description: The unique id that represents the sender of the message
        senderParticipantType:
          $ref: '#/components/schemas/ParticipantType'
        senderParticipantDisplayName:
          type: string
          description: The optional display name of the user that sent the message. If not provided, display name from the session will be used.
        channelId:
          type: string
          description: The unique id representing the Contact Center Channel. Only valid Contact Center Channel Id's are accepted. See Contact Center Channel list in Developers guide for further details.
        businessAccountName:
          type: string
          description: The name of the business account configured on the channel provider
        sourceType:
          type: string
          description: The source of the engagement. For example the platform as a keyword (Facebook, Twitter, Instagram)
          example: Facebook
        sourceAddress:
          type: string
          description: The source address is intended to represent the address from which the CCaaS engagement was created. It might represent a mailbox, a Twitter account, a Facebook account, a chat integration will be the same as the (To) address
          example: https://www.facebook.com/Ixcc-112670754648669
        externalRecipientParticipants:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRecipientParticipant'
          description: List of external recipient participants
    Problem:
      type: object
      description: '<b>Problem Detail</b> as a way to carry machine-readable details of errors in a HTTP response to avoid the need to define new error response formats for HTTP APIs <a href="https://tools.ietf.org/html/rfc7807">RFC 7807</a>

        '
      properties:
        type:
          type: string
          format: uri
          description: 'An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type (e.g., using HTML).

            '
          default: about:blank
          example: https://developers.avayacloud.com/onecloud-ccaas/docs/error-handling#constraint-violation
        title:
          type:
          - string
          - 'null'
          description: 'A short, summary of the problem type. Written in english and readable for engineers (usually not suited for non technical stakeholders and not localized).

            '
          example: Service Unavailable
        status:
          type:
          - integer
          - 'null'
          format: int32
          description: 'The HTTP status code generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          example: 503
          exclusiveMaximum: 600
        detail:
          type:
          - string
          - 'null'
          description: 'A human readable explanation specific to this occurrence of the problem.

            '
          example: Connection to database timed out
        instance:
          type:
          - string
          - 'null'
          format: uri
          description: 'An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.

            '
        violations:
          type:
          - array
          - 'null'
          description: 'A list of violations that occurred as a result of invalid data provided as part of a request.

            '
          items:
            type: object
            properties:
              field:
                type: string
                description: 'The name of the field in the request that caused the violation. This can be the name of a path parameter, query parameter, or a field within the request body.

                  '
                example: accountId
              message:
                type: string
                description: 'A human readable explanation specific to this occurrence of the violation.

                  '
                example: must match "^[a-zA-Z]{6}$"
              code:
                type: integer
                format: int32
                description: 'The violation code generated by the server for this occurrence of the violation. Use this code when implementing any error handling logic instead of the message, as the message can change.

                  '
                example: 20006
          example:
          - field: emailAddress
            message: must not be null
            code: 20002
          - field: accountId
            message: must match "^[a-zA-Z]{6}$"
            code: 20006
    Subscriptions:
      description: A list of Subscriptions.
      type: array
      items:
        $ref: '#/components/schemas/Subscription'
    RichMediaPayload:
      type: object
      description: Rich media payload data
      properties:
        selectedAction:
          $ref: '#/components/schemas/Action'
        actions:
          type: array
          description: An array of actions associated with the message
          readOnly: true
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/Action'
        items:
          type: array
          description: An array of items associated with the message
          readOnly: true
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Item'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        location:
          $ref: '#/components/schemas/Location'
    Message:
      type: object
      description: A conversation message
      required:
      - accountId
      - channelProviderId
      - channelId
      - senderParticipantId
      - senderParticipantName
      - senderParticipantType
      - body
      - status
      properties:
        messageId:
          type: string
          description: The unique 36 character internal id for this specific message.
        accountId:
          type: string
          description: The unique 6 character internal id that represents the customer account
        dialogId:
          type: string
          description: The unique 36 character internal id that represents the dialog.
        engagementId:
          type: string
          description: The unique 36 character internal id that represents the engagement.
        status:
          $ref: '#/components/schemas/MessageStatus'
        sessionId:
          type: string
          description: The unique 36 character internal id that represents the users session.
        businessAccountName:
          type: string
          description: The name of the business account configured on the channel provider
        channelProviderId:
          type: string
          description: The unique id that represents the channel provider
        channelId:
          type: string
          description: The unique id representing the Contact Center Channel. Only valid Contact Center Channel Id's are accepted. See Contact Center Channel list in Developers guide for further details.
        senderParticipantId:
          type: string
          description: The unique id that represents the sender of the message
        senderParticipantName:
          type: string
          description: The optional display name of the user that sent the message. If not provided, display name from the session will be used.
        senderParticipantType:
          $ref: '#/components/schemas/ParticipantType'
        body:
          $ref: '#/components/schemas/BodyElement'
        fallbackText:
          type: string
          description: Fallback message text that clients can show if they are not capable of rendering the body
        headers:
          $ref: '#/components/schemas/MessageHeaders'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        recipientParticipants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
          description: List of recipient participants
        customData:
          type: object
          description: Any data complementing the actual message body that is valuable for recipient clients. For example any additional reference links, key words, hash tag references, additional content information etc.
          additionalProperties:
            type: string
        messageIndex:
          type: integer
          description: The index of the message within the context of the dialog
        parentMessageId:
          type: string
          description: The unique 36 character internal id for the message that is the parent of this message
        providerDialogId:
          type: string
          description: The provider side identifier for a Contact Center dialog.
        providerSenderId:
          type: string
          description: The provider side identifier for the user who sent the message.
        providerMessageId:
          type: string
          description: The provider side identifier for the message.
        providerParentMessageId:
          type: string
          description: The provider side identifier for the message that is the parent of this message
        engagementParameters:
          type: object
          description: Context information of the engagement. This information might be used to make business decisions on how the engagement is treated. For example, the client application might want to send hints about customer's interest based no customer's searches or FAQ browsing
          additionalProperties:
            type: string
        receivedAt:
          type: string
          format: date-time
          description: The datetime when the message was received by the Contact Center (in ISO 8601 format including timezone, 'yyyy-MM-dd'T'HH:mm:ss[.SSS]Z')
        lastUpdatedAt:
          type: string
          format: date-time
          description: The datetime when the message was last updated (in ISO 8601 format including timezone, 'yyyy-MM-dd'T'HH:mm:ss[.SSS]Z')
    EventData:
      type: object
      description: Common event data
      required:
      - eventType
      - correlationId
      - eventDate
      discriminator:
        propertyName: eventType
        mapping:
          ENGAGEMENT_CREATED: '#/components/schemas/EngagementCreatedEvent'
          PARTICIPANT_ADDED: '#/components/schemas/ParticipantEvent'
          PARTICIPANT_DISCONNECTED: '#/components/schemas/ParticipantEvent'
          ENGAGEMENT_ERROR: '#/components/schemas/EngagementErrorEvent'
          MESSAGES: '#/components/schemas/MessageEvent'
          TYPING: '#/components/schemas/TypingEvent'
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
        correlationId:
          type: string
          description: The correlation id is used to uniquely identify the client request. This is an optional field but when specified can be used to correlate the callback event with the original API request.
        eventDate:
          type: string
          format: date-time
          description: The datetime when the event was generated (in ISO 8601 format including timezone, 'yyyy-MM-dd'T'HH:mm:ss[.SSS]Z')
    ExternalRecipientParticipant:
      type: object
      description: External recipient participant
      required:
      - participantId
      properties:
        participantId:
          type: string
          description: The unique id that represents the participant.
        providerParticipantId:
          type: string
          description: The provider side identifier for the participant
    Subscription:
      type: object
      description: Digital webhook subscription
      required:
      - channelProviderId
      - callbackUrl
      - eventTypes
      properties:
        subscriptionId:
          type: string
          readOnly: true
          description: The unique 36 character id (uuid) that represents the subscription.
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}$
          example: 2581e39b-fe84-4e38-87f4-63a1d037f39a
        channelProviderId:
          type: string
          description: The unique id that represents the channel provider
          minLength: 3
          maxLength: 256
          example: ChatProvider01
        callbackUrl:
          type: string
          maxLength: 2048
          description: The public (https) url to send the callback payload.
          example: https://www.example.com/send/callback/here
        eventTypes:
          type: array
          description: 'The list of event types subscribed for:'
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/SubscriptionEventType'
    MessageHeaders:
      type: object
      description: Header of the message
      properties:
        sourceAddress:
          type: string
          description: The source address is intended to represent the address from which the CCaaS engagement was created. It might represent a mailbox, a Twitter account, a Facebook account, a chat integration will be the same as the (To) address
          example: https://www.facebook.com/Ixcc-112670754648669
        sourceType:
          type: string
          description: The source of the engagement. For example the platform as a keyword (Facebook, Twitter, Instagram)
          example: Facebook
        priority:
          type: string
          description: The priority of the message set by the provider
        sensitivity:
          type: string
          description: The sensitivity of the message set by the provider
        encoding:
          type: string
          description: The encoding used for the body of the message
        subject:
          type: string
          description: The subject of the message set by the provider
        from:
          type: string
          description: The sender of the message set by the provider
        to:
          type: array
          description: The To (recipients) of the message set by the provider
          items:
            type: string
        cc:
          type: array
          description: The Cc (recipients) of the message set by the provider. This field is mainly used for email messages
          items:
            type: string
        bcc:
          type: array
          description: The Bcc (recipients) of the message set by the provider. This field is mainly used for email messages
          items:
            type: string
        replyTo:
          type: string
          description: The address to use when replying.
        clientDeviceTag:
          type: string
          description: The tag used to identify the client device that was used to send the message.
        messageSourceServerTag:
          type: string
          description: The tag used by a service to identify that this message was sent by itself.
        providerTimestamp:
          type: string
          format: date-time
          description: The date time when the message was captured by the provider (in ISO 8601 format including timezone, 'yyyy-MM-dd'T'HH:mm:ss[.SSS]Z')
        additionalHeaders:
          type: object
          description: The additional header fields of the message. For example if the payload is of a specific version that the clients rendering the payload need to be aware of that information can be sent here
          additionalProperties:
            type: string
    CustomerIdentifiers:
      type: object
      description: Unique identifiers for identifying the customer during an Engagement such as phoneNumbers or emailAddresses.
      minProperties: 1
      maxProperties: 10
      additionalProperties:
        type: array
        description: 'Identifiers related to the Customer. The maximum length of an identifier key is 50 characters and must be a valid "name" of a pre-configured identifier in Customer Journey.

          '
        maxItems: 5
        items:
          type: string
          minLength: 1
          maxLength: 256
    Participant:
      type: object
      description: This event indicates that system will no longer exchange messages for this connection
      required:
      - participantId
      - participantType
      - connectionId
      - channelProviderId
      properties:
        participantId:
          type: string
          description: The unique id that represents the participant.
        participantType:
          $ref: '#/components/schemas/ParticipantType'
        displayName:
          type: string
          description: Display name of the participant
        connectionId:
          type: string
          description: The unique 36 character internal id (uuid) that represents the Connection.
        providerParticipantId:
          type: string
          description: The provider side identifier for the participant
        channelProviderId:
          type: string
          description: The unique id that represents the channel provider
    ParticipantType:
      description: The type of participant
      type: string
      enum:
      - CUSTOMER
      - AGENT
      - SUPERVISOR
      - SYSTEM
      - BOT
    TextFormat:
      description: The text format of the message in the body
      example: PLAINTEXT
      type: string
      enum:
      - PLAINTEXT
      - HTML
      - MARKDOWN
    EngagementErrorEvent:
      description: Event when an engagement fails
      allOf:
      - $ref: '#/components/schemas/EventData'
      - type: object
        additionalProperties: true
        required:
        - type
        - title
        - channelProviderId
        - correlationId
        properties:
          type:
            type: string
            description: The type of error.
            example: ENGAGEMENT_CREATION_FAILED
          title:
            type: string
            description: The title (summary) of the error.
            example: Error occurred while creating an engagement
          detail:
            type: string
            description: The detailed description of the error.
            example: Unable to create an engagement
          engagementId:
            type: string
            description: The unique 36 character internal id that represents the engagement.
            example: d3c8400d-c44f-4451-8316-435ch8c6e3f2
          dialogId:
            type: string
            description: The unique 36 character internal id (uuid) that represents the Dialog.
            example: d3c8400d-d34f-4451-8316-4333334fac34
          sessionId:
            type: string
            description: The unique 36 character id (uuid) that represents the users session.
            example: e348400d-d344-4451-8316-435ch8c6e3f2
          providerDialogId:
            type: string
            description: Identifier for the conversation maintained by provider
            example: e248400d-d344-4451-8316-435ch8c6e3f1
          channelProviderId:
            type: string
            description: The unique id that represents the channel provider
            example: ChatProvider01
          channelId:
            type: string
            description: The unique id representing the Contact Center Channel. Only valid Contact Center Channel Id's are accepted. See Contact Center Channel list in Developers guide for further details.
            example: Chat
          accountId:
            type: string
            description: The unique 6 character internal id that represents the customer account
            example: ABCDEF
    EngagementCreatedEvent:
      description: Engagement created event
      allOf:
      - $ref: '#/components/schemas/EventData'
      - $ref: '#/components/schemas/EngagementCreated'
    Item:
      type: object
      description: An item of a carousel or a list
      required:
      - title
      - actions
      properties:
        title:
          type: string
          description: The title of the item in carousel or list
          minLength: 1
          maxLength: 50
          example: Tacos
        mediaUrl:
          type: string
          description: The URL of the image to be shown inside the item in carousel or list
          format: uri
          example: https://example.com/images/image.png
        description:
          type: string
          description: Description of the item in carousel or list
          maxLength: 256
          example: Car with hybrid features
        actions:
          type: array
          description: An array of actions associated with the item in carousel or list
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/Action'
    ParticipantEventData:
      description: Notification for participant added or removed from the dialog of the engagement
      type: object
      required:
      - accountId
      - channelProviderId
      - engagementId
      - dialogId
      - connectionId
      properties:
        engagementId:
          type: string
          description: The unique 36 character internal id (uuid) that represents the engagement.
        dialogId:
          type: string
          description: The unique 36 character internal id (uuid) that represents the dialog.
        accountId:
          type: string
          description: The unique 6 character internal id that represents the customer account
        channelId:
          type: string
          description: The unique id representing the Contact Center Channel. Only valid Contact Center Channel Id's are accepted. See Contact Center Channel list in Developers guide for further details.
        channelProviderId:
          type: string
          description: The unique id that represents the channel provider
        sessionId:
          type: string
          description: The unique 36 character internal id (uuid) that represents the users session.
        connectionId:
          type: string
          description: The unique 36 character internal id (uuid) that represents the connection.
        participantId:
          type: string
          description: The unique 36 character internal id (uuid) that represents the participant.
        displayName:
          type: string
          description: The display name of the participant
        participantType:
          $ref: '#/components/schemas/ParticipantType'
        providerDialogId:
          type: string
