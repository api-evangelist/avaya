openapi: 3.2.0
info:
  title: Avaya Subscriptions API
  version: '1.0'
  description: 'Operations tagged Subscriptions across 2 of this provider''s published API definitions: avaya-axp-digital-notification-openapi-original.json, avaya-infinity-notifications-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{protocol}://{server}{basePath}'
  description: Open API
  variables:
    protocol:
      enum:
      - https
      default: https
    server:
      default: HOST-REGION.api.avayacloud.com
    basePath:
      default: /api/digital/webhook/v1
- url: '{protocol}://{server}:{port}'
  description: Internal API
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    server:
      default: msg-webhook
    port:
      enum:
      - '80'
      - '443'
      default: '80'
- url: https://core.{customerId}.ec.avayacloud.com/api/events/v1
  description: Production
  variables:
    customerId:
      description: Your organization subdomain identifier (e.g., avaya1234)
      default: avaya1234
tags:
- name: Subscriptions
  description: Manage subscriptions for digital events.
paths:
  /accounts/{accountId}/subscriptions:
    post:
      tags:
      - Subscriptions
      summary: Create Subscription
      description: Creates a webhook subscription for digital events. A subscription supports filtering of events by specifying an event type.
      operationId: createDigitalWebhookSubscription
      parameters:
      - $ref: '#/components/parameters/accountId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
            examples:
              default:
                $ref: '#/components/examples/CreateSubscriptionRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                default:
                  $ref: '#/components/examples/Subscription'
        '400':
          $ref: '#/components/responses/BadRequestCallbackUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      callbacks:
        event:
          '{$request.body#/callbackUrl}':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      oneOf:
                      - $ref: '#/components/schemas/EngagementCreatedEvent'
                      - $ref: '#/components/schemas/ParticipantEvent'
                      - $ref: '#/components/schemas/MessageEvent'
                      - $ref: '#/components/schemas/TypingEvent'
                      - $ref: '#/components/schemas/EngagementErrorEvent'
                      discriminator:
                        propertyName: eventType
                    examples:
                      Engagement-Created-Event:
                        $ref: '#/components/examples/EngagementCreatedEvent'
                      Participant-Added-Event:
                        $ref: '#/components/examples/ParticipantAddedEvent'
                      Participant-Disconnected-Event:
                        $ref: '#/components/examples/ParticipantDisconnectEvent'
                      Message-Event-Chat-Plain-Text-Simple:
                        $ref: '#/components/examples/MessageEventChatPlainTextSimple'
                      Message-Event-Custom-Chat:
                        $ref: '#/components/examples/MessageEventCustomChat'
                      Message-Event-Email:
                        $ref: '#/components/examples/MessageEventEmail'
                      Message-Event-Messaging-Agent-To-Customer-File:
                        $ref: '#/components/examples/MessageEventMessagingAgentToCustomerFile'
                      Message-Event-Messaging-Agent-To-Customer-Image:
                        $ref: '#/components/examples/MessageEventMessagingAgentToCustomerImage'
                      Message-Event-Messaging-Agent-To-Customer-Postback-Link-LocationRequest:
                        $ref: '#/components/examples/MessageEventMessagingAgentToCustomerPostbackLinkLocationRequest'
                      Message-Event-Messaging-Agent-To-Customer-Reply:
                        $ref: '#/components/examples/MessageEventMessagingAgentToCustomerReply'
                      Message-Event-Messaging-Agent-To-Customer-Carousel:
                        $ref: '#/components/examples/MessageEventMessagingAgentToCustomerCarousel'
                      Message-Event-Messaging-Agent-To-Customer-Location:
                        $ref: '#/components/examples/MessageEventMessagingAgentToCustomerLocation'
                      Message-Event-Messaging-Customer-To-Agent-Location:
                        $ref: '#/components/examples/MessageEventMessagingCustomerToAgentLocation'
                      Message-Event-Messaging-Customer-To-Agent-Reply:
                        $ref: '#/components/examples/MessageEventMessagingCustomerToAgentReply'
                      Message-Event-Messaging-Customer-To-Agent-Postback:
                        $ref: '#/components/examples/MessageEventMessagingCustomerToAgentPostback'
                      Message-Event-Messaging-Customer-To-Agent-File:
                        $ref: '#/components/examples/MessageEventMessagingCustomerToAgentFile'
                      Message-Event-Messaging-Customer-To-Agent-Image:
                        $ref: '#/components/examples/MessageEventMessagingCustomerToAgentImage'
                      Engagement-Error-Event:
                        $ref: '#/components/examples/EngagementErrorEvent'
                      Typing-Event:
                        $ref: '#/components/examples/TypingEvent'
                description: Callback request
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
      deprecated: false
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    get:
      tags:
      - Subscriptions
      summary: List Subscriptions
      description: Lists the existing webhook subscriptions.
      operationId: listDigitalWebhookSubscriptions
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/channelProviderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriptions'
              examples:
                default:
                  $ref: '#/components/examples/ListSubscriptions'
        '400':
          $ref: '#/components/responses/BadRequestAccountId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    parameters:
    - $ref: '#/components/parameters/accountId_2'
    servers:
    - url: '{protocol}://{server}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        basePath:
          default: /api/digital/webhook/v1
    - url: '{protocol}://{server}:{port}'
      description: Internal API
      variables:
        protocol:
          enum:
          - http
          - https
          default: http
        server:
          default: msg-webhook
        port:
          enum:
          - '80'
          - '443'
          default: '80'
  /accounts/{accountId}/subscriptions/{subscriptionId}:
    get:
      tags:
      - Subscriptions
      summary: Get Subscription
      description: Gets a Subscription by subscriptionId.
      operationId: getDigitalWebhookSubscription
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                default:
                  $ref: '#/components/examples/Subscription'
        '400':
          $ref: '#/components/responses/BadRequestAccountId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    delete:
      tags:
      - Subscriptions
      summary: Delete Subscription
      description: Delete a Subscription by subscriptionId.
      operationId: deleteDigitalWebhookSubscription
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequestAccountId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    put:
      tags:
      - Subscriptions
      summary: Update Subscription
      description: Replaces an existing webhook subscription. The client application can modify the callbackUrl and/or the event types for which it receives notifications within the context of this subscription.
      operationId: updateDigitalWebhookSubscription
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
            examples:
              default:
                $ref: '#/components/examples/UpdateSubscriptionRequest'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                default:
                  $ref: '#/components/examples/UpdateSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestCallbackUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    parameters:
    - $ref: '#/components/parameters/accountId_2'
    - $ref: '#/components/parameters/subscriptionId_2'
    patch:
      tags:
      - Subscriptions
      summary: Update Subscription (Deprecated)
      description: '**DEPRECATED**: This endpoint will be removed in a future version. Use `PATCH /subscriptions/{subscriptionId}` instead.'
      operationId: updateSubscriptionLegacy
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSubscription'
      responses:
        '200':
          description: Subscription updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription_2'
              examples:
                Agent & Interaction Webhook Subscription Response:
                  $ref: '#/components/examples/AgentAndInteractionWebhookSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '500':
          $ref: '#/components/responses/InternalServer'
      security:
      - {}
      - BearerAuth: []
        AppKey: []
    servers:
    - url: '{protocol}://{server}{basePath}'
      description: Open API
      variables:
        protocol:
          enum:
          - https
          default: https
        server:
          default: HOST-REGION.api.avayacloud.com
        basePath:
          default: /api/digital/webhook/v1
    - url: '{protocol}://{server}:{port}'
      description: Internal API
      variables:
        protocol:
          enum:
          - http
          - https
          default: http
        server:
          default: msg-webhook
        port:
          enum:
          - '80'
          - '443'
          default: '80'
  /subscriptions:
    post:
      tags:
      - Subscriptions
      summary: Create Subscription
      description: 'Creates a new webhook subscription for one or more event families. Specify the event `family`, the individual `events` to filter on (or `ALL`), and the `transport` configuration including your webhook endpoint and optional auth token.


        ## Finding Your Customer Subdomain


        Your subdomain is found in your Avaya Infinity portal URL and is required for all API calls.


        **Example:** If your portal URL is:


        ```

        https://core.avaya1234.ec.avayacloud.com/app/core-config-ui/

        ```


        Your subdomain is: **`avaya1234`**


        **To use this API:**


        1. **Find your subdomain** from your Infinity portal URL (as shown above)

        2. **Get your Bearer token** using the `EVENT_NOTIFICATION` client credential (see Authentication below)

        3. **In the API explorer on the right:**

        * Click on `{customerId}` in the URL field and replace it with your actual subdomain

        * Paste your Bearer token in the Credentials section

        * Fill out the request body with your event families, events, and webhook transport details


        ## Authentication


        This endpoint requires a valid OAuth 2.0 Bearer token. To get started, contact Avaya Support to request a `client_id` and `client_secret` provisioned with the `EVENT_NOTIFICATION` scope.


        Once you have your credentials, generate an access token and include it in the `Authorization: Bearer ` header of each request.


        ```

        POST https://core.avaya1234.ec.avayacloud.com/auth/realms/avaya/protocol/openid-connect/token

        Content-Type: application/x-www-form-urlencoded


        grant_type=client_credentials&client_id=&client_secret=&scope=EVENT_NOTIFICATION

        ```


        ## Working with Subscriptions


        A newly created subscription will have `status: ACTIVE` and begin delivering events to your webhook immediately.


        The `expiresIn` field in the response shows the seconds remaining before the subscription expires. Call the Renew Subscription endpoint before this value reaches zero to keep the subscription active.


        ## Important Notes


        * The `family` field accepts up to 3 values: `AGENT`, `INTERACTION`, `QUEUE`, or `ALL` (must be the only value if used).

        * The `events` field accepts up to 25 event types. Use `ALL` to receive every event for the selected family.

        * The `authToken` and `authTokenHeader` fields are optional but recommended for webhook verification.

        * Your account/tenant is automatically derived from your Bearer token — no separate account identifier is required.


        ## DOS Protection & Rate Limiting


        * This endpoint implements DOS protection and rate limiting.


        ## Security Implementation Guidelines


        * Never expose your `client_secret` or Bearer token to client-side applications.

        * Use `authToken` and `authTokenHeader` to verify incoming webhook payloads are from Avaya.

        * Implement proper error handling — avoid surfacing internal error details to end users.'
      operationId: createSubscription
      parameters:
      - in: header
        name: Authorization
        description: OAuth 2.0 Bearer token. Required.
        schema:
          type: string
        required: true
      requestBody:
        description: Create a new Subscription
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscription'
            examples:
              Create Agent & Interaction Webhook Subscription:
                $ref: '#/components/examples/CreateAgentAndInteractionWebhookSubscription'
      responses:
        '201':
          description: Subscription created successfully. Returns the full subscription object including the system-generated `subscriptionId` and `expiresIn` value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription_2'
              examples:
                Agent & Interaction Webhook Subscription Response:
                  $ref: '#/components/examples/AgentAndInteractionWebhookSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '500':
          $ref: '#/components/responses/InternalServer'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
    get:
      tags:
      - Subscriptions
      summary: List Subscriptions
      description: 'Returns a paginated list of existing notification subscriptions for your account.


        ## Finding Your Customer Subdomain


        Your subdomain is found in your Avaya Infinity portal URL and is required for all API calls.


        **Example:** If your portal URL is:


        ```

        https://core.avaya1234.ec.avayacloud.com/app/core-config-ui/

        ```


        Your subdomain is: **`avaya1234`**


        **To use this API:**


        1. **Find your subdomain** from your Infinity portal URL (as shown above)

        2. **Get your Bearer token** using the `EVENT_NOTIFICATION` client credential (see Authentication below)

        3. **In the API explorer on the right:**

        * Click on `{customerId}` in the URL field and replace it with your actual subdomain

        * Paste your Bearer token in the Credentials section

        * Use `pageNumber` and `pageSize` to paginate results as needed


        ## Authentication


        This endpoint requires a valid OAuth 2.0 Bearer token. To get started, contact Avaya Support to request a `client_id` and `client_secret` provisioned with the `EVENT_NOTIFICATION` scope.


        Once you have your credentials, generate an access token and include it in the `Authorization: Bearer ` header of each request.


        ```

        POST https://core.avaya1234.ec.avayacloud.com/auth/realms/avaya/protocol/openid-connect/token

        Content-Type: application/x-www-form-urlencoded


        grant_type=client_credentials&client_id=&client_secret=&scope=EVENT_NOTIFICATION

        ```


        ## Important Notes


        * Results are scoped to your account — derived automatically from your Bearer token.

        * Default page size is 10, maximum is 25.

        * Use the `links.next` and `links.prev` URLs in the response to navigate between pages.


        ## DOS Protection & Rate Limiting


        * This endpoint implements DOS protection and rate limiting.


        ## Security Implementation Guidelines


        * Never expose your `client_secret` or Bearer token to client-side applications.

        * Implement proper error handling — avoid surfacing internal error details to end users.'
      operationId: listSubscriptions
      parameters:
      - in: header
        name: Authorization
        description: OAuth 2.0 Bearer token. Required.
        schema:
          type: string
        required: true
      - name: pageNumber
        in: query
        description: The page number of the records to retrieve. Default value is 1.
        required: false
        schema:
          type: integer
          format: int32
          example: 1
          default: 1
          minimum: 1
      - name: pageSize
        in: query
        description: The max number of records to retrieve per page. Default value is 10, max value is 25.
        required: false
        schema:
          type: integer
          format: int32
          example: 10
          default: 10
          minimum: 1
          maximum: 25
      responses:
        '200':
          description: Paginated list of subscriptions returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
              examples:
                default:
                  $ref: '#/components/examples/SubscriptionPage'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '500':
          $ref: '#/components/responses/InternalServer'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
    servers:
    - url: https://core.{customerId}.ec.avayacloud.com/api/events/v1
      description: Production
      variables:
        customerId:
          description: Your organization subdomain identifier (e.g., avaya1234)
          default: avaya1234
  /subscriptions/{subscriptionId}:
    parameters:
    - $ref: '#/components/parameters/subscriptionId_2'
    get:
      tags:
      - Subscriptions
      summary: Get Subscription
      description: 'Returns a single notification subscription by its `subscriptionId`.


        ## Finding Your Customer Subdomain


        Your subdomain is found in your Avaya Infinity portal URL and is required for all API calls.


        **Example:** If your portal URL is:


        ```

        https://core.avaya1234.ec.avayacloud.com/app/core-config-ui/

        ```


        Your subdomain is: **`avaya1234`**


        **To use this API:**


        1. **Find your subdomain** from your Infinity portal URL (as shown above)

        2. **Get your Bearer token** using the `EVENT_NOTIFICATION` client credential (see Authentication below)

        3. **In the API explorer on the right:**

        * Click on `{customerId}` in the URL field and replace it with your actual subdomain

        * Paste your Bearer token in the Credentials section

        * Enter the `subscriptionId` of the subscription you want to retrieve


        ## Authentication


        This endpoint requires a valid OAuth 2.0 Bearer token. To get started, contact Avaya Support to request a `client_id` and `client_secret` provisioned with the `EVENT_NOTIFICATION` scope.


        Once you have your credentials, generate an access token and include it in the `Authorization: Bearer ` header of each request.


        ```

        POST https://core.avaya1234.ec.avayacloud.com/auth/realms/avaya/protocol/openid-connect/token

        Content-Type: application/x-www-form-urlencoded


        grant_type=client_credentials&client_id=&client_secret=&scope=EVENT_NOTIFICATION

        ```


        ## Working with Subscription IDs


        Subscription IDs are system-generated UUIDs in the format `xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`, returned in the response body when a subscription is created. Use the `subscriptionId` from `POST /subscriptions` or `GET /subscriptions` to reference a specific subscription.


        ## Important Notes


        * Returns a `404` if no subscription exists with the specified ID.


        ## DOS Protection & Rate Limiting


        * This endpoint implements DOS protection and rate limiting.


        ## Security Implementation Guidelines


        * Never expose your `client_secret` or Bearer token to client-side applications.

        * Implement proper error handling — avoid surfacing internal error details to end users.'
      operationId: getSubscription
      parameters:
      - in: header
        name: Authorization
        description: OAuth 2.0 Bearer token. Required.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Subscription details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '500':
          $ref: '#/components/responses/InternalServer'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
    delete:
      tags:
      - Subscriptions
      summary: Delete Subscription
      description: 'Permanently deletes an existing subscription by its `subscriptionId`. Once deleted, the subscription cannot be recovered and will stop delivering events immediately.


        ## Finding Your Customer Subdomain


        Your subdomain is found in your Avaya Infinity portal URL and is required for all API calls.


        **Example:** If your portal URL is:


        ```

        https://core.avaya1234.ec.avayacloud.com/app/core-config-ui/

        ```


        Your subdomain is: **`avaya1234`**


        **To use this API:**


        1. **Find your subdomain** from your Infinity portal URL (as shown above)

        2. **Get your Bearer token** using the `EVENT_NOTIFICATION` client credential (see Authentication below)

        3. **In the API explorer on the right:**

        * Click on `{customerId}` in the URL field and replace it with your actual subdomain

        * Paste your Bearer token in the Credentials section

        * Enter the `subscriptionId` of the subscription to delete


        ## Authentication


        This endpoint requires a valid OAuth 2.0 Bearer token. To get started, contact Avaya Support to request a `client_id` and `client_secret` provisioned with the `EVENT_NOTIFICATION` scope.


        Once you have your credentials, generate an access token and include it in the `Authorization: Bearer ` header of each request.


        ```

        POST https://core.avaya1234.ec.avayacloud.com/auth/realms/avaya/protocol/openid-connect/token

        Content-Type: application/x-www-form-urlencoded


        grant_type=client_credentials&client_id=&client_secret=&scope=EVENT_NOTIFICATION

        ```


        ## Important Notes


        * **This action cannot be undone.** Confirm the correct `subscriptionId` before proceeding.

        * Returns `204 No Content` on success — no response body is returned.

        * Returns a `404` if no subscription exists with the specified ID.


        ## DOS Protection & Rate Limiting


        * This endpoint implements DOS protection and rate limiting.


        ## Security Implementation Guidelines


        * Never expose your `client_secret` or Bearer token to client-side applications.

        * Implement proper error handling — avoid surfacing internal error details to end users.'
      operationId: deleteSubscription
      parameters:
      - in: header
        name: Authorization
        description: OAuth 2.0 Bearer token. Required.
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Subscription deleted successfully. No content returned.
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '500':
          $ref: '#/components/responses/InternalServer'
      deprecated: false
      security:
      - {}
      - BearerAuth: []
    patch:
      tags:
      - Subscriptions
      summary: Update Subscription
      description: 'Partially updates a subscription''s event families, events, or transport configuration. Only fields included in the request body will be modified.


        ## Finding Your Customer Subdomain


        Your subdomain is found in your Avaya Infinity portal URL and is required for all API calls.


        **Example:** If your portal URL is:


        ```

        https://core.avaya1234.ec.avayacloud.com/app/core-config-ui/

        ```


        Your subdomain is: **`avaya1234`**


        **To use this API:**


        1. **Find your subdomain** from your Infinity portal URL (as shown above)

        2. **Get your Bearer token** using the `EVENT_NOTIFICATION` client credential (see Authentication below)

        3. **In the API explorer on the right:**

        * Click on `{customerId}` in the URL field and replace it with your actual subdomain

        * Paste your Bearer token in the Credentials section

        * Enter the `subscriptionId` and provide only the fields you want to change


        ## Authentication


        This endpoint requires a valid OAuth 2.0 Bearer token. To get started, contact Avaya Support to request a `client_id` and `client_secret` provisioned with the `EVENT_NOTIFICATION` scope.


        Once you have your credentials, generate an access token and include it in the `Authorization: Bearer ` header of each request.


        ```

        POST https://core.avaya1234.ec.avayacloud.com/auth/realms/avaya/protocol/openid-connect/token

        Content-Type: application/x-www-form-urlencoded


        grant_type=client_credentials&client_id=&client_secret=&scope=EVENT_NOTIFICATION

        ```


        ## Important Notes


        * All fields are optional — only fields explicitly provided will be modified.

        * Returns a `404` if no subscription exists with the specified ID.


        ## DOS Protection & Rate Limiting


        * This endpoint implements DOS protection and rate limiting.


        ## Security Implementation Guidelines


