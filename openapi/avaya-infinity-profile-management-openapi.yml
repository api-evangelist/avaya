openapi: 3.1.1
info:
  title: Profile Management
  description: 'APIs for managing user profiles.


    Operations related to profile management: Create, Get, Update, Delete, List profiles.


    Each profile supports at most 500 assigned users. See the Users API for assignment limits;

    profile updates are blocked when more than 500 users are assigned.

    '
  version: 0.0.1
  contact:
    name: Avaya API Team
    url: https://developers.avayacloud.com/avaya-infinity/
  license:
    name: Avaya Software Development Kit (SDK) Software License Terms
    url: https://support.avaya.com/css/P8/documents/101038288
servers:
- url: https://core.{customerId}.ec.avayacloud.com/api/config/v1
  description: Production
  variables:
    customerId:
      description: Your organization identifier
      default: your-org-id
security:
- BearerAuth: []
tags:
- name: Profile Management
  description: 'Operations related to profile management: Create, Get, Update, Delete, List profiles.

    '
paths:
  /profiles:
    post:
      tags:
      - Profile Management
      summary: Create Profile
      description: '**This API requires Account Administrator role.**


        Creates a new profile with license-type-specific default configurations. The system automatically applies

        appropriate defaults for permissions, attributes, spaces, and queues based on the specified license type:


        **License Types and Their Defaults:**

        - `nonAgent`: Limited permissions, minimal spaces (1 task, 1 email, 1 messaging)

        - `voiceOnlyAgent`: Voice-focused permissions, phone space (2 task, 1 phone)

        - `digitalOnlyAgent`: Digital channels, no phone (3 task, 2 email, 2 messaging)

        - `omniChannelAgent`: All channels except video (3 task, 2 email, 1 phone, 2 messaging)

        - `omniChannelAgentEnhanced`: All channels with enhanced features and session statistics

        - `hybridVoiceAgent`: Balanced voice and digital capabilities


        **Default Values Applied (if not provided):**

        - `appTheme`: ''light''

        - `consoleTheme`: ''light''

        - `timeZone`: the account''s configured default timezone

        - `interactionViewsType`: ''all''

        - `modifyInteractionViews`: true

        - `allowInternalCalls`: false

        - License-specific permissions, attributes, spaces, and queue configurations


        Other optional fields (e.g. `deferEnabled`, `previewOutbound`, `predictiveOutbound`, `persistentMedia`,

        `rejectInteractions`, `ucPhoneSpaces`) are left unset unless provided; see each field''s description

        for its specific fallback behavior.


        **Validation Rules:**

        - Profile name must be unique within the account

        - License type must be valid for the account

        - Profile folder must exist (if folder ID is provided)

        - Location must exist (if location ID is provided) - location IDs are system-generated

        '
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
            examples:
              nonAgentProfile:
                summary: Non-Agent Profile
                description: Create a profile for non-agent users with minimal permissions
                value:
                  name: Observer Profile
                  description: Profile for users who need read-only access
                  licType: nonAgent
              voiceOnlyProfile:
                summary: Voice-Only Agent Profile
                description: Create a profile for voice-only agents
                value:
                  name: Voice Support Profile
                  description: Profile for phone-based support agents
                  licType: voiceOnlyAgent
                  profileFolderId: 073d010813b941cf7da111d147
              omniChannelEnhancedProfile:
                summary: Omni-Channel Enhanced Profile
                description: Create a profile with enhanced features and session statistics
                value:
                  name: Senior Agent Profile
                  description: Profile for experienced agents with all features
                  licType: omniChannelAgentEnhanced
                  locationId: 022d01091776cc88fe6866b7ce
                  appTheme: dark
                  timeZone: America/Los_Angeles
                  commTypeChangeDefaultValue: callback
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                hybridVoiceAgentProfile:
                  summary: Hybrid Voice Agent Profile Created
                  description: Response showing a complete profile with license-specific defaults applied
                  value:
                    id: 16a7490f-86a6-4a14-8ce2-11682230adb6
                    accountId: 001d01022054849399088a81ad
                    name: Senior Agent Profile
                    description: Profile for experienced agents with all features
                    licType: omniChannelAgentEnhanced
                    locationId: 022d01091776cc88fe6866b7ce
                    permissions:
                      app:
                        agent:
                          read: true
                        portal:
                          app-web: true
                        homeList:
                          read: true
                        queueList:
                          read: true
                      console:
                        cx:
                          read: false
                        ml:
                          read: false
                        portal:
                          console-web: false
                        queues:
                          read: false
                        account:
                          read: false
                        numbers:
                          read: false
                        integrations:
                          read: false
                    queues:
                      access: []
                      performance: []
                      autoLogin: []
                      proficiency: []
                      logins: []
                      defaultOutboundQueue: null
                      outboundQueueId: null
                    spaces:
                      task: []
                      email: []
                      phone: []
                      video: []
                      messaging: []
                    tags: []
                    attributes:
                      time:
                        tz: America/Los_Angeles
                      queue:
                        multiAID: false
                        autoPauseCount: 0
                        commTypeChange: false
                        multiAIDMethod: ''
                        outboundPermissions:
                          task: false
                          email: false
                          phone: true
                          video: false
                          messaging: false
                        commTypeChangeTimeout: 0
                        defaultLeaveEventToStatus:
                          inbound:
                            action: ''
                            status: ''
                          callback:
                            action: ''
                            status: ''
                          outbound:
                            action: ''
                            status: ''
                        commTypeChangeDefaultValue: ''
                      taskSpaces: 0
                      emailSpaces: 0
                      phoneSpaces: 1
                      videoSpaces: 0
                      messagingSpaces: 0
                      sessionStats:
                        enabled: true
                        frequencyScalar: 5
                        frequencyUnit: minutes
                        stats:
                          cpuFree: true
                          cpuUsage: true
                          cpuCount: true
                          cpuLoadOneMinute: true
                          cpuLoadFiveMinutes: true
                          cpuLoadFifteenMinutes: true
