                    id: 1ac75384-6099-424c-a179-9038a7a44a54
                    name: Customer Support Profile
                    description: Profile for customer support representatives
                    accountId: 001d01022054849399088a81ad
                    licType: hybridVoiceAgent
                    locationId: null
                    permissions: []
                    queues:
                      access: []
                      performance: []
                      autoLogin: []
                      proficiency: []
                      logins: []
                      defaultOutboundQueue: null
                      outboundQueueId: null
                    spaces:
                      task: []
                      email: []
                      phone: []
                      video: []
                      messaging: []
                    tags: []
                    attributes:
                      time:
                        tz: America/New_York
                      taskSpaces: 3
                      emailSpaces: 3
                      phoneSpaces: 1
                      videoSpaces: 0
                      messagingSpaces: 3
                      sessionStats:
                        enabled: true
                        frequencyScalar: 5
                        frequencyUnit: minutes
                        stats:
                          cpuFree: true
                          cpuUsage: true
                          cpuCount: true
                          cpuLoadOneMinute: true
                          cpuLoadFiveMinutes: true
                          cpuLoadFifteenMinutes: true
                          memoryInfo: true
                          freeMemoryPercentage: true
