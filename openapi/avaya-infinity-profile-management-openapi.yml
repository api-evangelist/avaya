    get:
      tags:
      - Profile Management
      summary: List Profiles
      description: '**This API requires Account Administrator role.**


        Retrieves a paginated list of profiles with optional filtering and sorting capabilities.


        **Query Parameters:**

        - `pageNumber`: Page number (default: 1)

        - `pageSize`: Number of profiles per page (5-100, default: 10)

        - `orderBy`: Sort field and direction (e.g., "name", "updatedAt desc")

        - `filter`: Filter profiles by field (e.g., "name:Support*", "licType=agent", "description:customer")

        - `folderId`: Filter by folder ID (omit for all folders, empty string for root folder, 26-char ID for specific folder)

        - `includeSubfolders`: Include profiles from subfolders recursively (default: false, only effective with specific
        folder ID)

        - `updatedSince`: Filter by profiles updated since this UTC date/time (ISO 8601 format)

        - `updatedUntil`: Filter by profiles updated until this UTC date/time (ISO 8601 format)


        **Folder Filtering Behavior:**

        - **No `folderId` parameter**: Returns profiles from ALL folders in the account

        - **`folderId=""` (empty string)**: Returns only root folder profiles (profiles not in any folder)

        - **`folderId="073d01090149abae69f6305afe"`**: Returns profiles in that specific folder only

        - **`folderId="073d01090149abae69f6305afe"` + `includeSubfolders=true`**: Returns profiles from that folder AND all
        its subfolders recursively


        **Common Use Cases:**

        1. **Get all profiles**: `/profiles` (no folder parameters)

        2. **Get root folder profiles**: `/profiles?folderId=`

        3. **Get specific folder profiles**: `/profiles?folderId=073d01090149abae69f6305afe`

        4. **Get folder + all subfolders**: `/profiles?folderId=073d01090149abae69f6305afe&includeSubfolders=true`


        **Supported Order Fields:** name, description, licType, syncStatus, numUsers, createdBy, updatedBy, createdAt, updatedAt


        **Supported Filter Fields:** name, description, licType, syncStatus, createdBy, updatedBy, createdAt, updatedAt


        **Filter Formats:**

        - `field=value` - Exact match

        - `field:value*` - Prefix match (starts with)

        - `field:*value` - Suffix match (ends with)

        - `field:value` - Word match (contains)

        '
      operationId: listProfiles
      parameters:
      - $ref: '#/components/parameters/pageNumber'
      - name: pageSize
        in: query
        description: Number of profiles per page
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          minimum: 5
          maximum: 100
      - name: orderBy
        in: query
        description: Field to sort by with optional desc suffix
        required: false
        schema:
          type: string
          pattern: ^(name|description|licType|syncStatus|numUsers|createdBy|updatedBy|createdAt|updatedAt)( desc)?$
          default: updatedAt desc
        examples:
          default:
            value: updatedAt desc
            summary: Most recently updated first
          nameAsc:
            value: name
            summary: Alphabetical by name
          descriptionAsc:
            value: description
            summary: Alphabetical by description
          licTypeAsc:
            value: licType
            summary: Sort by license type
          syncStatusAsc:
            value: syncStatus
            summary: Sort by job sync status
          numUsersDesc:
            value: numUsers desc
            summary: Most users first
          createdByDesc:
            value: createdBy desc
            summary: Sort by creator (descending)
          createdDesc:
            value: createdAt desc
            summary: Most recently created first
      - name: filter
        in: query
        required: false
        description: "Specifies details of a row filter on one profile field.\n\nThe possible fields that can be filtered\
          \ on are:\n* name\n* description\n* licType\n* syncStatus\n* createdBy\n* updatedBy\n* createdAt\n* updatedAt\n\n\
          The allowed format:\n- Begin with the column name to be filtered, followed by a `=` operator (used to match an exact\
          \ string).\n- Or, begin with the column name to be filtered, followed by a colon, then:\n  - Either an exact string\
          \ to match, or\n  - A string expression including the `*` wildcard character\n      - `:{PREFIX}*` will be used\
          \ to find values that start with the prefix.\n      - `:*{POSTFIX}` will be used to find values that end with the\
          \ postfix.\n      - `:{WORD}` will be used to find values that contain the word.\n\nField names are case-sensitive.\n"
        schema:
          type: string
          maxLength: 255
        examples:
          exactLicType:
            value: licType=hybridVoiceAgent
            summary: Exact license type match
          nameExact:
            value: name=Support Agent
            summary: Exact match on name
          namePrefix:
            value: name:Support*
            summary: Names starting with 'Support'
          namePostfix:
            value: name:*Agent
            summary: Names ending with 'Agent'
          nameContains:
            value: name:Customer
            summary: Names containing 'Customer'
          descriptionContains:
            value: description:customer
            summary: Description containing 'customer'
          createdByFilter:
            value: createdBy=002d010826307dd6630992437b
            summary: Filter by who created the profile
      - name: folderId
        in: query
        description: 'Filter profiles by folder location. This parameter controls which folder''s profiles are returned:


          - **If not provided (omitted)**: Returns profiles from ALL folders across the entire account (no folder filtering
          applied)

          - **Empty string ("")**: Returns profiles in the root folder only (profiles not assigned to any folder)

          - **26-character folder ID**: Returns profiles in the specified folder only (by default, does NOT include subfolders)


          **Subfolder Behavior:**

          - By default, subfolders are NOT searched - only profiles directly in the specified folder are returned

          - To include subfolders recursively, use the `includeSubfolders=true` parameter

          - When `includeSubfolders=true`, all profiles in the specified folder AND all its descendant folders are returned


          **Important Notes:**

          - Root folder profiles omit the `profileFolderId` property from the response

          - To search multiple specific folders (non-recursively), make separate API calls

          '
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/FolderId'
          - type: string
            enum:
            - ''
            description: Empty string for root folder
        examples:
          allFolders:
            summary: All profiles from all folders (default behavior)
            description: When parameter is omitted entirely, profiles from all folders across the account are returned
          specificFolderOnly:
            value: 073d01090149abae69f6305afe
            summary: Profiles in specific folder only (excludes subfolders)
            description: Returns only profiles directly assigned to this folder, subfolders are excluded
          rootFolderOnly:
            value: ''
            summary: Root folder profiles only
            description: Returns only profiles not assigned to any folder
      - name: includeSubfolders
        in: query
        description: 'Controls whether to include profiles from subfolders when filtering by a specific folder.


          **Behavior:**

          - **false** (default): Returns only profiles directly in the specified folder

          - **true**: Returns profiles in the specified folder AND all its subfolders recursively


          **When this parameter takes effect:**

          - Only when `folderId` is provided and is a valid 26-character folder ID

          - Ignored when `folderId` is not provided (all folders) or is empty string (root folder)

          - When `folderId` points to root folder (""), subfolders cannot be included


          **Performance considerations:**

          - Recursive subfolder searches may take longer for deep folder hierarchies

          - Maximum recursion depth is limited to prevent performance issues

          '
        required: false
        schema:
          type: boolean
          default: false
        examples:
          directFolderOnly:
            value: false
            summary: Direct folder only (default behavior)
            description: Include only profiles directly in the specified folder, exclude subfolders
          includeAllSubfolders:
            value: true
            summary: Include all subfolders recursively
            description: Include profiles from the specified folder and all its descendant folders
      - name: updatedSince
        in: query
        description: 'Filter profiles by their last update date. Returns only profiles that were updated on or after this
          date/time.


          **Format:** ISO 8601 date/time with timezone offset (e.g., `2024-01-01T00:00:00Z` or `2024-01-01T00:00:00-05:00`)


          **Behavior:**

          - Compares against the profile''s `updatedAt` field (automatically maintained by the database)

          - Can be used alone or combined with `updatedUntil` for date range filtering

          - When used with `updatedUntil`, must be less than `updatedUntil`


          **Use Cases:**

          - Get profiles modified after a specific date: `?updatedSince=2024-01-01T00:00:00Z`

          - Get profiles from last 24 hours: `?updatedSince=2024-12-31T00:00:00Z`

          - Combine with until for range: `?updatedSince=2024-01-01T00:00:00Z&updatedUntil=2024-12-31T23:59:59Z`

          '
        required: false
        schema:
          type: string
          format: date-time
        examples:
          sinceStartOfYear:
            value: '2024-01-01T00:00:00Z'
            summary: Profiles updated since start of 2024
          sinceLastWeek:
            value: '2024-12-24T00:00:00Z'
            summary: Profiles updated in the last week
          sinceWithTimezone:
            value: '2024-01-01T00:00:00-05:00'
            summary: Using Eastern Time timezone
      - name: updatedUntil
        in: query
        description: 'Filter profiles by their last update date. Returns only profiles that were updated on or before this
          date/time.


          **Format:** ISO 8601 date/time with timezone offset (e.g., `2024-12-31T23:59:59Z` or `2024-12-31T23:59:59-05:00`)


          **Behavior:**

          - Compares against the profile''s `updatedAt` field (automatically maintained by the database)

          - Can be used alone or combined with `updatedSince` for date range filtering

          - When used with `updatedSince`, must be greater than `updatedSince`


          **Use Cases:**

          - Get profiles modified before a specific date: `?updatedUntil=2024-12-31T23:59:59Z`

          - Get profiles from a specific date range: `?updatedSince=2024-01-01T00:00:00Z&updatedUntil=2024-12-31T23:59:59Z`

          - Exclude recent changes: `?updatedUntil=2024-11-30T23:59:59Z`

          '
        required: false
        schema:
          type: string
          format: date-time
        examples:
          untilEndOfYear:
            value: '2024-12-31T23:59:59Z'
            summary: Profiles updated before end of 2024
          untilLastMonth:
            value: '2024-11-30T23:59:59Z'
            summary: Profiles updated before December
          dateRange:
            value: '2024-06-30T23:59:59Z'
            summary: Combined with updatedSince for first half of year
      - name: crmConfigId
        in: query
        description: Boolean toggle. When `true` (default), the response embeds the full CRM configuration object under `crmConfigurations`.
          When `false`, only the raw CRM configuration ID string is returned. This is a toggle, not a CRM config identifier.
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Profiles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilesList'
              examples:
                withProfiles:
                  summary: Response with profiles
                  description: Successful response containing profile list
                  value:
                    pagination:
                      pageNumber: 1
                      pageSize: 10
                      total: 2
                    links:
                      prev: ''
                      next: ''
                    profiles:
                    - id: 6d45f30d-dd0e-4546-b932-b6b1f223c9f3
                      name: Admin Profile
                      description: Profile for customer admin representatives
                      licType: hybridVoiceAgent
                      profileFolderId: 073d01090149abae69f6305afe
                      createdBy: 002d010826307dd6630992437b
                      updatedAt: '2025-09-09T10:03:45.883Z'
                    - id: d5cfccf4-0507-49f8-98d9-34fdaeefca5d
                      name: Customer Support Profile
                      description: Profile for customer support representatives
                      licType: hybridVoiceAgent
                      createdBy: 002d010826307dd6630992437b
                      updatedAt: '2025-09-09T10:02:53.596Z'
                emptyList:
                  summary: No profiles available
                  description: Response when no profiles exist
                  value:
                    pagination:
                      pageNumber: 1
                      pageSize: 10
                      total: 0
                    links:
                      prev: ''
                      next: ''
                    profiles: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /profiles/{profileId}:
    get:
      tags:
      - Profile Management
      summary: Get Profile
      description: '**This API requires Account Administrator role.**


        Retrieves detailed information about a specific profile including account information.

        '
      operationId: getProfile
      parameters:
      - $ref: '#/components/parameters/profileId'
      - name: crmConfigId
        in: query
        description: Boolean toggle. When `true` (default), the response embeds the full CRM configuration object under `crmConfigurations`.
          When `false`, only the raw CRM configuration ID string is returned. This is a toggle, not a CRM config identifier.
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                profileWithDetails:
                  summary: Profile with Full Details
                  description: Complete profile information including all configuration
