    delete:
      tags:
      - Profile Management
      summary: Delete Profile
      description: '**This API requires Account Administrator role.**


        Permanently deletes a profile. This operation cannot be undone.

        '
      operationId: deleteProfile
      parameters:
      - $ref: '#/components/parameters/profileId'
      responses:
        '204':
          description: Profile deleted successfully - No content returned
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict — the profile cannot be deleted because it has users assigned to it.

            Reassign or remove those users before deleting the profile.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://developers.avayacloud.com/avaya-infinity/docs/errors#conflict
                title: Conflict
                status: 409
                detail: Cannot delete profile that is assigned to users
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Profile Management
      summary: Update Profile
      description: "**This API requires Account Administrator role.**\n\nUpdates an existing profile with new configuration\
        \ data. Only provided fields will be updated.\n\nWhen profile settings are changed, a background sync job (PRFUPD)\
        \ is automatically queued to propagate\nthe updated settings to all users assigned to this profile. The sync preserves\
        \ any user-specific overrides;\nonly non-overridden fields are updated to match the new profile values.\n\n**Validation\
        \ Rules:**\n- Profile name must be unique within the account (if being changed)\n- License type must be valid for\
        \ the account\n- Profile folder must exist (if folder ID is provided)\n- Location must exist (if location ID is provided)\
        \ - location IDs are system-generated\n\n**User limit:**\n- A profile may have at most **500** assigned users (see\
        \ Users API for assignment rules).\n- Profile updates are rejected when `numUsers` **exceeds** 500 (updates remain\
        \ allowed at exactly 500).\n- Returns **422** with detail `Profile User limit of 500 reached. Cannot update profile`\n\
        \  (`violations[].code`: **20005**).\n"
      operationId: updateProfile
      parameters:
      - $ref: '#/components/parameters/profileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              updateProfileName:
                summary: Update Profile Name and Description
                description: Update basic profile information
                value:
                  name: Updated Observer Profile
                  description: Updated profile for users who need read-only access
              updateLicenseType:
                summary: Change License Type
                description: Update profile license type which will apply new defaults
                value:
                  licType: voiceOnlyAgent
                  name: Voice Agent Profile
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                updatedProfile:
                  $ref: '#/components/examples/UpdatedProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict. Two cases:

            - **Duplicate name**: a profile with the same name already exists in this account.

            - **Active sync job**: a PRFUPD or FSYNC job is currently running for this profile.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                duplicateName:
                  summary: Duplicate profile name
                  value:
                    type: https://developers.avayacloud.com/avaya-infinity/docs/errors#conflict
                    title: Conflict
                    status: 409
                    detail: Profile name already exists in this account
                activeSyncJob:
                  summary: Active sync job in progress
                  value:
                    type: https://developers.avayacloud.com/avaya-infinity/docs/errors#conflict
                    title: Conflict
                    status: 409
                    detail: 'Profile cannot be updated while a sync job is in progress (jobId: abc-123). Please wait for it
                      to complete.'
        '422':
          description: 'Unprocessable Entity. Cases include:

            - **Constraint violation**: request body fails field validation

            - **Profile user limit**: profile has more than 500 assigned users and cannot be updated

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                constraintViolation:
                  summary: Field validation error
                  value:
                    type: https://developers.avayacloud.com/avaya-infinity/docs/errors#constraint-violation
                    title: Constraint Violation
                    status: 422
                    detail: Request contains invalid or missing fields
                profileUpdateUserLimit:
                  $ref: '#/components/examples/ErrorProfileUpdateUserLimitReached'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
  /profiles/{profileId}/users:
    get:
      tags:
      - Profile Management
      summary: Get Profile Users with Override Status
      description: '**This API requires Account Administrator role.**


        Retrieves a paginated list of users assigned to a specific profile, including their override statuses for profile
        fields.


        This endpoint provides detailed information about which profile fields (permissions, queues, spaces, attributes, groups,
        themes, etc.) each user has overridden from the profile defaults.


        **Override Fields Tracked:**

        - permissions (nested structure)

        - queues (access, performance, autoLogin, proficiency, logins, defaultOutboundQueue, outboundQueueId)

        - spaces (task, email, phone, video, messaging)

        - tags

        - attributes

        - groups

        - appTheme

        - consoleTheme

        - timeZone

        - interactionViewsType

        - definedInteractionViews

        - modifyInteractionViews

        - commTypeChangeDefaultValue

        - defaultOutboundCallerId

        - locationId

        - dialPlanProfileId

        - deferEnabled

        - enableWebHID

        - enableErrorTones

        - allowInternalCalls

        - allowAgentEditAutoAnswer

        - allowAgentEditWebHIDHeadsetControl

        - rejectInteractions

        - previewOutbound

        - predictiveOutbound

        - persistentMedia


        **Filtering:**

        - To filter on profile users that do or do not have overridden fields, use the `hasOverrides` query parameter


        **Pagination:**

        - If `pageNumber` and `pageSize` are provided, results are paginated (filtering is applied before pagination)

        '
      operationId: listProfileUsers
      parameters:
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/pageSize'
      - name: hasOverrides
        in: query
        required: false
        description: 'Filter users by override status. When `true`, only users who have at least one overridden field are
          returned.

          When `false`, only users with no overrides are returned. When omitted, all users are returned regardless of override
          status.

          '
        schema:
          type: boolean
        example: true
      - name: search
        in: query
        required: false
        description: 'Case-insensitive search string. Filters users whose first name, last name,

          or email address contains the given text.

          '
        schema:
          type: string
          maxLength: 100
        example: john
      responses:
        '200':
          description: Profile users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUsersList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/InternalServerError'
components:
