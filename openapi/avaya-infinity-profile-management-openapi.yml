            type: https://developers.avayacloud.com/avaya-infinity/docs/errors#not-found
            title: Not Found
            status: 404
            detail: workflowId 'wf_123abc' does not exist
            requestId: req_xyz789
            timestamp: '2025-12-08T10:30:05Z'
  parameters:
    profileId:
      name: profileId
      in: path
      description: The unique identifier of a profile.
      required: true
      schema:
        $ref: '#/components/schemas/ProfileId'
    pageNumber:
      name: pageNumber
      in: query
      description: The page number of the records to retrieve.
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    pageSize:
      name: pageSize
      in: query
      description: The max number of records to retrieve per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 50
  schemas:
    ProfileName:
      type: string
      description: Name of a profile (must be unique within the account)
      maxLength: 100
      minLength: 1
      example: Customer Support Profile
    ProfileDescriptionValue:
      type: string
      description: Optional description of the profile
      maxLength: 500
      example: Profile for customer support representatives
    ProfileDescription:
      type:
      - string
      - 'null'
      description: Optional description of the profile
      maxLength: 500
      example: Profile for customer support representatives
    ProfileSyncStatus:
      type: string
      enum:
      - SYNCED
      - SYNC_QUEUED
      - SYNC_IN_PROGRESS
      - SYNC_FAILED
      description: "State of the profile with regards to synchronizing changes with users.\nSync jobs are created when a profile\
        \ is updated (PRFUPD — preserves user overrides)\nor when a force sync is triggered (FSYNC — resets all overrides).\n\
        * SYNCED means all users have been updated with the latest changes to the profile\n* SYNC_QUEUED means a change to\
        \ properties on the profile has been received,\n  but the process of updating users has yet to start\n* SYNC_IN_PROGRESS\
        \ means the users are currently being updated for changes to\n  the profile\n* SYNC_FAILED means the sync job ended\
        \ in failure or was aborted before all\n  users could be updated\n"
    ProfileNumUsers:
      type: integer
      minimum: 0
      readOnly: true
      description: 'Number of users currently assigned to the profile.

        A profile supports at most 500 assigned users; assigning a 501st user is rejected by the Users API.

        Profile updates are blocked when this value exceeds 500.

        '
    ProfileNumUsersWithOverrides:
      type: integer
      minimum: 0
      description: Number of users currently set to the profile that have an override for at least one field.
    DefaultOutboundCallerIdField:
