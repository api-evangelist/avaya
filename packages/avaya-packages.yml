note: >-
  REVISION 2026-09-17 — the 2026-09-14 pass saw only the npm scope and concluded Avaya ships
  JavaScript clients "only". That was wrong in two ways, both corrected here.
  (1) NuGet AvayaCPaaS IS first-party: api.nuget.org gives authors "Avaya Cloud Inc." and
  projectUrl https://cloud.zang.io/, and github.com/avaya/cpaas-dotnet's own README tells you to
  install it from nuget.org. It is now official: true.
  (2) The github.com/avaya organization publishes SIX first-party CPaaS clients — Python, Go, .NET,
  PHP, Java and Node — of which only the Node one (@avaya/cpaas) and the .NET one (AvayaCPaaS) ever
  reached a registry. The other four are source-only, MIT-licensed, and carry NO git tags and NO
  registry entry, so a consumer cannot pin a version at all.
  (3) A whole third distribution channel was missed: Avaya's on-premises estate ships ~60 SDKs as
  authenticated-looking but actually UNAUTHENTICATED zip downloads from
  https://www.avaya.com/en/developer-support/sdks/ via support.avaya.com/css/public/documents/<id>.
  These are the real SDKs for Avaya Aura, IP Office, Contact Center, Breeze and the Client SDK. They
  have no registry, so version is read from Avaya's own published release string and published is
  recorded from Avaya's dated "what's new" list on that page where it states one.
  PyPI still has nothing (avaya, avaya-sdk, avaya-cpaas, zang all 404), Packagist has nothing
  (zang/zang-php 404), Maven Central has no first-party Avaya artifact, and pkg.go.dev resolves
  github.com/avaya/cpaas-go only as an untagged pseudo-version.
