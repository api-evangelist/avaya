vendor_download_sdks:
  note: >-
    Avaya's on-premises SDK estate, published at https://www.avaya.com/en/developer-support/sdks/.
    No registry exists for any of these, so there is no metadata endpoint to query — the version below
    is the release string Avaya itself prints next to the download, and published is taken from the
    dated change list at the bottom of that same page where it names the item. Every link resolves to
    support.avaya.com/css/public/documents/<id> and serves application/zip with NO login, NO SSO and
    NO DevConnect membership — verified by direct fetch on 2026-09-17. This channel is where Avaya's
    SOAP contracts live (see wsdl/avaya-wsdl.yml, 56 WSDLs / 307 operations) and its one Protobuf
    schema (see grpc/avaya-protobuf.yml).
  sdks:
    - family: Avaya Client SDK
      platforms: [Android, iOS, JavaScript, macOS, Windows]
      version: 4.38.1.0
      published: '2026-07-01'
      published_precision: month
      url: https://www.avaya.com/en/developer-support/sdks/
      note: >-
        The most actively maintained SDK family Avaya ships — the page's change log records
        "July 2026 – Avaya Client SDK Release 4.38.1 SDKs and Release Notes added". Release notes at
        https://support.avaya.com/css/public/documents/101095983.
    - family: Avaya WebRTC Connect SDK
      platforms: [Android, iOS, JavaScript]
      version: 4.0.9
      published: '2026-06-17'
      url: https://support.avaya.com/css/public/documents/101095493
    - family: Avaya Aura Application Enablement Services (AES)
      components: [DMCC Java SDK, DMCC XML SDK, DMCC .NET SDK, System Management Service (SMS) SDK, JTAPI SDK and Client, TSAPI Client, CVLAN Client]
      version: '10.2'
      published: '2023-12-01'
      published_precision: month
      url: https://support.avaya.com/css/public/documents/101090582
      note: >-
        The SMS and Telephony Services SDK archives each contain a single Windows .exe installer
        rather than loose WSDL files, so their contracts could not be extracted — recorded honestly in
        wsdl/avaya-wsdl.yml under not_found. The Web Service Telephony Services SDK is still on
        release 8.1.3 (October 2020), three major releases behind the rest of AES.
    - family: Avaya Aura System Manager Web Services
      components: [User Management Web Services Sample Client SDK, Routing Web Services SDK, Element Manager Web Service SDK]
      version: '10.2'
      published: '2023-12-01'
      published_precision: month
      url: https://support.avaya.com/css/public/documents/101090622
    - family: Avaya Aura Contact Center Open Interfaces
      components: [CCMS Open Networking Web Services SDK, CCMS Open Queue Web Services SDK, CCMM Agent Web Services SDK, CCMM Outbound Web Services SDK, CCMA Open Interfaces SDK, Communication Control Toolkit Open Interfaces SOAP SDK, Communication Control Toolkit Open Interfaces REST SDK, CCT .Net SDK, Enterprise Web Chat SDK, Real-time Data SDK]
      version: 7.0 / 7.1.x
      published: null
      url: https://support.avaya.com/css/public/documents/101090645
      note: >-
        The SOAP contracts harvested into wsdl/ came from these archives. The WSDL files inside are
        dated 2009-2010 (Open Interfaces) and 2015 (CCMM) and still carry nortel.com namespaces —
        Avaya acquired Nortel Enterprise Solutions in December 2009. published is null because Avaya
        prints no date for this family on the SDK page.
    - family: Avaya IP Office Platform
      components: [MTCTI-3 Web Services API SDK, CTI Web Services, Service Monitoring Web Services SDK, WebRTC SDK, Location API SDK, SSL VPN Onboarding SDK]
      version: '12.3'
      published: '2026-04-17'
      url: https://support.avaya.com/css/public/documents/101095743
      note: >-
        MTCTI-3 SDK version 1.2 ships bundle/ipo_mtcti3.proto, file-dated 2025-10-06 — saved to
        grpc/. The Service Monitoring SDK's SSIReference.xsd is dated 2026-04-17, the freshest
        machine-readable artifact in the whole on-premises estate.
    - family: Avaya Breeze
      version: '3.9'
      published: '2024-08-16'
      url: https://support.avaya.com/css/public/documents/101091182
    - family: Avaya Session Border Controller
      component: API Development Kit and Quick Start Guide
      version: 10.2.1.0
      published: '2024-12-17'
      url: https://www.avaya.com/en/developer-support/sdks/
    - family: Avaya Oceana
      component: Digital Connector (Messaging) SDK
      version: '3.10'
      published: '2024-05-01'
      published_precision: month
      url: https://support.avaya.com/css/public/documents/101091621
    - family: Proactive Outreach Manager
      components: [Event SDK, Agent Desktop API (.NET and Java), Call Recorder API Sample Client, Pluggable Data Connector Installer]
      version: 4.0.2
      published: null
      url: https://support.avaya.com/css/public/documents/101090697
