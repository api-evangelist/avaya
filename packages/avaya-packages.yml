currency_finding: >-
  Two clocks run at different speeds. The cloud/UI packages move — @avaya/infinity-elements-api 1.3.2
  published 2026-08-26, Avaya Client SDK 4.38.1.0 in July 2026 — while every CPaaS client stopped in
  2020 (only cpaas-python saw a 2023 commit) and the Avaya Aura Contact Center SOAP SDKs have not
  been re-cut since 2015. A consumer integrating Avaya CPaaS today is pinning a six-year-old,
  never-1.0 library in whichever of the six languages they picked, and in four of those six there is
  no version to pin at all.
