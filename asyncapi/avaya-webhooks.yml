asyncapi_note: >-
  Avaya publishes no AsyncAPI document. The event surface is real and substantial — four subscription
  APIs across two platforms, delivering over webhook and WebSocket — but it is described only through
  the REST subscription-management contract and prose. Nothing here is fabricated: the channels,
  event families and transports below are read out of the harvested OpenAPI enums and descriptions.
delivery:
  transports: [WEBHOOK, WEBSOCKET]
  detail: >-
    AXP's Notification API lets a subscription choose transport type WEBHOOK or WEBSOCKET. Avaya
    Infinity's Notifications API delivers to a registered HTTP endpoint using POST or PUT (Transport.method).
  subscription_lifetime: >-
    Subscriptions are TIME-LIMITED and expire. Each API exposes a :renew action
    (POST /subscriptions/{subscriptionId}:renew) that must be called before expiry or delivery stops.
    An agent that subscribes and walks away silently loses the stream — this is the most important
    operational fact about Avaya's event surface.
  status_values: [ACTIVE, INACTIVE, PENDING]
